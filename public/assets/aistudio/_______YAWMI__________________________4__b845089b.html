      </div>

      <div id="food-photo-preview-box" style="display:none;align-items:center;gap:10px;background:var(--bg-surface-muted);padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);">
        <img id="food-photo-img" src="" alt="صورة الوجبة" style="width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--border-color);">
        <div style="flex:1;">
          <div id="food-detected-title" style="font-weight:800;color:var(--color-accent);">✓ تم التعرف على الصورة</div>
          <div id="food-detected-sub" style="font-size:0.74rem;color:var(--text-muted);">يمكنك تأكيد نوع الأكل أو تغييره من القائمة أدناه.</div>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="food-slot-select">فترة الوجبة *</label>
          <select id="food-slot-select" class="form-select">
            ${Object.values(MEAL_SLOTS_META).map(slot => `
              <option value="${escapeHtml(slot.id)}" ${slot.id === initialSlot ? 'selected' : ''}>${escapeHtml(slot.icon)} ${escapeHtml(slot.labelAr)}</option>
            `).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="food-cat-filter-modal">تصفية الأصناف</label>
          <select id="food-cat-filter-modal" class="form-select">
            ${Object.entries(FOOD_CATEGORIES_META).map(([k, v]) => `
              <option value="${escapeHtml(k)}">${escapeHtml(v.icon)} ${escapeHtml(v.labelAr)}</option>
            `).join('')}
          </select>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="food-item-select">نوع الأكل / الطبق *</label>
          <select id="food-item-select" class="form-select">
            ${FOOD_CALORIE_DATABASE.map(item => `
              <option value="${escapeHtml(item.id)}" ${item.id === initialFoodObj.id ? 'selected' : ''}>${escapeHtml(item.icon)} ${escapeHtml(item.nameAr)} (${item.kcalPer100g} kcal/100g)</option>
            `).join('')}
            <option value="custom">✨ صنف غذائي مخصص (إدخال يدوي للسعرات)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="food-grams-input">الكمية بالغرام (<span id="food-unit-hint">${escapeHtml(initialFoodObj.unitHintAr || 'حصة')}</span>) *</label>
          <input type="number" id="food-grams-input" class="form-input" min="5" max="3000" step="5" value="${escapeHtml(String(initialGrams))}">
        </div>
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button type="button" class="pill" data-portion-mult="0.5">نصف حصة (×0.5)</button>
        <button type="button" class="pill active" data-portion-mult="1">حصة قياسية (×1)</button>
        <button type="button" class="pill" data-portion-mult="1.5">حصة كبيرة (×1.5)</button>
        <button type="button" class="pill" data-portion-mult="2">حصتان (×2)</button>
      </div>

      <div id="food-custom-fields" class="form-row-2" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="food-custom-name">اسم الوجبة المخصصة</label>
          <input type="text" id="food-custom-name" class="form-input" placeholder="مثال: طاجين الحلو / ساندويتش خاص">
        </div>
        <div class="form-group">
          <label class="form-label" for="food-custom-kcal100">السعرات لكل 100 غرام</label>
          <input type="number" id="food-custom-kcal100" class="form-input" value="200" min="1">
        </div>
      </div>

      <div class="card" id="food-calc-result-card" style="background:var(--bg-surface-muted);border-color:var(--color-accent);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-weight:800;font-size:0.9rem;">🔥 إجمالي السعرات الحرارية للوجبة:</span>
          <span id="food-total-kcal-badge" style="font-size:1.25rem;font-weight:800;color:var(--color-accent);">495 kcal</span>
        </div>
        <div id="food-macros-row" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:0.75rem;color:var(--text-secondary);">
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🥩 بروتين<br><strong id="food-macro-p" style="color:var(--text-primary);">22.5 غ</strong></div>
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🍞 كارب<br><strong id="food-macro-c" style="color:var(--text-primary);">69.0 غ</strong></div>
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🥑 دهون<br><strong id="food-macro-f" style="color:var(--text-primary);">13.5 غ</strong></div>
          <div style="background:var(--bg-surface);padding:6px;border-radius:8px;">🌿 ألياف<br><strong id="food-macro-fib" style="color:var(--text-primary);">8.4 غ</strong></div>
        </div>
        <div id="food-health-tip-box" style="margin-top:8px;font-size:0.75rem;color:var(--color-accent);">
          💡 ${escapeHtml(initialFoodObj.healthTipAr || '')}
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="food-meal-note">ملاحظات إضافية حول الوجبة (اختياري)</label>
        <input type="text" id="food-meal-note" class="form-input" placeholder="مثال: بدون سكر / مع زيت زيتون...">
      </div>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="food-modal-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="food-modal-save">🍲 حفظ الأكل والسعرات</button>
  `;

  openModal({
    title: '🍲 إضافة أكل وحساب السعرات والماكروز',
    bodyHtml,
    footerHtml,
    onMount: (modalEl) => {
      const selectEl = document.getElementById('food-item-select');
      const catFilterEl = document.getElementById('food-cat-filter-modal');
      const gramsEl = document.getElementById('food-grams-input');
      const customWrap = document.getElementById('food-custom-fields');
      const customNameEl = document.getElementById('food-custom-name');
      const customKcalEl = document.getElementById('food-custom-kcal100');

      const computeCurrentMeal = () => {
        const selectedId = selectEl?.value || 'couscous_meat';
        const grams = Math.max(1, Number(gramsEl?.value || 100));
        if (selectedId === 'custom') {
          if (customWrap) customWrap.style.display = 'grid';
          const kcal100 = Math.max(1, Number(customKcalEl?.value || 200));
          const totalKcal = Math.round((kcal100 * grams) / 100);
          return {
            foodId: 'custom',
            nameAr: customNameEl?.value?.trim() || 'وجبة غذائية مخصصة',
            categoryAr: 'مخصص',
            icon: '🍽️',
            grams,
            totalKcal,
            protein: Math.round(totalKcal * 0.05 * 10) / 10,
            carbs: Math.round(totalKcal * 0.12 * 10) / 10,
            fat: Math.round(totalKcal * 0.03 * 10) / 10,
            fiber: 2.0,
            healthTipAr: 'وجبة مخصصة محسوبة حسب السعرات لكل 100 غرام.'
          };
        }
        if (customWrap) customWrap.style.display = 'none';
        const found = FOOD_CALORIE_DATABASE.find(x => x.id === selectedId) || FOOD_CALORIE_DATABASE[0];
        const ratio = grams / 100;
        return {
          foodId: found.id,
          nameAr: found.nameAr,
          categoryAr: found.categoryAr,
          icon: found.icon || '🍲',
          grams,
          totalKcal: Math.round(found.kcalPer100g * ratio),
          protein: Math.round(found.protein * ratio * 10) / 10,
          carbs: Math.round(found.carbs * ratio * 10) / 10,
          fat: Math.round(found.fat * ratio * 10) / 10,
          fiber: Math.round((found.fiber || 0) * ratio * 10) / 10,
          unitHintAr: found.unitHintAr,
          healthTipAr: found.healthTipAr
        };
      };

      const updateMacroPreview = () => {
        const res = computeCurrentMeal();
        const badge = document.getElementById('food-total-kcal-badge');
        const pEl = document.getElementById('food-macro-p');
        const cEl = document.getElementById('food-macro-c');
        const fEl = document.getElementById('food-macro-f');
        const fibEl = document.getElementById('food-macro-fib');
        const hintEl = document.getElementById('food-unit-hint');
        const tipEl = document.getElementById('food-health-tip-box');
        if (badge) badge.textContent = `${res.totalKcal} kcal`;
        if (pEl) pEl.textContent = `${res.protein} غ`;
        if (cEl) cEl.textContent = `${res.carbs} غ`;
        if (fEl) fEl.textContent = `${res.fat} غ`;
        if (fibEl) fibEl.textContent = `${res.fiber} غ`;
        if (hintEl && res.unitHintAr) hintEl.textContent = res.unitHintAr;
        if (tipEl && res.healthTipAr) tipEl.textContent = `💡 ${res.healthTipAr}`;
      };

      catFilterEl?.addEventListener('change', () => {
        const cat = catFilterEl.value;
        const list = cat === 'all'
          ? FOOD_CALORIE_DATABASE
          : FOOD_CALORIE_DATABASE.filter(x => x.category === cat);
        if (selectEl) {
          selectEl.innerHTML = list.map(item => `
            <option value="${escapeHtml(item.id)}">${escapeHtml(item.icon)} ${escapeHtml(item.nameAr)} (${item.kcalPer100g} kcal/100g)</option>
          `).join('') + `<option value="custom">✨ صنف غذائي مخصص (إدخال يدوي للسعرات)</option>`;
          if (list[0] && gramsEl) gramsEl.value = list[0].defaultGrams;
          updateMacroPreview();
        }
      });

      selectEl?.addEventListener('change', () => {
        const found = FOOD_CALORIE_DATABASE.find(x => x.id === selectEl.value);
        if (found && gramsEl) gramsEl.value = found.defaultGrams;
        updateMacroPreview();
      });

      modalEl.querySelectorAll('[data-portion-mult]').forEach(btn => {
        btn.addEventListener('click', () => {
          modalEl.querySelectorAll('[data-portion-mult]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const mult = Number(btn.getAttribute('data-portion-mult') || 1);
          const found = FOOD_CALORIE_DATABASE.find(x => x.id === selectEl?.value) || FOOD_CALORIE_DATABASE[0];
          if (gramsEl) {
            gramsEl.value = Math.round((found.defaultGrams || 200) * mult);
            updateMacroPreview();
          }
        });
      });

      gramsEl?.addEventListener('input', updateMacroPreview);
      customNameEl?.addEventListener('input', updateMacroPreview);
      customKcalEl?.addEventListener('input', updateMacroPreview);
      updateMacroPreview();

      const handleImageFile = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 480;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            attachedImageDataUrl = canvas.toDataURL('image/jpeg', 0.78);

            const detection = detectFoodFromImageAndCanvas(canvas, file.name);
            if (detection.matched && selectEl) {
              if (catFilterEl) catFilterEl.value = 'all';
              selectEl.innerHTML = FOOD_CALORIE_DATABASE.map(item => `
                <option value="${escapeHtml(item.id)}">${escapeHtml(item.icon)} ${escapeHtml(item.nameAr)} (${item.kcalPer100g} kcal/100g)</option>
              `).join('') + `<option value="custom">✨ صنف غذائي مخصص</option>`;
              selectEl.value = detection.matched.id;
              if (gramsEl) gramsEl.value = detection.matched.defaultGrams;
              updateMacroPreview();
            }

            const previewBox = document.getElementById('food-photo-preview-box');
            const previewImg = document.getElementById('food-photo-img');
            const detTitle = document.getElementById('food-detected-title');
            const detSub = document.getElementById('food-detected-sub');
            if (previewBox && previewImg) {
              previewImg.src = attachedImageDataUrl;
              previewBox.style.display = 'flex';
            }
            if (detTitle && detection.matched) {
              detTitle.textContent = `✓ نوع الأكل المقترح: ${detection.matched.nameAr}`;
            }
            if (detSub && detection.reasonAr) {
              detSub.textContent = detection.reasonAr;
            }
            showToast(`تم فتح الصورة والتعرف على: ${detection.matched?.nameAr || 'الوجبة'} 🍲`, 'success');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      document.getElementById('food-camera-capture-input')?.addEventListener('change', (e) => {
        handleImageFile(e.target.files?.[0]);
      });
      document.getElementById('food-gallery-file-input')?.addEventListener('change', (e) => {
        handleImageFile(e.target.files?.[0]);
      });

      document.getElementById('food-modal-cancel')?.addEventListener('click', closeModal);

      document.getElementById('food-modal-save')?.addEventListener('click', async () => {
        const meal = computeCurrentMeal();
        const mealSlot = document.getElementById('food-slot-select')?.value || 'lunch';
        const extraNote = document.getElementById('food-meal-note')?.value?.trim() || '';
        const targetDate = healthViewState?.referenceDate || getLocalDateString();

        await HealthCoachManager.logMeal({
          date: targetDate,
          mealSlot,
          foodId: meal.foodId,
          nameAr: meal.nameAr,
          categoryAr: meal.categoryAr,
          icon: meal.icon,
          grams: meal.grams,
          kcal: meal.totalKcal,
          protein: meal.protein,
          carbs: meal.carbs,
          fat: meal.fat,
          fiber: meal.fiber,
          photoDataUrl: attachedImageDataUrl || null,
          note: extraNote
        });

        await NotesRepo.saveNote({
          title: `🍲 وجبة (${MEAL_SLOTS_META[mealSlot]?.labelAr || 'اليوم'}): ${meal.nameAr} (${meal.totalKcal} سعرة)`,
          content: `الكمية: ${meal.grams} غرام | السعرات: ${meal.totalKcal} kcal | بروتين: ${meal.protein}غ | كربوهيدرات: ${meal.carbs}غ | دهون: ${meal.fat}غ.${extraNote ? '\nملاحظة: ' + extraNote : ''}${attachedImageDataUrl ? '\n[تم إرفاق صورة الوجبة محليًا]' : ''}`,
          noteType: 'text',
          category: 'تغذية وسعرات',
          tags: ['سعرات', 'غذاء', 'صحة'],
          foodImageDataUrl: attachedImageDataUrl || null
        });

        closeModal();
        showToast(`تم تسجيل وجبة «${meal.nameAr}» (${meal.totalKcal} سعرة حرارية) بنجاح ✓`, 'success', 4200);
        if (typeof onSaved === 'function') await onSaved();
      });
    }
  });
}

/**
 * 🏋️ نافذة إضافة رياضة / تمرين وحساب السعرات المحروقة بدقة حسب الوزن والشدة والمدة
 */
async function openSportWorkoutModal(preselectedSportId = null, onSaved = null) {
  const coachState = await HealthCoachManager.getState();
  const userWeight = coachState.profile?.weightKg || 75;
  const initialSport = SPORTS_EXERCISES_DATABASE.find(s => s.id === preselectedSportId) || SPORTS_EXERCISES_DATABASE[1];

  const bodyHtml = `
    <div class="form-grid" style="font-size:0.83rem;line-height:1.6;">
      <div style="background:var(--bg-surface-muted);padding:10px 12px;border-radius:var(--radius-sm);border-inline-start:4px solid var(--color-success);">
        🏋️ <strong>تسجيل رياضة وتمرين بدني:</strong><br>
        اختر نوع الرياضة من بين 34 رياضة وتمرينًا، وحدد المدة والشدة ليحسب التطبيق السعرات الحرارية المحروقة بدقة وفق وزنك الحالي (<strong>${userWeight} كغ</strong>).
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="sport-cat-filter-modal">تصنيف الرياضة</label>
          <select id="sport-cat-filter-modal" class="form-select">
            ${Object.entries(SPORT_CATEGORIES_META).map(([k, v]) => `
              <option value="${escapeHtml(k)}">${escapeHtml(v.icon)} ${escapeHtml(v.labelAr)}</option>
            `).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="sport-item-select">نوع الرياضة / التمرين *</label>
          <select id="sport-item-select" class="form-select">
            ${SPORTS_EXERCISES_DATABASE.map(sp => `
              <option value="${escapeHtml(sp.id)}" ${sp.id === initialSport.id ? 'selected' : ''}>${escapeHtml(sp.icon)} ${escapeHtml(sp.nameAr)}</option>
            `).join('')}
          </select>
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="form-label" for="sport-duration-input">مدة التمرين (بالدقائق) *</label>
          <input type="number" id="sport-duration-input" class="form-input" min="1" max="360" step="5" value="${initialSport.defaultMin || 30}">
        </div>
        <div class="form-group">
          <label class="form-label" for="sport-intensity-select">شدة التمرين *</label>
          <select id="sport-intensity-select" class="form-select">
            <option value="light">🟢 شدة خفيفة / إحماء</option>
            <option value="moderate" selected>🟡 شدة متوسطة / منتظمة</option>
            <option value="vigorous">🔴 شدة عالية / مكثفة</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${[15, 20, 30, 45, 60, 90].map(m => `
          <button type="button" class="pill ${m === (initialSport.defaultMin || 30) ? 'active' : ''}" data-sport-dur="${m}">${m} دقيقة</button>
        `).join('')}
      </div>

      <div class="card" style="background:var(--bg-surface-muted);border-color:var(--color-success);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
          <span style="font-weight:800;font-size:0.9rem;">🔥 السعرات المحروقة المقدّرة:</span>
          <span id="sport-burned-kcal-badge" style="font-size:1.3rem;font-weight:800;color:var(--color-success);">240 kcal</span>
        </div>
        <div style="font-size:0.76rem;color:var(--text-secondary);display:flex;flex-direction:column;gap:4px;">
          <div>💪 <strong>العضلات المستهدفة:</strong> <span id="sport-muscles-label">${escapeHtml(initialSport.musclesAr)}</span></div>
          <div>✨ <strong>الفائدة الصحية:</strong> <span id="sport-benefits-label">${escapeHtml(initialSport.benefitsAr)}</span></div>
          <div style="font-size:0.71rem;color:var(--text-muted);">المعادلة القياسية: معامل الجهد (MET <strong id="sport-met-val">${initialSport.metModerate}</strong>) × الوزن (${userWeight} كغ) × المدة بالساعات</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="sport-workout-note">ملاحظات التمرين (اختياري)</label>
        <input type="text" id="sport-workout-note" class="form-input" placeholder="مثال: تمرين مسائي / 4 جولات...">
      </div>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="sport-modal-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="sport-modal-save">🏋️ حفظ التمرين وحرق السعرات</button>
  `;

  openModal({
    title: '🏋️ تسجيل رياضة وحساب حرق السعرات',
    bodyHtml,
    footerHtml,
    onMount: (modalEl) => {
      const catEl = document.getElementById('sport-cat-filter-modal');
      const selectEl = document.getElementById('sport-item-select');
      const durEl = document.getElementById('sport-duration-input');
      const intEl = document.getElementById('sport-intensity-select');

      const updateSportPreview = () => {
        const sportId = selectEl?.value || 'brisk_walk';
        const mins = Math.max(1, Number(durEl?.value || 30));
        const intensity = intEl?.value || 'moderate';
        const calc = HealthCoachManager.calculateWorkoutCalories(sportId, mins, intensity, userWeight);

        const badge = document.getElementById('sport-burned-kcal-badge');
        const mEl = document.getElementById('sport-muscles-label');
        const bEl = document.getElementById('sport-benefits-label');
        const metEl = document.getElementById('sport-met-val');

        if (badge) badge.textContent = `${calc.burnedKcal} kcal`;
        if (mEl) mEl.textContent = calc.sport.musclesAr;
        if (bEl) bEl.textContent = calc.sport.benefitsAr;
        if (metEl) metEl.textContent = String(calc.met);
        return calc;
      };

      catEl?.addEventListener('change', () => {
        const cat = catEl.value;
        const list = cat === 'all'
          ? SPORTS_EXERCISES_DATABASE
          : SPORTS_EXERCISES_DATABASE.filter(s => s.category === cat);
        if (selectEl) {
          selectEl.innerHTML = list.map(sp => `
            <option value="${escapeHtml(sp.id)}">${escapeHtml(sp.icon)} ${escapeHtml(sp.nameAr)}</option>
          `).join('');
          if (list[0] && durEl) durEl.value = list[0].defaultMin || 30;
          updateSportPreview();
        }
      });

      selectEl?.addEventListener('change', () => {
        const sp = SPORTS_EXERCISES_DATABASE.find(s => s.id === selectEl.value);
        if (sp && durEl) durEl.value = sp.defaultMin || 30;
        updateSportPreview();
      });

      durEl?.addEventListener('input', updateSportPreview);
      intEl?.addEventListener('change', updateSportPreview);

      modalEl.querySelectorAll('[data-sport-dur]').forEach(btn => {
        btn.addEventListener('click', () => {
          modalEl.querySelectorAll('[data-sport-dur]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (durEl) {
            durEl.value = btn.getAttribute('data-sport-dur');
            updateSportPreview();
          }
        });
      });

      updateSportPreview();

      document.getElementById('sport-modal-cancel')?.addEventListener('click', closeModal);

      document.getElementById('sport-modal-save')?.addEventListener('click', async () => {
        const calc = updateSportPreview();
        const note = document.getElementById('sport-workout-note')?.value?.trim() || '';
        const targetDate = healthViewState?.referenceDate || getLocalDateString();

        await HealthCoachManager.logWorkout({
          date: targetDate,
          sportId: calc.sport.id,
          durationMin: calc.durationMin,
          intensity: calc.intensity,
          burnedKcal: calc.burnedKcal,
          note
        });

        closeModal();
        showToast(`تم تسجيل تمرين «${calc.sport.nameAr}» (${calc.durationMin} د • حرق ${calc.burnedKcal} سعرة) ✓`, 'success', 4200);
        if (typeof onSaved === 'function') await onSaved();
      });
    }
  });
}

            minsNow,

    healthViewState.liveTimerSeconds = 0;
    refreshHealth();
  });

    if (healthViewState.liveTimerIntervalId) clearInterval(healthViewState.liveTimerIntervalId);
    healthViewState.liveTimerIntervalId = null;
    healthViewState.liveTimerRunning = false;
    const mins = Math.max(5, Math.ceil((healthViewState.liveTimerSeconds || 900) / 60));
    healthViewState.liveTimerSeconds = 0;
    const entry = await HealthCoachManager.logWorkout({
      date: healthViewState.referenceDate,
      sportId: healthViewState.liveTimerSportId || 'brisk_walk',

      intensity: healthViewState.liveTimerIntensity || 'moderate'

    refreshHealth();

  containerEl.querySelectorAll('[data-del-workout]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-del-workout');
      await HealthCoachManager.deleteWorkout(id);

      refreshHealth();
    });
  });

  containerEl.querySelectorAll('[data-log-preset-prog]').forEach(btn => {
    btn.addEventListener('click', async () => {

      const entry = await HealthCoachManager.logWorkout({

        durationMin: prog.durationMin,

      showToast(`تم تسجيل البرنامج التدريبي «${prog.titleAr}» (حرق ${entry.burnedKcal} kcal) 🏅`, 'success');
      refreshHealth();
    });
  });

  containerEl.querySelectorAll('[data-sport-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      healthViewState.sportCategory = btn.getAttribute('data-sport-cat') || 'all';
      refreshHealth();
    });
  });

  document.getElementById('health-sport-search-input')?.addEventListener('input', (e) => {
    healthViewState.sportSearch = e.target.value || '';
    refreshHealth();
  });

  containerEl.querySelectorAll('[data-quick-log-sport]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const sportId = btn.getAttribute('data-quick-log-sport');
      const sp = SPORTS_EXERCISES_DATABASE.find(s => s.id === sportId);
      if (!sp) return;
      const entry = await HealthCoachManager.logWorkout({
        date: healthViewState.referenceDate,

        durationMin: sp.defaultMin || 30,
        intensity: 'moderate'
      });
      showToast(`تم تسجيل تمرين «${sp.nameAr}» (${entry.durationMin} د • حرق ${entry.burnedKcal} kcal) 🏋️`, 'success');
      refreshHealth();
    });
  });

  containerEl.querySelectorAll('[data-custom-log-sport]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sportId = btn.getAttribute('data-custom-log-sport');
      openSportWorkoutModal(sportId, refreshHealth);

  document.getElementById('hc-save-profile-btn')?.addEventListener('click', async () => {
    const gender = document.getElementById('hc-prof-gender')?.value || 'male';
    const age = Number(document.getElementById('hc-prof-age')?.value || 30);

function openCustomizeDashboardModal(onSaved) {
  const cards = structuredClone(appState.dashboardCards);

  const renderListHtml = () => cards.map((c, idx) => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg-surface-muted);border:1px solid var(--border-color);border-radius:var(--radius-sm);">
      <label style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:0.88rem;cursor:pointer;">
        <input type="checkbox" data-card-vis="${idx}" ${c.visible ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--color-primary);">
        <span>${escapeHtml(c.labelAr)}</span>
      </label>
      <div style="display:flex;gap:4px;">
        <button type="button" class="icon-btn" style="width:30px;height:30px;" data-move-up="${idx}" ${idx === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="icon-btn" style="width:30px;height:30px;" data-move-down="${idx}" ${idx === cards.length - 1 ? 'disabled' : ''}>↓</button>
      </div>
    </div>
  `).join('');

  const bodyHtml = `
    <p style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:10px;">
      رتّب أقسام الصفحة الرئيسية أو أخفِ ما لا تحتاج إليه. تُحفظ تفضيلاتك محليًا تلقائيًا.
    </p>
    <div id="customize-cards-list" class="item-list">${renderListHtml()}</div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="cust-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="cust-save">حفظ الترتيب</button>
  `;

  openModal({
    title: 'تخصيص بطاقات الصفحة الرئيسية',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const listEl = document.getElementById('customize-cards-list');
      const bindEvents = () => {
        listEl.querySelectorAll('[data-card-vis]').forEach(cb => {
          cb.addEventListener('change', () => {
            const idx = Number(cb.getAttribute('data-card-vis'));
            cards[idx].visible = cb.checked;
          });
        });
        listEl.querySelectorAll('[data-move-up]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-move-up'));
            if (idx > 0) {
              const tmp = cards[idx - 1];
              cards[idx - 1] = cards[idx];
              cards[idx] = tmp;
              listEl.innerHTML = renderListHtml();
              bindEvents();
            }
          });
        });
        listEl.querySelectorAll('[data-move-down]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-move-down'));
            if (idx < cards.length - 1) {
              const tmp = cards[idx + 1];
              cards[idx + 1] = cards[idx];
              cards[idx] = tmp;
              listEl.innerHTML = renderListHtml();
              bindEvents();
            }
          });
        });
      };
      bindEvents();

      document.getElementById('cust-cancel')?.addEventListener('click', closeModal);
      document.getElementById('cust-save')?.addEventListener('click', async () => {
        appState.dashboardCards = cards;
        saveCachedPreferences();
        closeModal();
        showToast('تم حفظ ترتيب بطاقات الرئيسية', 'success');
        if (typeof onSaved === 'function') await onSaved();
      });
    }
  });
}
async function renderDashboardView(containerEl, onRefreshApp) {
  const todayStr = getLocalDateString();
  const [tasks, events, transactions, habits, habitLogs, upcomingReminders, assistantAnalysis, healthRecords, healthSync, doroState] = await Promise.all([
    getAllRecords(STORE_NAMES.TASKS),
    getAllRecords(STORE_NAMES.EVENTS),
    getAllRecords(STORE_NAMES.TRANSACTIONS),
    getAllRecords(STORE_NAMES.HABITS),
    getAllRecords(STORE_NAMES.HABIT_LOGS),
    NotificationsService.getUpcomingReminders(),
    LocalAssistant.analyzeWorkspace({
      referenceDateStr: todayStr,
      weights: appState.assistantWeights,
      dismissedSuggestionIds: appState.dismissedSuggestionIds
    }),
    getAllRecords(STORE_NAMES.HEALTH_RECORDS),
    YawmiHealthAPI.getSyncStatus(),
    DoroManager.getState()
  ]);
  const doroOverview = DoroManager.calculateUnifiedOverview(transactions, doroState, todayStr.slice(0, 7));
  const todayHealth = HealthNormalizer.summarizePeriod(healthRecords, { referenceDate: todayStr, period: 'day', activeDeviceFamily: healthSync.primaryDevice?.family || null });

  // Calculate strict metrics from yawmiDB
  const totalTasksCount = tasks.length;
  const completedTasksCount = tasks.filter(t => t.status === 'completed').length;
  const remainingTasksCount = tasks.filter(t => t.status !== 'completed').length;
  const progressPct = totalTasksCount > 0 ? Math.round((completedTasksCount / totalTasksCount) * 100) : 0;

  const upcomingEvents = events
    .filter(ev => (ev.endDate || ev.startDate) >= todayStr)
    .sort((a, b) => {
      const d = String(a.startDate).localeCompare(String(b.startDate));
      if (d !== 0) return d;
      return String(a.startTime || '').localeCompare(String(b.startTime || ''));
    });

  const todayFinance = FinanceRepo.calculateSummary(transactions, {
    startDate: todayStr,
    endDate: todayStr
  });
  const monthFinance = FinanceRepo.calculateSummary(transactions, {
    month: todayStr.slice(0, 7)
  });

  const topOpenTasks = TasksRepo.filterAndSortTasks(tasks, { status: 'open', sortBy: 'priority' }, todayStr).slice(0, 4);
  const activeHabits = habits.filter(h => h.status === 'active');

  const hour = new Date().getHours();
  const greetingText = hour < 17 ? t('greeting_morning') : t('greeting_evening');

  // Render individual reorderable dashboard sections
  const sectionBuilders = {
    urgentTasks: () => `
      <section>
        <div class="section-header">
          <h2 class="section-title">${escapeHtml(t('top_tasks'))}</h2>
          <button type="button" class="section-link" data-dash-nav="planning" data-sub="tasks">${escapeHtml(t('view_all'))}</button>
        </div>
        <div class="item-list">
          ${topOpenTasks.length === 0
            ? `
              <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                <div>
                  <div style="font-weight:700;font-size:0.9rem;">${escapeHtml(t('no_tasks_today'))}</div>
                  <div style="font-size:0.78rem;color:var(--text-muted);">ابدأ يومك بإضافة مهامك الحقيقية الآن.</div>
                </div>
                <button type="button" class="btn btn-primary btn-sm" id="dash-add-first-task-btn">+ مهمة</button>
              </div>

/**
 * نافذة إضافة سوار ذكي جديد (Xiaomi Smart Band 10 / HONOR Band 4 / جهاز BLE)
 */
function openAddWearableDeviceModal(onSaved) {
  const bodyHtml = `
    <form id="yawmi-add-wearable-form" class="form-grid">
      <div style="font-size:0.8rem;color:var(--text-secondary);background:var(--bg-surface-muted);padding:10px 12px;border-radius:var(--radius-sm);">
        يسجل هذا النموذج ملف تعريف السوار الحقيقي في قائمة أجهزتك المحفوظة بحالة <strong>«غير متصل»</strong> إلى حين إجراء اتصال Bluetooth LE الفعلي.
      </div>
      <div class="form-group">
        <label class="form-label" for="wdev-family">نوع السوار / عائلة البروتوكول *</label>
        <select id="wdev-family" class="form-select">
          <option value="xiaomi_band_10">Xiaomi Smart Band 10 (بروتوكول Xiaomi Vela Protobuf 0xFE95)</option>
          <option value="honor_band_4">HONOR Band 4 (بروتوكول Huawei LinkLayer TLV 0xFE86)</option>
          <option value="generic_ble">جهاز Bluetooth LE قياسي آخر (قيد التوسعة)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="wdev-name">الاسم المعروض</label>
        <input type="text" id="wdev-name" class="form-input" placeholder="مثال: Xiaomi Smart Band 10 الخاص بي" value="Xiaomi Smart Band 10">
      </div>
      <div class="form-group">
        <label class="form-label" for="wdev-mac">عنوان البلوتوث (MAC Address) عند معرفته (اختياري)</label>
        <input type="text" id="wdev-mac" class="form-input" placeholder="AA:BB:CC:DD:EE:FF" dir="ltr">
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:0.84rem;font-weight:700;cursor:pointer;">
        <input type="checkbox" id="wdev-autoreconnect" checked style="accent-color:var(--color-primary);">
        <span>إعادة الاتصال التلقائي بالسوار المحفوظ عند فتح التطبيق على Android</span>
      </label>
    </form>
  `;
  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="wdev-cancel">إلغاء</button>
    <button type="button" class="btn btn-primary" id="wdev-save">حفظ ملف الجهاز</button>
  `;
  openModal({
    title: 'إضافة جهاز قابل للارتداء',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const famEl = document.getElementById('wdev-family');
      const nameEl = document.getElementById('wdev-name');
      famEl?.addEventListener('change', () => {
        if (famEl.value === 'xiaomi_band_10') nameEl.value = 'Xiaomi Smart Band 10';
        else if (famEl.value === 'honor_band_4') nameEl.value = 'HONOR Band 4';
        else nameEl.value = 'سوار ذكي BLE';
      });
      document.getElementById('wdev-cancel')?.addEventListener('click', closeModal);
      document.getElementById('wdev-save')?.addEventListener('click', async () => {
        try {
          await YawmiHealthAPI.registerDeviceProfile({
            family: famEl.value,
            name: nameEl.value,
            macAddress: document.getElementById('wdev-mac').value,
            autoReconnect: document.getElementById('wdev-autoreconnect').checked
          });
          closeModal();
          showToast('تمت إضافة الجهاز إلى القائمة (الحالة: غير متصل)', 'success');
          if (typeof onSaved === 'function') await onSaved();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    }
  });
}

/**
 * نافذة إعداد مفتاح المصادقة الآمن (Android Keystore) وتفاصيل بروتوكول السوار
 */
async function openWearableProtocolAndAuthModal(deviceId, onSaved) {
  const dev = await YawmiHealthAPI.getDeviceStatus(deviceId);
  if (!dev) return;
  const prof = dev.capabilityProfile || DEVICE_CAPABILITY_PROFILES.xiaomi_band_10;

  const bodyHtml = `
    <div class="form-grid">
      <div class="card" style="background:var(--bg-surface-muted);font-size:0.81rem;line-height:1.6;">
        <div><strong>الجهاز:</strong> ${escapeHtml(dev.name)} (${escapeHtml(prof.modelCode)})</div>
        <div><strong>البروتوكول الفعلي:</strong> ${escapeHtml(prof.protocolName)}</div>
        <div><strong>التطبيق الرسمي الموافق:</strong> ${escapeHtml(prof.officialApp)}</div>
        <div style="margin-top:6px;"><strong>القياسات المدعومة:</strong> ${escapeHtml(prof.supportedMetrics.map(k => HEALTH_METRIC_DEFS[k]?.labelAr || k).join('، '))}</div>
        <div style="color:var(--color-danger);"><strong>غير مدعوم:</strong> ${escapeHtml(prof.unsupportedMetrics.map(k => HEALTH_METRIC_DEFS[k]?.labelAr || k).join('، ') || 'لا يوجد')}</div>
      </div>

      <div style="font-size:0.79rem;color:var(--text-secondary);background:var(--bg-surface-muted);padding:10px 12px;border-radius:var(--radius-sm);border-inline-start:3px solid var(--color-warning);">
        <strong>قيود تقنية موثقة (Gadgetbridge & Official Docs):</strong>
        <ul style="margin-top:4px;padding-inline-start:16px;list-style:disc;">
          ${prof.limitationsAr.map(lim => `<li>${escapeHtml(lim)}</li>`).join('')}
        </ul>
      </div>

      <div class="form-group">
        <label class="form-label" for="wauth-secret-input">
          ${dev.family === 'xiaomi_band_10' ? 'مفتاح المصادقة (Auth Key 32-Hex مسبوق بـ 0x)' : 'معرّف حساب Huawei للتعايش دون فرمتة (17-digit HUID - اختياري)'}
        </label>
        <div style="display:flex;gap:6px;">
          <input type="text" id="wauth-secret-input" class="form-input" style="flex:1;" dir="ltr" autocomplete="off" value="${dev.family === 'xiaomi_band_10' ? '0x46fec12c98382d00aabbccddeeff0011' : '20007000023812345'}">
          <button type="button" class="btn btn-secondary btn-sm" id="wauth-gen-key-btn">توليد مفتاح</button>
        </div>
        <span style="font-size:0.73rem;color:var(--text-muted);">
          🔒 لا نطلب كلمة مرور حسابك أبدًا، ولا نخزن هذا المفتاح كنص صريح؛ يُشفر بواسطة <strong>Android Keystore (AES/GCM/NoPadding)</strong> في الإضافة الأصلية.
        </span>
      </div>
    </div>
  `;

  const footerHtml = `
    <button type="button" class="btn btn-secondary" id="wauth-close">إغلاق</button>
    <button type="button" class="btn btn-primary" id="wauth-save">التحقق وحفظ المفتاح بأمان</button>
  `;

  openModal({
    title: `بروتوكول ومصادقة ${dev.name}`,
    bodyHtml,
    footerHtml,
    onMount: () => {
      document.getElementById('wauth-close')?.addEventListener('click', closeModal);
      document.getElementById('wauth-gen-key-btn')?.addEventListener('click', () => {
        const inp = document.getElementById('wauth-secret-input');
        if (!inp) return;
        inp.value = dev.family === 'xiaomi_band_10'
          ? XiaomiBand10Protocol.generateCompliantAuthKey()
          : HonorBand4Protocol.generateCompliantHuid();
      });
      document.getElementById('wauth-save')?.addEventListener('click', async () => {
        const val = document.getElementById('wauth-secret-input')?.value || '';
        try {
          const res = await YawmiHealthAPI.setDeviceAuthKey(dev.id, val);
          closeModal();
          showToast(res.notice || 'تم تشفير وحفظ مفتاح المصادقة في Android Keystore بنجاح ✓', 'success', 4800);
          if (typeof onSaved === 'function') await onSaved();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    }
  });
}

async function renderGlobalReportsView(containerEl) {
  const todayStr = getLocalDateString();
  const monthKey = todayStr.slice(0, 7);
  const [tasks, events, transactions, habits, habitLogs, notes] = await Promise.all([
    getAllRecords(STORE_NAMES.TASKS),
    getAllRecords(STORE_NAMES.EVENTS),
    getAllRecords(STORE_NAMES.TRANSACTIONS),
    getAllRecords(STORE_NAMES.HABITS),
    getAllRecords(STORE_NAMES.HABIT_LOGS),
    getAllRecords(STORE_NAMES.NOTES)
  ]);

  const completedTasks = tasks.filter(t => t.status === 'completed').length;
  const taskCompletionRate = tasks.length > 0 ? Math.round((completedTasks / tasks.length) * 100) : 0;
  const monthFin = FinanceRepo.calculateSummary(transactions, { month: monthKey });
  const activeHabits = habits.filter(h => h.status === 'active');
  const avgHabitAdherence = activeHabits.length > 0
    ? Math.round(
        activeHabits.reduce((acc, h) => acc + HabitsRepo.calculateHabitStats(h, habitLogs, todayStr).adherencePercent, 0) /
        activeHabits.length
      )
    : 0;

  containerEl.innerHTML = `
    <div class="card">
      <h3 class="section-title" style="margin-bottom:10px;">📊 التقرير الشامل للإنتاجية والحياة اليومية</h3>

        <div class="kpi-box">
          <div class="kpi-box-label">التزام العادات</div>
          <div class="kpi-box-val">${avgHabitAdherence}%</div>
        </div>
        <div class="kpi-box">
          <div class="kpi-box-label">المواعيد والملاحظات</div>

      <div style="display:flex;flex-direction:column;gap:6px;font-size:0.88rem;">

          <span>إجمالي الدخل المسجل:</span>

            <div style="font-size:0.75rem;color:var(--text-muted);">
              الأجهزة ذات الأولوية: <strong>Xiaomi Smart Band 10</strong> • <strong>HONOR Band 4</strong>
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="btn btn-secondary btn-sm" id="set-ble-add-device-btn">+ إضافة جهاز</button>
            <button type="button" class="btn btn-primary btn-sm" id="set-ble-scan-btn">🔍 البحث عن الأجهزة</button>
            <button type="button" class="btn btn-primary btn-sm" id="set-open-wizard-btn" style="background:var(--color-gold);color:#082218;">🔍 تشخيص الربط الحقيقي</button>
          </div>
        </div>

        <!-- قائمة الأجهزة المكتشفة والمحفوظة -->
        <div class="item-list">
          ${savedWearables.length === 0 ? `
            <div style="padding:12px;background:var(--bg-surface-muted);border-radius:var(--radius-sm);font-size:0.8rem;color:var(--text-muted);text-align:center;">
              لا توجد أساور مضافة حاليًا. اضغط «+ إضافة جهاز» أو «البحث عن الأجهزة» لإقران Xiaomi Smart Band 10 أو HONOR Band 4.
            </div>
          ` : savedWearables.map(dev => {
            const st = CONNECTION_STATE_LABELS[dev.connectionState] || CONNECTION_STATE_LABELS.disconnected;
            return `
              <div style="background:var(--bg-surface-muted);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                  <div>
                    <div style="font-weight:800;font-size:0.9rem;">⌚ ${escapeHtml(dev.name)}</div>
                    <div style="font-size:0.73rem;color:var(--text-muted);">
                      العائلة: <strong>${escapeHtml(dev.family)}</strong>
                      ${dev.rssi !== null && dev.rssi !== undefined ? ` • قوة الإشارة: ${dev.rssi} dBm` : ''}
                      • البطارية: <strong>${dev.batteryLevel !== null && dev.batteryLevel !== undefined ? `${dev.batteryLevel}%` : 'غير متاح'}</strong>
                    </div>
                  </div>
                  <span class="badge ${st.badge}">${escapeHtml(st.text)}</span>
                </div>

                <div style="font-size:0.72rem;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:10px;">
                  <span>آخر اتصال: <strong>${escapeHtml(dev.lastConnectedAt ? dev.lastConnectedAt.slice(0, 16).replace('T', ' ') : 'لم يتصل بعد')}</strong></span>
                  <span>آخر مزامنة: <strong>${escapeHtml(dev.lastSyncedAt ? dev.lastSyncedAt.slice(0, 16).replace('T', ' ') : 'لا توجد')}</strong></span>
                </div>

                ${dev.lastError ? `
                  <div style="font-size:0.74rem;color:var(--color-danger);background:var(--color-danger-bg);padding:6px 9px;border-radius:var(--radius-xs);">
                    ⚠️ ${escapeHtml(dev.lastError)}
                  </div>
                ` : ''}

                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${dev.connectionState === 'connected' ? `
                    <button type="button" class="btn btn-primary btn-sm" data-wdev-sync="${escapeHtml(dev.id)}">مزامنة الآن</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-wdev-disconnect="${escapeHtml(dev.id)}">قطع الاتصال</button>
                  ` : `
                    <button type="button" class="btn btn-primary btn-sm" data-wdev-connect="${escapeHtml(dev.id)}">اتصال</button>
                  `}
                  <button type="button" class="btn btn-secondary btn-sm" data-wdev-auth="${escapeHtml(dev.id)}">🔑 البروتوكول والمصادقة</button>
                  <button type="button" class="btn btn-danger btn-sm" data-wdev-remove="${escapeHtml(dev.id)}">إزالة</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <!-- تكامل Android Health Connect & Google Fit -->
        <div style="border-top:1px solid var(--border-color);padding-top:12px;display:flex;flex-direction:column;gap:8px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:800;font-size:0.9rem;">🛡️ تكامل Android Health Connect (المصدر الأساسي)</div>
              <div style="font-size:0.75rem;color:var(--text-muted);">
                الحالة: <strong>${healthSyncStatus.healthConnectLinked ? 'مرتبط ومفعّل ✓' : (healthSyncStatus.healthConnectSdkStatus === 'requires_native_android_apk' ? 'يتطلب تشغيل حزمة Android APK الأصلية' : 'غير مرتبط')}</strong>
                • آخر مزامنة ناجحة: <strong>${escapeHtml(healthSyncStatus.lastSuccessfulSyncAt ? healthSyncStatus.lastSuccessfulSyncAt.slice(0, 16).replace('T', ' ') : 'لا توجد')}</strong>
              </div>
            </div>
            <div style="display:flex;gap:6px;">
              <button type="button" class="btn btn-primary btn-sm" id="set-hc-connect-btn">ربط Health Connect</button>
              <button type="button" class="btn btn-secondary btn-sm" id="set-hc-sync-btn">مزامنة الآن</button>
            </div>
          </div>

          <!-- مصادر البيانات ووضع Google Fit (إيقاف 2026) -->
          <div style="background:var(--bg-surface-muted);padding:10px 12px;border-radius:var(--radius-sm);font-size:0.77rem;color:var(--text-secondary);line-height:1.55;">
            <div><strong>حالة المصادر المعتمدة في التطبيق:</strong></div>
            <div>• <strong>Health Connect:</strong> ${healthSyncStatus.healthConnectLinked ? 'متصل ويقرأ السجلات المسموحة' : 'جاهز للربط عند التشغيل على Android (أو استيراد JSON)'}</div>
            <div>• <strong>Google Fit (إيقاف واجهات Fit القديمة في 2026):</strong> لا يعتمد التطبيق على واجهات Google Fit المهملة؛ يقرأ سجلات Google Fit (<code>com.google.android.apps.fitness</code>) المتزامنة داخل Health Connect تلقائيًا دون طلب مفاتيح OAuth (${healthSyncStatus.hasGoogleFitRecords ? 'تم التحقق من وجود سجلات Google Fit ✓' : 'لم يتم رصد سجلات Google Fit بعد'}).</div>
            <div>• <strong>التطبيقات الرسمية (Mi Fitness / Huawei Health):</strong> ننصح بتفعيل مزامنتها مع Health Connect لقراءة الخطوات والنبض والنوم والأكسجين بأعلى دقة ودون تعارض اتصال Bluetooth.</div>
          </div>

          <!-- المزامنة الخلفية والخصوصية وحذف البيانات الصحية -->
          <label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;font-weight:700;cursor:pointer;margin-top:4px;">
            <input type="checkbox" id="set-hc-bg-sync-chk" ${healthSyncStatus.backgroundSyncEnabled ? 'checked' : ''} style="accent-color:var(--color-primary);">
            <span>تفعيل المزامنة الدورية في الخلفية عبر Android WorkManager (مع احترام قيود البطارية)</span>
          </label>

          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
            <button type="button" class="btn btn-secondary btn-sm" id="set-health-privacy-report-btn">📄 الخصوصية وتقرير حالة الميزات</button>
            <button type="button" class="btn btn-danger btn-sm" id="set-health-revoke-clear-btn">🗑️ إلغاء الربط وحذف البيانات الصحية</button>
          </div>
        </div>
      </div>
    </div>

  if (sub !== 'menu') {
    const titles = {
      habits: t('more_habits'),

/**
 * YAWMI — Database Layer Automated Tests (Section 20.1)
 */
async function runDatabaseTests(assert) {
  const testDb = 'yawmi_test_db_layer';
  await initDatabase(testDb, 1);
  for (const s of Object.values(STORE_NAMES)) {
    await clearStore(s, testDb);
  }

  // 1. Database & 10 stores + indexes creation
  const meta = await getDatabaseMetadata(testDb);
  assert(meta.name === testDb, 'إنشاء قاعدة البيانات بالاسم المحدد');
  assert(meta.storeNames.length === 13, 'إنشاء جميع المخازن الثلاثة عشر المطلوبة (13 stores شاملة مخازن الصحة والأساور)');
  assert(meta.indexes.tasks.includes('dueDate') && meta.indexes.habitLogs.includes('habitDate'), 'إنشاء الفهارس المطلوبة للتاريخ والحالة والمعرفات');

  // 2. Add record
  const rec = await addRecord('tasks', { id: 't_db_1', title: 'اختبار قاعدة البيانات', status: 'open', priority: 'high' }, testDb);
  assert(rec.id === 't_db_1', 'إضافة سجل جديد بنجاح');

  // 3. Read record
  const fetched = await getRecord('tasks', 't_db_1', testDb);
  assert(fetched && fetched.title === 'اختبار قاعدة البيانات', 'قراءة السجل المحفوظ من القاعدة');

  // 4. Update record
  await updateRecord('tasks', { ...fetched, title: 'عنوان محدّث', status: 'completed' }, testDb);
  const afterUpdate = await getRecord('tasks', 't_db_1', testDb);
  assert(afterUpdate.title === 'عنوان محدّث' && afterUpdate.status === 'completed', 'تعديل السجل وحفظ التغييرات');

  // 5. Handle invalid data (missing ID or invalid store)
  let rejectedInvalid = false;
  try {
    await addRecord('tasks', { title: 'بدون معرف' }, testDb);
  } catch {
    rejectedInvalid = true;
  }
  assert(rejectedInvalid, 'رفض وحماية القاعدة من السجلات غير الصالحة (بدون معرّف id)');

  // 6. Data persistence across re-opening connection & schema upgrade v1 -> v2
  const upgradedConn = await initDatabase(testDb, 2);
  const afterUpgrade = await getRecord('tasks', 't_db_1', testDb);
  assert(Boolean(upgradedConn) && afterUpgrade && afterUpgrade.title === 'عنوان محدّث', 'الاحتفاظ بالبيانات بعد إعادة الفتح وترقية إصدار مخطط القاعدة (v1 -> v2)');

  // 7. Delete record
  await deleteRecord('tasks', 't_db_1', testDb);
  const afterDelete = await getRecord('tasks', 't_db_1', testDb);
  assert(afterDelete === null, 'حذف السجل من قاعدة البيانات بنجاح');
}

/**

async function runTasksTests(assert) {
  const testDb = 'yawmi_test_tasks_db';
  await initDatabase(testDb, 1);
  await clearStore('tasks', testDb);
  await clearStore('reminders', testDb);

  const today = '2026-10-20';
  const yesterday = '2026-10-19';
  const tomorrow = '2026-10-21';

  // 1. Add task with valid title
  const t1 = await TasksRepo.createTask({
    title: 'إنهاء التقرير المالي',
    priority: 'medium',
    dueDate: today,
    estimatedMinutes: 45
  }, testDb);
  assert(t1.id && t1.title === 'إنهاء التقرير المالي', 'إضافة مهمة بعنوان صحيح');

  // 2. Reject empty title
  let emptyRejected = false;
  try {
    await TasksRepo.createTask({ title: '   ' }, testDb);
  } catch {
    emptyRejected = true;
  }
  assert(emptyRejected, 'رفض إضافة مهمة بعنوان فارغ');

  // 3. Change priority
  const updatedPrio = await TasksRepo.updateTask(t1.id, { priority: 'urgent' }, testDb);
  assert(updatedPrio.priority === 'urgent', 'تغيير أولوية المهمة إلى عاجلة');

  // 4. Complete task
  const completed = await TasksRepo.toggleTaskCompletion(t1.id, testDb);
  assert(completed.status === 'completed' && Boolean(completed.completedAt), 'إكمال المهمة وتسجيل تاريخ الإنجاز');

  // Re-open task for search/filter tests
  await TasksRepo.toggleTaskCompletion(t1.id, testDb);

  // Add overdue and tomorrow tasks
  const tOverdue = await TasksRepo.createTask({
    title: 'تسديد فاتورة الإنترنت',
    priority: 'high',
    dueDate: yesterday
  }, testDb);

  await TasksRepo.createTask({
    title: 'شراء مستلزمات المكتب',
    priority: 'low',
    dueDate: tomorrow
  }, testDb);

  const allTasks = await getAllRecords('tasks', testDb);

  // 5. Instant search
  const searchRes = TasksRepo.filterAndSortTasks(allTasks, { query: 'فاتورة' }, today);
  assert(searchRes.length === 1 && searchRes[0].id === tOverdue.id, 'البحث الفوري في المهام');

  // 6. Filter by date (today & overdue)
  const todayRes = TasksRepo.filterAndSortTasks(allTasks, { timeScope: 'today' }, today);
  const overdueRes = TasksRepo.filterAndSortTasks(allTasks, { timeScope: 'overdue' }, today);
  assert(todayRes.length === 1 && overdueRes.length === 1, 'تصفية المهام حسب التاريخ (اليوم والمتأخرة)');

  // 7. Delete task
  await TasksRepo.deleteTask(t1.id, testDb);
  const remaining = await getAllRecords('tasks', testDb);
  assert(remaining.length === 2 && !remaining.some(x => x.id === t1.id), 'حذف المهمة بنجاح');
}

/**
 * YAWMI — Finance & Budgets Automated Tests (Section 20.3)
 */
async function runFinanceTests(assert) {
  const testDb = 'yawmi_test_finance_db';
  await initDatabase(testDb, 1);
  await clearStore('transactions', testDb);
  await clearStore('budgets', testDb);

  // 1. Add income and expenses in October 2026 & September 2026
  const inc1 = await FinanceRepo.createTransaction({
    type: 'income',
    amount: '85000',
    categoryId: 'cat_salary',
    date: '2026-10-01',
    description: 'الراتب الشهري'
  }, testDb);

  const exp1 = await FinanceRepo.createTransaction({
    type: 'expense',
    amount: '1250.75',
    categoryId: 'cat_food',
    date: '2026-10-15',
    description: 'مشتريات غذائية'
  }, testDb);

  const exp2 = await FinanceRepo.createTransaction({
    type: 'expense',
    amount: '349.25',
    categoryId: 'cat_food',
    date: '2026-10-18',
    description: 'خضر وفواكه'
  }, testDb);

  // Previous month transaction
  await FinanceRepo.createTransaction({
    type: 'expense',
    amount: '5000',
    categoryId: 'cat_bills',
    date: '2026-09-20',
    description: 'فاتورة الشهر الماضي'
  }, testDb);

  // Reject zero or negative amount
  let invalidAmountRejected = false;
  try {
    await FinanceRepo.createTransaction({ type: 'expense', amount: '-200', categoryId: 'cat_food' }, testDb);
  } catch {
    invalidAmountRejected = true;
  }
  assert(invalidAmountRejected, 'رفض المبالغ السالبة أو الصفرية غير الصالحة');

  const allTxs = await getAllRecords('transactions', testDb);

  // 2, 3, 4, 5. Monthly filter + Total Income + Total Expense + Net + Exact Decimal Math
  const octSummary = FinanceRepo.calculateSummary(allTxs, { month: '2026-10' });
  assert(octSummary.income === 85000, 'حساب مجموع الدخل الشهري بدقة (85,000 د.ج)');
  assert(octSummary.expense === 1600 && octSummary.expenseMinor === 160000, 'التعامل مع القيم العشرية المالية بدقة الوحدات الصغرى (1250.75 + 349.25 = 1600.00)');
  assert(octSummary.net === 83400, 'حساب الصافي الشهري بدقة (85,000 - 1,600 = 83,400 د.ج)');
  assert(octSummary.count === 3, 'تصفية الفترة الشهرية واستبعاد عمليات الأشهر الأخرى');

  // 6. Budget exceeded detection
  await FinanceRepo.setBudget({
    month: '2026-10',
    categoryId: 'cat_food',
    limitAmount: '1500'
  }, testDb);

  const budgetEval = await FinanceRepo.evaluateBudgets('2026-10', testDb);
  assert(
    budgetEval.length === 1 && budgetEval[0].isExceeded === true && budgetEval[0].remaining === -100,
    'التحقق من تجاوز الميزانية وحساب المتبقي بدقة'
  );

  // 7. Ensure duplicate transaction reference is never counted twice
  const duplicatedArray = [inc1, exp1, exp1, exp2];
  const dedupSummary = FinanceRepo.calculateSummary(duplicatedArray, { month: '2026-10' });
  assert(dedupSummary.expense === 1600 && dedupSummary.count === 3, 'التأكد من عدم احتساب العملية المالية نفسها مرتين');

  // 8. اختبار خصائص تطبيق الدورو DORO (رصيد الكاش والمحفظة، المشتريات المخطط لها، محول الدورو، والـ RIP)

  );

async function runHabitsTests(assert) {
  const testDb = 'yawmi_test_habits_db';

  // 2026-10-18 is Sunday (0), 2026-10-19 is Monday (1), 2026-10-20 is Tuesday (2)
  // Create a habit scheduled ONLY on Sunday (0) and Tuesday (2) — Monday (1) is an unscheduled rest day
  const habit = await HabitsRepo.createHabit({
    name: 'تمارين القوة',
    targetType: 'daily',
    targetValue: 1,
    repeatDays: [0, 2],
    startDate: '2026-10-18'
  }, testDb);

  // 1. Log completion for Sunday and Tuesday
  await HabitsRepo.logHabit(habit.id, '2026-10-18', 1, 'تم بنجاح', testDb);
  await HabitsRepo.logHabit(habit.id, '2026-10-20', 1, 'تم بنجاح', testDb);

  // 2. Prevent duplicate log for the same habit and date
  let duplicateBlocked = false;
  try {
    await HabitsRepo.logHabit(habit.id, '2026-10-20', 1, 'مكرر', testDb);
  } catch {
    duplicateBlocked = true;
  }

  assert(importRes.success && restoredTasks.length === 1, 'استيراد نسخة احتياطية صحيحة واستعادة جميع السجلات');
}

/**
 * YAWMI — Health, Wearables & HealthConnectService Automated Tests (المرحلة العاشرة)
 * يختبر جميع دوال HealthConnectService الـ 12، الحالات الـ 8 المنفصلة، التجميع ومنع التكرار،
 * ودمج مراحل النوم المتداخلة، واكتشاف سحب الصلاحيات، وعدم مسح البيانات عند الفشل.
 */
async function runHealthAndWearablesTests(assert) {
  const testDb = 'yawmi_test_health_db';
  await initDatabase(testDb, 1);
  for (const s of Object.values(STORE_NAMES)) {
    await clearStore(s, testDb);
  }

  const refDate = '2026-10-20';

  // 0. التحقق من موسوعة الأكلات (52 أكلة) والرياضات (34 رياضة) ومحرك الاقتراحات الذكية وحاسبة الجسم
  assert(
    Array.isArray(FOOD_CALORIE_DATABASE) && FOOD_CALORIE_DATABASE.length >= 50 &&
    Array.isArray(SPORTS_EXERCISES_DATABASE) && SPORTS_EXERCISES_DATABASE.length >= 30 &&
    typeof HealthCoachManager === 'object',
    'توفير موسوعة الأكلات الشاملة (52 أكلة) وموسوعة الرياضات (34 رياضة) ومحرك HealthCoachManager'
  );
  const bmCheck = HealthCoachManager.calculateBodyMetrics({ gender: 'male', age: 30, heightCm: 175, weightKg: 75, activityLevel: 'moderate', goalType: 'lose' });
  assert(
    bmCheck.bmi > 20 && bmCheck.bmr > 1400 && bmCheck.tdee > bmCheck.bmr && bmCheck.targetKcal === bmCheck.tdee - 450,
    'حساب مؤشر كتلة الجسم BMI والأيض الأساسي BMR وحرق الثبات TDEE وهدف السعرات بدقة'
  );

  // 1. التحقق من وجود جميع الدوال الـ 12 المطلوبة في HealthConnectService (المرحلة الرابعة)
  const requiredMethods = [
    'checkAvailability',
    'requestPermissions',
    'checkPermissions',
    'readTodaySummary',
    'readSteps',
    'readDistance',
    'readCalories',
    'readHeartRate',
    'readSleep',
    'readWeight',
    'readExerciseSessions',
    'getLastSyncStatus'
  ];
  const allTwelveExist = requiredMethods.every(fn => typeof HealthConnectService[fn] === 'function');
  assert(allTwelveExist, 'توفير جميع الدوال الـ 12 الإلزامية في HealthConnectService');

  // 2. التحقق من الحالات الـ 8 المنفصلة لواجهة المستخدم (المرحلة السابعة)
  const stateCodes = Object.values(HealthConnectService.HC_UI_STATES).map(s => s.code);
  const expectedEight = [
    'unlinked',
    'checking',
    'needs_permissions',
    'reading_data',
    'read_success',
    'no_data',
    'connection_failed',
    'permission_revoked'
  ];
  assert(
    expectedEight.every(c => stateCodes.includes(c)) &&
    HealthConnectService.getUiStateInfo('no_data').bannerTextAr === 'تم الربط، لا توجد بيانات متاحة',
    'توفر الحالات الـ 8 المنفصلة لواجهة Health Connect شاملة «تم الربط، لا توجد بيانات متاحة»'
  );

  // 3. عدم عرض قيمة 0 عندما تكون البيانات غير متاحة (عرض «لا توجد بيانات» أو «غير مدعوم»)
  const emptySummary = HealthNormalizer.summarizePeriod([], {
    referenceDate: refDate,
    period: 'day',
    activeDeviceFamily: 'honor_band_4'
  });
  assert(
    emptySummary.metrics.steps.available === false &&
    emptySummary.metrics.steps.value === null &&
    emptySummary.metrics.steps.displayText === 'لا توجد بيانات',
    'عرض «لا توجد بيانات» بدلًا من الصفر (0) عند غياب سجلات الخطوات'
  );
  assert(
    emptySummary.metrics.spo2.unsupported === true &&
    emptySummary.metrics.spo2.displayText === 'غير مدعوم في السوار الحالي',
    'عرض «غير مدعوم في السوار الحالي» لمؤشر SpO₂ عند اختيار HONOR Band 4'
  );

  // 4. منع تكرار الخطوات بين مستشعر الهاتف والسوار الذكي لنفس اليوم
  await HealthNormalizer.ingestHealthRecords([
    {
      sourceRecordId: 'phone_steps_20261020',
      metricType: 'steps',
      value: 4200,
      startTime: '2026-10-20T08:00:00.000Z',
      endTime: '2026-10-20T18:00:00.000Z',
      localDate: refDate,
      sourceType: 'phone_sensor',
      deviceModel: 'Android Phone Sensor'
    },
    {
      sourceRecordId: 'band10_steps_20261020',
      metricType: 'steps',
      value: 6850,
      startTime: '2026-10-20T08:00:00.000Z',
      endTime: '2026-10-20T18:30:00.000Z',
      localDate: refDate,
      sourceType: 'xiaomi_band_10_ble',
      sourcePackage: 'com.xiaomi.wearable',
      deviceModel: 'Xiaomi Smart Band 10'
    }
  ], {}, testDb);

  const stepsRead = await HealthConnectService.readSteps({ date: refDate }, testDb);
  assert(
    stepsRead.available === true && stepsRead.value === 6850 && stepsRead.sourceNameAr === 'Health Connect (Mi Fitness)',
    'قراءة الخطوات عبر readSteps() ومنع جمع خطوات الهاتف (4200) مع خطوات السوار (6850)'
  );

  // 5. اختبار دمج مراحل النوم المتداخلة لمنع جمعها مرتين (المرحلة السادسة)
  const sleepOverlapCheck = HealthConnectService.mergeOverlappingSleepStages([
    { stage: 'light', startTime: '2026-10-20T01:00:00.000Z', endTime: '2026-10-20T03:00:00.000Z' }, // 120 د
    { stage: 'deep', startTime: '2026-10-20T02:00:00.000Z', endTime: '2026-10-20T04:00:00.000Z' }   // متداخلة ساعة (المجموع الفعلي 180 د وليس 240 د)
  ]);
  assert(
    sleepOverlapCheck.totalStageMinutes === 180 && sleepOverlapCheck.mergedIntervalsCount === 1,
    'دمج مراحل النوم المتداخلة زمنيًا (180 دقيقة فعلية بدل 240 دقيقة مكررة)'
  );

  // 6. الحفاظ على قراءات النبض المتقاربة زمنيًا وقراءة الوزن والتمارين عبر الدوال المخصصة
  await HealthNormalizer.ingestHealthRecords([
    {
      sourceRecordId: 'hr_sample_1',
      metricType: 'heart_rate',
      value: 72,
      startTime: '2026-10-20T10:01:00.000Z',
      endTime: '2026-10-20T10:01:00.000Z',
      localDate: refDate,
      sourceType: 'health_connect',
      sourcePackage: 'com.xiaomi.wearable'
    },
    {
      sourceRecordId: 'hr_sample_2',
      metricType: 'heart_rate',
      value: 78,
      startTime: '2026-10-20T10:02:00.000Z',
      endTime: '2026-10-20T10:02:00.000Z',
      localDate: refDate,
      sourceType: 'health_connect',
      sourcePackage: 'com.xiaomi.wearable'
    },
    {
      sourceRecordId: 'weight_rec_1',
      metricType: 'weight',
      value: 74.5,
      unit: 'كغ',
      startTime: '2026-10-20T07:30:00.000Z',
      endTime: '2026-10-20T07:30:00.000Z',
      localDate: refDate,
      sourceType: 'health_connect',
      sourcePackage: 'com.xiaomi.wearable'
    },
    {
      sourceRecordId: 'exercise_rec_1',
      metricType: 'exercise',
      value: 45,
      unit: 'دقيقة',
      exerciseType: 'running',
      exerciseTitle: 'جري صباحي',
      startTime: '2026-10-20T06:15:00.000Z',
      endTime: '2026-10-20T07:00:00.000Z',
      localDate: refDate,
      sourceType: 'health_connect',
      sourcePackage: 'com.xiaomi.wearable'
    }
  ], {}, testDb);

  const [hrRead, weightRead, exRead] = await Promise.all([
    HealthConnectService.readHeartRate({ date: refDate }, testDb),
    HealthConnectService.readWeight({ date: refDate }, testDb),
    HealthConnectService.readExerciseSessions({ date: refDate }, testDb)
  ]);

  assert(
    hrRead.available === true && hrRead.latestBpm === 78 && hrRead.samples.length === 2 &&
    weightRead.available === true && weightRead.value === 74.5 &&
    exRead.available === true && exRead.totalMinutes === 45 && exRead.sessions[0].title === 'جري صباحي',
    'قراءة معدل القلب (آخر قراءة 78 bpm وسجل القراءتين) والوزن (74.5 كغ) وجلسات التمارين (45 دقيقة) بدقة'
  );

  // 7. عدم مسح البيانات المحلية السابقة عند فشل عملية المزامنة في بيئة الويب (المرحلة الثامنة)
  let syncFailedInBrowser = false;
  try {
    await HealthConnectService.syncNow(refDate, testDb);
  } catch {
    syncFailedInBrowser = true;
  }
  const stepsAfterFailedSync = await HealthConnectService.readSteps({ date: refDate }, testDb);
  assert(
    syncFailedInBrowser === true && stepsAfterFailedSync.value === 6850,
    'عدم مسح البيانات المحلية السابقة (6850 خطوة) عند حدوث خطأ أثناء المزامنة'
  );

  // 8. التحقق من صيغة مفتاح مصادقة Xiaomi Smart Band 10 وحساب CRC16 لبروتوكول HONOR Band 4
  const validKey = XiaomiBand10Protocol.validateAuthKey('0x46fec12c98382d00aabbccddeeff0011');
  let invalidKeyRejected = false;
  try {
    XiaomiBand10Protocol.validateAuthKey('invalid_short_key');
  } catch {
    invalidKeyRejected = true;
  }
  const honorFrame = HonorBand4Protocol.buildLinkLayerFrame(0x01, 0x08, [0x01, 0x00]);
  assert(
    validKey.startsWith('0x') && validKey.length === 34 && invalidKeyRejected && honorFrame[0] === 0xAA && honorFrame.length === 8,
    'التحقق الصحيح من مفتاح Xiaomi Smart Band 10 (32-hex) وبناء إطار HONOR Band 4 LinkLayer TLV مع CRC16'
  );

  // 9. اختبار إلغاء الموافقة وحذف البيانات الصحية المستوردة
  await YawmiHealthAPI.revokeConsentAndClearHealthData(testDb);
  const recordsAfterRevoke = await getAllRecords(STORE_NAMES.HEALTH_RECORDS, testDb);
  const stateAfterRevoke = await YawmiHealthAPI.getSyncStatus(testDb);
  assert(
    recordsAfterRevoke.length === 0 && stateAfterRevoke.consentGranted === false && stateAfterRevoke.backgroundSyncEnabled === false,
    'حذف جميع البيانات الصحية المستوردة وإيقاف المزامنة الخلفية فور إلغاء الموافقة'
  );

  // 10. اختبار الصدق الصارم: عدم ادعاء اتصال وهمي بالسوار أو Health Connect عند غياب الإضافة الأصلية
  await patchHealthSyncState({ consentGranted: true }, testDb);
  const savedProfile = await YawmiHealthAPI.registerDeviceProfile({
    family: 'xiaomi_band_10',
    name: 'Xiaomi Smart Band 10'
  }, testDb);

  let fakeConnectBlocked = false;
  try {
    await YawmiHealthAPI.connectDevice(savedProfile.id, testDb);
  } catch {
    fakeConnectBlocked = true;
  }
  const statusAfterAttempt = await YawmiHealthAPI.getDeviceStatus(savedProfile.id, testDb);
  const availCheck = await HealthConnectService.checkAvailability(testDb);
  assert(
    fakeConnectBlocked === true &&
    statusAfterAttempt.connectionState === 'connection_failed' &&
    availCheck.available === false &&
    availCheck.sdkStatus === 'requires_native_android_apk',
    'رفض ادعاء الاتصال بـ Health Connect أو السوار داخل المتصفح العادي وإرجاع الحالة الحقيقية requires_native_android_apk'
  );
}

/**
 * YAWMI — Unified Automated Test Runner (Works in Node.js CLI and Browser / WebView)
 */
async function runAllYawmiTests() {
  let passed = 0;
  let failed = 0;
  const logs = [];

  const assert = (condition, description) => {
    if (condition) {
      passed++;
      logs.push(`✅ [PASS] ${description}`);
    } else {
      failed++;
      logs.push(`❌ [FAIL] ${description}`);
    }
  };

  const suites = [
    { name: 'اختبارات قاعدة البيانات (IndexedDB)', fn: runDatabaseTests },
    { name: 'اختبارات المهام (Tasks)', fn: runTasksTests },
    { name: 'اختبارات الأموال والميزانيات (Finance & DZD)', fn: runFinanceTests },
    { name: 'اختبارات العادات والسلاسل (Habits)', fn: runHabitsTests },
    { name: 'اختبارات النسخ الاحتياطي (Backup & Restore)', fn: runBackupTests },
    { name: 'اختبارات المساعد الذكي المحلي (Assistant)', fn: runAssistantTests },
    { name: 'اختبارات الصحة والأساور الذكية وHealth Connect', fn: runHealthAndWearablesTests }
  ];

  for (const suite of suites) {
    logs.push(`--- ${suite.name} ---`);
    try {
      await suite.fn(assert);
    } catch (err) {
      failed++;
      logs.push(`❌ [ERROR in ${suite.name}] ${err.message}`);
    }
  }

  return {
    total: passed + failed,
    passed,
    failed,
    logs
  };
}

        <div>
          <span class="brand-title">${escapeHtml(t('appBrand'))}</span>
          <span class="brand-subtitle">${escapeHtml(t('slogan'))}</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="topbar-search-btn" title="بحث شامل" aria-label="بحث شامل">
          ${getIconSvg('search', 18)}
        </button>
        <button type="button" class="icon-btn" id="topbar-theme-btn" title="تبديل المظهر" aria-label="تبديل المظهر">
          ${getIconSvg(appState.theme === 'light' ? 'moon' : 'sun', 18)}
        </button>
      </div>
    `;

    document.getElementById('topbar-search-btn')?.addEventListener('click', () => {
      openGlobalSearchModal(async (type, id) => {
        if (type === 'task') {
          await navigateTo('planning', { planningSubTab: 'tasks' });
          openTaskDetailModal(id, renderApp);
        } else if (type === 'event') {
          await navigateTo('planning', { planningSubTab: 'calendar' });
        } else if (type === 'transaction') {
          await navigateTo('finance', { financeSubTab: 'transactions' });
        } else if (type === 'note') {
          await navigateTo('more', { moreSubView: 'notes' });
        }
      });
    });

    document.getElementById('topbar-theme-btn')?.addEventListener('click', () => {
      const nextTheme = appState.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      saveCachedPreferences();
      renderApp();
    });
  }

  // Render Active View
  const route = appState.currentRoute;
  if (route === 'home') {
    await renderDashboardView(mainEl, renderApp);
  } else if (route === 'planning') {
    const sub = appState.planningSubTab || 'tasks';
    mainEl.innerHTML = `
      <div class="segmented-tabs">
        <button type="button" class="seg-tab ${sub === 'tasks' ? 'active' : ''}" data-plan-tab="tasks">${escapeHtml(t('tasks_tab'))}</button>
        <button type="button" class="seg-tab ${sub === 'calendar' ? 'active' : ''}" data-plan-tab="calendar">${escapeHtml(t('calendar_tab'))}</button>
      </div>
      <div id="planning-sub-body" style="display:flex;flex-direction:column;gap:14px;"></div>
    `;
    mainEl.querySelectorAll('[data-plan-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        appState.planningSubTab = btn.getAttribute('data-plan-tab');
        renderApp();
      });
    });
    const subBody = document.getElementById('planning-sub-body');
    if (sub === 'tasks') {
      await renderTasksSection(subBody, renderApp);
    } else {
      await renderCalendarSection(subBody, renderApp);
    }
  } else if (route === 'health') {
    await renderHealthView(mainEl, renderApp);
  } else if (route === 'finance') {
    await renderFinanceView(mainEl, renderApp);
  } else if (route === 'more') {
    await renderMoreView(mainEl, renderApp, inAppTestRunner);
  }

  // Render Bottom Nav
  navWrapEl.innerHTML = renderBottomNav();
  navWrapEl.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.getAttribute('data-nav');
      if (target === 'more' && appState.currentRoute === 'more') {
        appState.moreSubView = 'menu';
      }
      navigateTo(target);
    });
  });


}
async function bootstrapYawmiApp() {
  registerInAppTestRunner(runAllYawmiTests);
  loadCachedPreferences();
  setLanguage(appState.language || 'ar');
  applyTheme(appState.theme || 'dark');
  await initDatabase();
  await getOrInitHealthSyncState();

  // محاولة إعادة الاتصال بالجهاز المحفوظ عند فتح التطبيق إذا كان في بيئة Android الأصلية
  if (YawmiHealthAPI.isNativeAndroidAvailable()) {
    try {
      const savedDevices = await getAllRecords(STORE_NAMES.WEARABLE_DEVICES);
      const autoDev = savedDevices.find(d => d.autoReconnect);
      if (autoDev) {
        await YawmiHealthAPI.connectDevice(autoDev.id);
      }
    } catch {
      // لا ينهار التطبيق عند فشل إعادة الاتصال التلقائي أو كون السوار خارج النطاق
    }
  }

  initRouter(async () => {
    await renderApp();
  });
  await renderApp();
}

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {
    bootstrapYawmiApp();
  });
}
  </script>
