 */
function mergeOverlappingSleepStages(stages = []) {
  if (!Array.isArray(stages) || stages.length === 0) {
    return { totalStageMinutes: null, mergedIntervalsCount: 0, normalizedStages: [] };
  }

  const validWithTimes = [];
  let fallbackMinutesSum = 0;
  let hasExplicitMinutesOnly = false;

  for (const st of stages) {
    if (st.startTime && st.endTime) {
      const s = new Date(st.startTime).getTime();
      const e = new Date(st.endTime).getTime();
      if (Number.isFinite(s) && Number.isFinite(e) && e > s) {
        validWithTimes.push({
          stage: st.stage || 'sleep',
          labelAr: st.labelAr || st.stage || 'مرحلة نوم',
          startMs: s,
          endMs: e,
          minutes: Math.round((e - s) / 60000)
        });
      }
    } else if (Number.isFinite(Number(st.minutes)) && Number(st.minutes) > 0) {
      hasExplicitMinutesOnly = true;
      fallbackMinutesSum += Number(st.minutes);
    }
  }

  if (validWithTimes.length === 0) {
    return {
      totalStageMinutes: hasExplicitMinutesOnly ? Math.round(fallbackMinutesSum) : null,
      mergedIntervalsCount: 0,
      normalizedStages: stages
    };
  }

  validWithTimes.sort((a, b) => a.startMs - b.startMs);
  const merged = [];
  let current = { startMs: validWithTimes[0].startMs, endMs: validWithTimes[0].endMs };

  for (let i = 1; i < validWithTimes.length; i++) {
    const next = validWithTimes[i];
    if (next.startMs <= current.endMs) {
      current.endMs = Math.max(current.endMs, next.endMs);
    } else {
      merged.push(current);
      current = { startMs: next.startMs, endMs: next.endMs };
    }
  }
  merged.push(current);

  const totalMinutes = Math.round(
    merged.reduce((acc, interval) => acc + (interval.endMs - interval.startMs) / 60000, 0)
  );

  return {
    totalStageMinutes: totalMinutes,
    mergedIntervalsCount: merged.length,
    normalizedStages: validWithTimes
  };
}

let activeSyncPromise = null;
let currentUiStateCode = 'unlinked';

const HealthConnectService = {
  HC_REQUIRED_PERMISSIONS,
  HC_BACKGROUND_PERMISSION,
  UBIE_SUPPORTED_READ_TYPES,
  HC_UI_STATES,
  getLocalDayBounds,
  mergeOverlappingSleepStages,

  getUiStateInfo(code = currentUiStateCode) {
    const entry = Object.values(HC_UI_STATES).find(s => s.code === code);
    return entry || HC_UI_STATES.UNLINKED;
  },

  setUiStateCode(code) {
    currentUiStateCode = code;
    return this.getUiStateInfo(code);
  },

  /**
   * 1. checkAvailability() — التحقق من توفر Health Connect
   */
  async checkAvailability(dbName = DB_NAME) {
    const yawmiPlugin = getNativeYawmiPlugin();
    const ubiePlugin = getUbieHealthConnectPlugin();

    if (!yawmiPlugin && !ubiePlugin) {
      const msg = 'التطبيق يعمل حاليًا في بيئة متصفح/WebView عادية بدون جسر Android الأصلي. اتصال Health Connect يتطلب تشغيل حزمة Android APK على هاتف أندرويد.';
      await patchHealthSyncState({
        environmentType: 'web_browser_or_webview',
        healthConnectSdkStatus: 'requires_native_android_apk',
        healthConnectLinked: false
      }, dbName);
      return {
        available: false,
        isNativeAndroid: false,
        sdkStatus: 'requires_native_android_apk',
        bridgeType: 'none',
        messageAr: msg
      };
    }

    if (yawmiPlugin && typeof yawmiPlugin.checkAvailability === 'function') {
      const res = await yawmiPlugin.checkAvailability();
      const sdkStatus = res?.sdkStatus || 'unavailable';
      const available = sdkStatus === 'available';
      await patchHealthSyncState({
        environmentType: 'capacitor_android_native',
        healthConnectSdkStatus: sdkStatus
      }, dbName);
      return {
        available,
        isNativeAndroid: true,
        sdkStatus,
        backgroundReadFeatureAvailable: Boolean(res?.backgroundReadFeatureAvailable),
        bridgeType: 'yawmi_native_kotlin',
        messageAr: available
          ? 'خدمة Android Health Connect متوفرة وجاهزة.'
          : (sdkStatus === 'update_required'
            ? 'يتطلب تطبيق Health Connect التثبيت أو التحديث من متجر Google Play.'
            : 'خدمة Health Connect غير مدعومة على هذا الإصدار من أندرويد.')
      };
    }

    if (ubiePlugin && typeof ubiePlugin.checkAvailability === 'function') {
      const res = await ubiePlugin.checkAvailability();
      const rawAvail = res?.availability || 'NotSupported';
      const sdkStatus = rawAvail === 'Available'
        ? 'available'
        : (rawAvail === 'NotInstalled' ? 'update_required' : 'unavailable');
      const available = sdkStatus === 'available';
      await patchHealthSyncState({
        environmentType: 'capacitor_android_native',
        healthConnectSdkStatus: sdkStatus
      }, dbName);
      return {
        available,
        isNativeAndroid: true,
        sdkStatus,
        backgroundReadFeatureAvailable: false,
        bridgeType: 'ubie_capacitor_health_connect',
        messageAr: available
          ? 'خدمة Health Connect متوفرة (عبر capacitor-health-connect).'
          : 'خدمة Health Connect غير مثبتة أو تحتاج إلى تحديث.'
      };
    }

    return {
      available: false,
      isNativeAndroid: false,
      sdkStatus: 'unavailable',
      bridgeType: 'none',
      messageAr: 'تعذر الوصول إلى واجهة Health Connect الأصلية.'
    };
  },

  /**
   * فتح شاشة إعدادات Health Connect أو متجر Play للتثبيت/التحديث
   */
  async openHealthConnectSettings() {
    const yawmiPlugin = getNativeYawmiPlugin();
    const ubiePlugin = getUbieHealthConnectPlugin();
    if (yawmiPlugin && typeof yawmiPlugin.openHealthConnectSettings === 'function') {
      return yawmiPlugin.openHealthConnectSettings();
    }
    if (ubiePlugin && typeof ubiePlugin.openHealthConnectSetting === 'function') {
      return ubiePlugin.openHealthConnectSetting();
    }
    throw new Error('لا يمكن فتح شاشة إعدادات Health Connect إلا داخل تطبيق Android APK الأصلي.');
  },

  /**
   * 2. requestPermissions() — طلب صلاحيات القراءة اللازمة (فقط القراءة دون كتابة)
   */
  async requestPermissions(options = {}, dbName = DB_NAME) {
    const avail = await this.checkAvailability(dbName);
    if (!avail.isNativeAndroid) {
      currentUiStateCode = 'connection_failed';
      await patchHealthSyncState({
        uiStateCode: 'connection_failed',
        lastSyncError: avail.messageAr
      }, dbName);
      throw new Error(avail.messageAr);
    }

    if (!avail.available) {
      currentUiStateCode = 'connection_failed';
      try {
        await this.openHealthConnectSettings();
      } catch {
        // ignore
      }
      throw new Error(avail.messageAr);
    }

    const yawmiPlugin = getNativeYawmiPlugin();
    const ubiePlugin = getUbieHealthConnectPlugin();

    if (yawmiPlugin && typeof yawmiPlugin.requestHealthPermissions === 'function') {
      const res = await yawmiPlugin.requestHealthPermissions({
        includeBackground: Boolean(options.includeBackground)
      });
      const granted = Array.isArray(res?.grantedPermissions) ? res.grantedPermissions : [];
      const hasAny = granted.length > 0;
      currentUiStateCode = hasAny ? 'read_success' : 'needs_permissions';

      await patchHealthSyncState({
        healthConnectLinked: hasAny,
        grantedPermissions: granted,
        everGrantedPermissions: hasAny ? true : undefined,
        uiStateCode: currentUiStateCode,
        lastSyncError: hasAny ? null : 'لم يتم منح صلاحيات القراءة المطلوبة في Health Connect.'
      }, dbName);

      return {
        granted: hasAny,
        allGranted: Boolean(res?.allGranted),
        grantedPermissions: granted,
        missingPermissions: HC_REQUIRED_PERMISSIONS.filter(p => !granted.includes(p))
      };
    }

    if (ubiePlugin && typeof ubiePlugin.requestHealthPermissions === 'function') {
      const res = await ubiePlugin.requestHealthPermissions({
        read: UBIE_SUPPORTED_READ_TYPES,
        write: []
      });
      const grantedMap = res?.grantedPermissions || {};
      const grantedList = Array.isArray(grantedMap)
        ? grantedMap
        : Object.keys(grantedMap).filter(k => Boolean(grantedMap[k]));
      const hasAny = grantedList.length > 0 || Boolean(res?.hasAllPermissions);
      currentUiStateCode = hasAny ? 'read_success' : 'needs_permissions';

      await patchHealthSyncState({
        healthConnectLinked: hasAny,
        grantedPermissions: grantedList,
        everGrantedPermissions: hasAny ? true : undefined,
        uiStateCode: currentUiStateCode,
        lastSyncError: hasAny ? null : 'تم رفض صلاحيات القراءة في Health Connect.'
      }, dbName);

      return {
        granted: hasAny,
        allGranted: Boolean(res?.hasAllPermissions),
        grantedPermissions: grantedList,
        missingPermissions: []
      };
    }

    throw new Error('تعذر استدعاء شاشة صلاحيات Health Connect الأصلية.');
  },

  /**
   * 3. checkPermissions() — التحقق من الصلاحيات الممنوحة حاليًا واكتشاف سحب الصلاحية من النظام
   */
  async checkPermissions(dbName = DB_NAME) {
    const syncState = await getOrInitHealthSyncState(dbName);
    const avail = await this.checkAvailability(dbName);

    if (!avail.isNativeAndroid || !avail.available) {
      return {
        available: avail.available,
        isNativeAndroid: avail.isNativeAndroid,
        granted: false,
        permissionRevoked: false,
        grantedPermissions: [],
        missingPermissions: HC_REQUIRED_PERMISSIONS
      };
    }

    const yawmiPlugin = getNativeYawmiPlugin();
    const ubiePlugin = getUbieHealthConnectPlugin();
    let grantedList = [];

    if (yawmiPlugin) {
      const fn = yawmiPlugin.checkHealthPermissions || yawmiPlugin.connectHealthConnect;
      const res = await fn.call(yawmiPlugin);
      grantedList = Array.isArray(res?.grantedPermissions) ? res.grantedPermissions : [];
    } else if (ubiePlugin && typeof ubiePlugin.checkHealthPermissions === 'function') {
      const res = await ubiePlugin.checkHealthPermissions({
        read: UBIE_SUPPORTED_READ_TYPES,
        write: []
      });
      const grantedMap = res?.grantedPermissions || {};
      grantedList = Array.isArray(grantedMap)
        ? grantedMap
        : Object.keys(grantedMap).filter(k => Boolean(grantedMap[k]));
    }

    const hasAny = grantedList.length > 0;
    const wasPreviouslyLinked = Boolean(syncState.everGrantedPermissions || syncState.healthConnectLinked);
    const permissionRevoked = wasPreviouslyLinked && !hasAny;

    if (permissionRevoked) {
      currentUiStateCode = 'permission_revoked';
    } else if (!hasAny) {
      currentUiStateCode = 'needs_permissions';
    }

    await patchHealthSyncState({
      healthConnectLinked: hasAny,
      grantedPermissions: grantedList,
      uiStateCode: permissionRevoked ? 'permission_revoked' : (hasAny ? syncState.uiStateCode || 'read_success' : 'needs_permissions'),
      lastSyncError: permissionRevoked
        ? 'فقد التطبيق صلاحية الوصول إلى Health Connect بعد سحبها من إعدادات النظام.'
        : syncState.lastSyncError
    }, dbName);

    return {
      available: true,
      isNativeAndroid: true,
      granted: hasAny,
      permissionRevoked,
      grantedPermissions: grantedList,
      missingPermissions: HC_REQUIRED_PERMISSIONS.filter(p => !grantedList.includes(p))
    };
  },

  /**
   * قراءة وتوحيد البيانات من الجسر الأصلي للفترة المحددة مع قفل التزامن ومنع مسح البيانات السابقة عند الفشل
   */
  async _fetchAndIngestWindow(bounds, dbName = DB_NAME) {
    if (activeSyncPromise) {
      return activeSyncPromise;
    }

    activeSyncPromise = (async () => {
      const attemptIso = new Date().toISOString();
      currentUiStateCode = 'reading_data';
      await patchHealthSyncState({
        lastAttemptedSyncAt: attemptIso,
        lastSyncStatus: 'reading_data',
        uiStateCode: 'reading_data',
        lastSyncError: null
      }, dbName);

      try {
        const permCheck = await this.checkPermissions(dbName);
        if (!permCheck.isNativeAndroid) {
          currentUiStateCode = 'connection_failed';
          const msg = 'لا يمكن قراءة Health Connect داخل متصفح عادي أو WebView؛ يتطلب ذلك تشغيل تطبيق Android APK الأصلي.';
          await patchHealthSyncState({
            lastSyncStatus: 'failed',
            uiStateCode: 'connection_failed',
            lastSyncError: msg
          }, dbName);
          throw new Error(msg);
        }

        if (permCheck.permissionRevoked) {
          currentUiStateCode = 'permission_revoked';
          const msg = 'فقد التطبيق صلاحية الوصول إلى بيانات Health Connect. يرجى إعادة منح الصلاحية.';
          await patchHealthSyncState({
            lastSyncStatus: 'permission_revoked',
            uiStateCode: 'permission_revoked',
            lastSyncError: msg
          }, dbName);
          throw new Error(msg);
        }

        if (!permCheck.granted) {
          currentUiStateCode = 'needs_permissions';
          const msg = 'يحتاج التطبيق إلى صلاحيات القراءة من Health Connect أولًا.';
          await patchHealthSyncState({
            lastSyncStatus: 'needs_permissions',
            uiStateCode: 'needs_permissions',
            lastSyncError: msg
          }, dbName);
          throw new Error(msg);
        }

        const yawmiPlugin = getNativeYawmiPlugin();
        const ubiePlugin = getUbieHealthConnectPlugin();
        const rawRecords = [];
        const sourcesDetected = new Set();

        if (yawmiPlugin && typeof yawmiPlugin.readHealthData === 'function') {
          const payload = await yawmiPlugin.readHealthData({
            startTime: bounds.startIso,
            endTime: bounds.endIso
          });
          const list = Array.isArray(payload?.records) ? payload.records : [];
          for (const r of list) {
            rawRecords.push({
              ...r,
              localDate: bounds.localDate
            });
            if (r.sourcePackage) sourcesDetected.add(r.sourcePackage);
          }
          if (Array.isArray(payload?.sourcesDetected)) {
            payload.sourcesDetected.forEach(s => sourcesDetected.add(s));
          }
        } else if (ubiePlugin && typeof ubiePlugin.readRecords === 'function') {
          const timeRangeFilter = {
            type: 'between',
            startTime: bounds.startTime,
            endTime: bounds.endTime
          };
          // قراءة الأنواع المدعومة في ubie-oss/capacitor-health-connect
          for (const recType of UBIE_SUPPORTED_READ_TYPES) {
            try {
              const res = await ubiePlugin.readRecords({ type: recType, timeRangeFilter });
              const records = Array.isArray(res?.records) ? res.records : [];
              for (const item of records) {
                const originPkg = item?.metadata?.dataOrigin || 'com.google.android.apps.healthdata';
                sourcesDetected.add(originPkg);
                const recId = item?.metadata?.id || generateId(`ubie_${recType}`);
                if (recType === 'Steps' && Number(item.count) > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'steps',
                    value: Number(item.count),
                    unit: 'خطوة',
                    startTime: new Date(item.startTime).toISOString(),
                    endTime: new Date(item.endTime).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: originPkg === 'com.google.android.apps.fitness' ? 'google_fit_hc' : 'health_connect'
                  });
                } else if (recType === 'ActiveCaloriesBurned' && item.energy?.value > 0) {
                  const kcal = item.energy.unit === 'joules'
                    ? item.energy.value / 4184
                    : (item.energy.unit === 'kilojoules' ? item.energy.value / 4.184 : item.energy.value);
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'calories',
                    value: Math.round(kcal * 10) / 10,
                    unit: 'سعرة (kcal)',
                    startTime: new Date(item.startTime).toISOString(),
                    endTime: new Date(item.endTime).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'HeartRateSeries' && Array.isArray(item.samples)) {
                  for (const smp of item.samples) {
                    rawRecords.push({
                      sourceRecordId: `${recId}_${new Date(smp.time).getTime()}`,
                      metricType: 'heart_rate',
                      value: Number(smp.beatsPerMinute),
                      unit: 'نبضة/د (bpm)',
                      startTime: new Date(smp.time).toISOString(),
                      endTime: new Date(smp.time).toISOString(),
                      localDate: bounds.localDate,
                      sourcePackage: originPkg,
                      sourceType: 'health_connect'
                    });
                  }
                } else if (recType === 'RestingHeartRate' && Number(item.beatsPerMinute) > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'resting_heart_rate',
                    value: Number(item.beatsPerMinute),
                    unit: 'نبضة/د (bpm)',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'Weight' && item.weight?.value > 0) {
                  const kg = item.weight.unit === 'gram'
                    ? item.weight.value / 1000
                    : (item.weight.unit === 'pound' ? item.weight.value * 0.453592 : item.weight.value);
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'weight',
                    value: Math.round(kg * 100) / 100,
                    unit: 'كغ',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'OxygenSaturation' && item.percentage?.value > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'spo2',
                    value: Number(item.percentage.value),
                    unit: '%',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                } else if (recType === 'RespiratoryRate' && Number(item.rate) > 0) {
                  rawRecords.push({
                    sourceRecordId: recId,
                    metricType: 'respiratory_rate',
                    value: Number(item.rate),
                    unit: 'نفس/د',
                    startTime: new Date(item.time).toISOString(),
                    endTime: new Date(item.time).toISOString(),
                    localDate: bounds.localDate,
                    sourcePackage: originPkg,
                    sourceType: 'health_connect'
                  });
                }
              }
            } catch {
              // ignore individual unsupported type error
            }
          }
        }

        const ingestStats = rawRecords.length > 0
          ? await HealthNormalizer.ingestHealthRecords(rawRecords, {}, dbName)
          : { insertedCount: 0, updatedCount: 0, suppressedDuplicatesCount: 0, totalRecords: 0 };

        const doneIso = new Date().toISOString();
        const nextUiState = rawRecords.length > 0 ? 'read_success' : 'no_data';
        currentUiStateCode = nextUiState;

        await patchHealthSyncState({
          lastSuccessfulSyncAt: doneIso,
          lastAttemptedSyncAt: attemptIso,
          lastSyncStatus: nextUiState,
          uiStateCode: nextUiState,
          lastSyncError: null,
          sourcesDetected: Array.from(sourcesDetected),
          googleFitSourceDetected: sourcesDetected.has('com.google.android.apps.fitness')
        }, dbName);

        return {
          uiState: this.getUiStateInfo(nextUiState),
          recordsReadCount: rawRecords.length,
          ingestStats,
          bounds
        };
      } catch (err) {
        if (currentUiStateCode === 'reading_data') {
          currentUiStateCode = 'connection_failed';
        }
        await patchHealthSyncState({
          lastAttemptedSyncAt: attemptIso,
          lastSyncStatus: 'failed',
          uiStateCode: currentUiStateCode,
          lastSyncError: err.message || 'فشل الاتصال أو قراءة البيانات من Health Connect'
        }, dbName);
        throw err;
      } finally {
        activeSyncPromise = null;
      }
    })();

    return activeSyncPromise;
  },

  /**
   * قراءة سجلات اليوم المحفوظة محليًا (مع خيار المزامنة الحية من Health Connect عند التوفر)
   */
  async _getDayPrimaryRecords(dateInput = new Date(), syncFromNative = false, dbName = DB_NAME) {
    const bounds = getLocalDayBounds(dateInput);
    if (syncFromNative && (getNativeYawmiPlugin() || getUbieHealthConnectPlugin())) {
      await this._fetchAndIngestWindow(bounds, dbName);
    }
    const allRecords = await getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName);
    const dayRecords = allRecords.filter(
      r => r.localDate === bounds.localDate && r.dedupStatus === 'unique_primary'
    );
    return { bounds, dayRecords, allRecords };
  },

  /**
   * 4. readTodaySummary() — قراءة ملخص اليوم الكامل
   */
  async readTodaySummary(options = { syncFromNative: false, date: new Date() }, dbName = DB_NAME) {
    const bounds = getLocalDayBounds(options?.date || new Date());
    if (options?.syncFromNative) {
      await this._fetchAndIngestWindow(bounds, dbName);
    }
    const [steps, distance, calories, heartRate, sleep, weight, exercises, syncStatus] = await Promise.all([
      this.readSteps({ date: bounds.localDate }, dbName),
      this.readDistance({ date: bounds.localDate }, dbName),
      this.readCalories({ date: bounds.localDate }, dbName),
      this.readHeartRate({ date: bounds.localDate }, dbName),
      this.readSleep({ date: bounds.localDate }, dbName),
      this.readWeight({ date: bounds.localDate }, dbName),
      this.readExerciseSessions({ date: bounds.localDate }, dbName),
      this.getLastSyncStatus(dbName)
    ]);

    const hasAnyDataToday = [steps, distance, calories, heartRate, sleep, weight, exercises].some(m => m.available);

    return {
      localDate: bounds.localDate,
      timeWindow: {
        startIso: bounds.startIso,
        endIso: bounds.endIso,
        zoneOffset: bounds.zoneOffset,
        timeZone: bounds.timeZone
      },
      hasAnyDataToday,
      steps,
      distance,
      calories,
      heartRate,
      sleep,
      weight,
      exercises,
      syncStatus
    };
  },

  /**
   * 5. readSteps() — قراءة إجمالي الخطوات عبر التجميع الموحد دون مضاعفة السجلات
   */
  async readSteps(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const matching = dayRecords.filter(r => r.metricType === 'steps');
    if (matching.length === 0) {
      return {
        metricType: 'steps',
        available: false,
        value: null,
        unit: 'خطوة',
        displayText: 'لا توجد بيانات',
        sourceNameAr: null,
        sourcePackage: null,
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
        recordsCount: 0
      };
    }
    const totalSteps = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0));
    const primary = matching[0];
    return {
      metricType: 'steps',
      available: true,
      value: totalSteps,
      unit: 'خطوة',
      displayText: `${totalSteps.toLocaleString('en-US')} خطوة`,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
      lastTimestamp: primary.endTime || primary.startTime,
      recordsCount: matching.length
    };
  },

  /**
   * 6. readDistance() — قراءة المسافة المقطوعة
   */
  async readDistance(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const matching = dayRecords.filter(r => r.metricType === 'distance');
    const onlyUbiePlugin = !getNativeYawmiPlugin() && Boolean(getUbieHealthConnectPlugin());

    if (matching.length === 0) {
      return {
        metricType: 'distance',
        available: false,
        unsupportedInPlugin: onlyUbiePlugin,
        value: null,
        unit: 'كم',
        displayText: onlyUbiePlugin ? 'غير مدعوم في إصدار capacitor-health-connect' : 'لا توجد بيانات',
        sourceNameAr: null,
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
        recordsCount: 0
      };
    }
    const totalKm = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0) * 100) / 100;
    const primary = matching[0];
    return {
      metricType: 'distance',
      available: true,
      unsupportedInPlugin: false,
      value: totalKm,
      unit: 'كم',
      displayText: `${totalKm.toLocaleString('en-US')} كم`,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
      lastTimestamp: primary.endTime || primary.startTime,
      recordsCount: matching.length
    };
  },

  /**
   * 7. readCalories() — قراءة السعرات المحروقة
   */
  async readCalories(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const matching = dayRecords.filter(r => r.metricType === 'calories');
    if (matching.length === 0) {
      return {
        metricType: 'calories',
        available: false,
        value: null,
        unit: 'سعرة (kcal)',
        displayText: 'لا توجد بيانات',
        sourceNameAr: null,
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
        recordsCount: 0
      };
    }
    const totalKcal = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0) * 10) / 10;
    const primary = matching[0];
    return {
      metricType: 'calories',
      available: true,
      value: totalKcal,
      unit: 'سعرة (kcal)',
      displayText: `${totalKcal.toLocaleString('en-US')} سعرة (kcal)`,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`,
      lastTimestamp: primary.endTime || primary.startTime,
      recordsCount: matching.length
    };
  },

  /**
   * 8. readHeartRate() — قراءة سجلات معدل ضربات القلب (آخر قراءة + توقيتها + السجل، دون تحويل الغياب إلى 0)
   */
  async readHeartRate(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const hrList = dayRecords
      .filter(r => r.metricType === 'heart_rate')
      .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));
    const restingList = dayRecords
      .filter(r => r.metricType === 'resting_heart_rate')
      .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));

    if (hrList.length === 0) {
      return {
        metricType: 'heart_rate',
        available: false,
        isLiveReading: false,
        latestBpm: null,
        latestTimestamp: null,
        restingBpm: restingList[0]?.value ?? null,
        unit: 'نبضة/د (bpm)',
        displayText: 'لا توجد بيانات',
        sourceNameAr: null,
        samples: [],
        timeWindow: `${bounds.localDate} (00:00 - 23:59)`
      };
    }

    const latest = hrList[0];
    return {
      metricType: 'heart_rate',
      available: true,
      isLiveReading: Boolean(latest.isLiveReading),
      latestBpm: latest.value,
      latestTimestamp: latest.endTime || latest.startTime,
      restingBpm: restingList[0]?.value ?? null,
      unit: 'نبضة/د (bpm)',
      displayText: `${latest.value} نبضة/د (bpm)`,
      sourceNameAr: latest.sourceNameAr,
      sourcePackage: latest.sourcePackage || null,
      samples: hrList.map(r => ({
        bpm: r.value,
        timestamp: r.endTime || r.startTime,
        sourceNameAr: r.sourceNameAr
      })),
      timeWindow: `${bounds.localDate} (00:00 - 23:59)`
    };
  },

  /**
   * 9. readSleep() — قراءة سجلات النوم ومراحله مع منع جمع المراحل المتداخلة مرتين
   */
  async readSleep(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const sleepList = dayRecords.filter(r => r.metricType === 'sleep');
    const onlyUbiePlugin = !getNativeYawmiPlugin() && Boolean(getUbieHealthConnectPlugin());

    if (sleepList.length === 0) {
      return {
        metricType: 'sleep',
        available: false,
        unsupportedInPlugin: onlyUbiePlugin,
        totalMinutes: null,
        unit: 'دقيقة',
        displayText: onlyUbiePlugin ? 'غير مدعوم في إصدار capacitor-health-connect' : 'لا توجد بيانات',
        hasStages: false,
        stages: [],
        sourceNameAr: null,
        timeWindow: `${bounds.localDate}`
      };
    }

    let totalMinutes = 0;
    const allStages = [];
    for (const rec of sleepList) {
      if (Array.isArray(rec.stages) && rec.stages.length > 0) {
        const mergedInfo = mergeOverlappingSleepStages(rec.stages);
        const recDuration = Number(rec.value || 0);
        if (mergedInfo.totalStageMinutes !== null && mergedInfo.totalStageMinutes > 0) {
          totalMinutes += recDuration > 0 ? Math.min(recDuration, mergedInfo.totalStageMinutes) : mergedInfo.totalStageMinutes;
        } else {
          totalMinutes += recDuration;
        }
        allStages.push(...rec.stages);
      } else {
        totalMinutes += Number(rec.value || 0);
      }
    }

    const hrs = Math.floor(totalMinutes / 60);
    const mins = Math.round(totalMinutes % 60);
    const primary = sleepList[0];

    return {
      metricType: 'sleep',
      available: true,
      unsupportedInPlugin: false,
      totalMinutes: Math.round(totalMinutes),
      unit: 'دقيقة',
      displayText: `${hrs} س و ${mins} د`,
      hasStages: allStages.length > 0,
      stages: allStages,
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null,
      lastTimestamp: primary.endTime || primary.startTime,
      timeWindow: `${bounds.localDate}`
    };
  },

  /**
   * 10. readWeight() — قراءة الوزن عند توفره مع التاريخ والوحدة
   */
  async readWeight(options = {}, dbName = DB_NAME) {
    const { bounds, allRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    // الوزن يُقرأ لليوم أو أحدث قياس مسجل حتى تاريخ اليوم
    const weightsUpToDate = allRecords
      .filter(r => r.metricType === 'weight' && r.localDate <= bounds.localDate)
      .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));

    if (weightsUpToDate.length === 0) {
      return {
        metricType: 'weight',
        available: false,
        value: null,
        unit: 'كغ',
        recordedDate: null,
        displayText: 'لا توجد بيانات',
        sourceNameAr: null
      };
    }

    const latest = weightsUpToDate[0];
    return {
      metricType: 'weight',
      available: true,
      value: latest.value,
      unit: latest.unit || 'كغ',
      recordedDate: latest.localDate,
      recordedTimestamp: latest.endTime || latest.startTime,
      displayText: `${latest.value} ${latest.unit || 'كغ'} (${latest.localDate})`,
      sourceNameAr: latest.sourceNameAr,
      sourcePackage: latest.sourcePackage || null
    };
  },

  /**
   * 11. readExerciseSessions() — قراءة جلسات التمارين وتوقيتها ومدتها ونوعها
   */
  async readExerciseSessions(options = {}, dbName = DB_NAME) {
    const { bounds, dayRecords } = await this._getDayPrimaryRecords(options.date || new Date(), Boolean(options.syncFromNative), dbName);
    const exList = dayRecords
      .filter(r => r.metricType === 'exercise')
      .sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)));
    const onlyUbiePlugin = !getNativeYawmiPlugin() && Boolean(getUbieHealthConnectPlugin());

    if (exList.length === 0) {
      return {
        metricType: 'exercise',
        available: false,
        unsupportedInPlugin: onlyUbiePlugin,
        totalMinutes: null,
        sessionsCount: 0,
        unit: 'دقيقة',
        displayText: onlyUbiePlugin ? 'غير مدعوم في إصدار capacitor-health-connect' : 'لا توجد بيانات',
        sessions: [],
        sourceNameAr: null
      };
    }

    const totalMinutes = Math.round(exList.reduce((acc, r) => acc + Number(r.value || 0), 0));
    const primary = exList[0];
    return {
      metricType: 'exercise',
      available: true,
      unsupportedInPlugin: false,
      totalMinutes,
      sessionsCount: exList.length,
      unit: 'دقيقة',
      displayText: `${totalMinutes} دقيقة (${exList.length} جلسة)`,
      sessions: exList.map(s => ({
        id: s.id,
        title: s.exerciseTitle || 'تمرين رياضي',
        exerciseType: s.exerciseType || 'general',
        durationMinutes: s.value,
        startTime: s.startTime,
        endTime: s.endTime,
        sourceNameAr: s.sourceNameAr
      })),
      sourceNameAr: primary.sourceNameAr,
      sourcePackage: primary.sourcePackage || null
    };
  },

  /**
   * 12. getLastSyncStatus() — عرض حالة آخر قراءة أو مزامنة مع الحالة الحالية من الحالات الـ 8 المنفصلة
   */
  async getLastSyncStatus(dbName = DB_NAME) {
    const [syncState, allRecords] = await Promise.all([
      getOrInitHealthSyncState(dbName),
      getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName)
    ]);

    const isNative = Boolean(getNativeYawmiPlugin() || getUbieHealthConnectPlugin());
    let resolvedStateCode = syncState.uiStateCode || currentUiStateCode || 'unlinked';

    if (!isNative) {
      if (syncState.lastSyncStatus === 'failed') {
        resolvedStateCode = 'connection_failed';
      } else if (allRecords.length > 0) {
        resolvedStateCode = 'read_success';
      } else {
        resolvedStateCode = 'unlinked';
      }
    } else if (syncState.lastSyncStatus === 'permission_revoked') {
      resolvedStateCode = 'permission_revoked';
    } else if (syncState.healthConnectLinked) {
      resolvedStateCode = allRecords.length > 0 ? 'read_success' : 'no_data';
    } else if (syncState.healthConnectSdkStatus === 'available') {
      resolvedStateCode = 'needs_permissions';
    }

    const uiState = this.getUiStateInfo(resolvedStateCode);
    const distinctSources = Array.from(new Set(allRecords.map(r => r.sourceNameAr).filter(Boolean)));

    return {
      uiStateCode: uiState.code,
      uiStateLabelAr: uiState.labelAr,
      uiStateBadgeClass: uiState.badgeClass,
      uiStateDescriptionAr: uiState.descriptionAr,
      bannerTextAr: uiState.bannerTextAr || uiState.labelAr,
      isSyncInProgress: Boolean(activeSyncPromise),
      isNativeAndroid: isNative,
      healthConnectLinked: Boolean(syncState.healthConnectLinked && isNative),
      sdkStatus: syncState.healthConnectSdkStatus,
      grantedPermissions: syncState.grantedPermissions || [],
      lastSuccessfulSyncAt: syncState.lastSuccessfulSyncAt || null,
      lastAttemptedSyncAt: syncState.lastAttemptedSyncAt || null,
      lastSyncError: syncState.lastSyncError || null,
      totalCachedRecords: allRecords.length,
      distinctSources
    };
  },

  /**
   * تنفيذ وظيفة «مزامنة الآن» الكاملة وفق المرحلة الثامنة (مع منع التضارب وعدم مسح البيانات عند الفشل)
   */
  async syncNow(dateInput = new Date(), dbName = DB_NAME) {
    const bounds = getLocalDayBounds(dateInput);
    await this._fetchAndIngestWindow(bounds, dbName);
    return this.readTodaySummary({ syncFromNative: false, date: bounds.localDate }, dbName);
  }
};

function renderSvgHealthChart(chartSeries, unitLabel = '', colorHex = '#10B981') {
  if (!chartSeries || !chartSeries.hasAnyData) {
    return `
      <div style="padding:22px 14px;text-align:center;background:var(--bg-surface-muted);border-radius:var(--radius-sm);border:1px dashed var(--border-strong);color:var(--text-muted);font-size:0.83rem;">
        لا توجد بيانات مسجلة لهذا المؤشر في الفترة المحددة لعرض الرسم البياني.
      </div>
    `;
  }

  const pts = chartSeries.points;
  const maxVal = Math.max(...pts.map(p => (p.hasData && p.value !== null ? Number(p.value) : 0)), 1);
  const svgW = 440;
  const svgH = 148;
  const padTop = 18;
  const padBottom = 26;
  const chartH = svgH - padTop - padBottom;
  const colW = svgW / Math.max(pts.length, 1);
  const barW = Math.max(8, Math.min(28, colW * 0.56));

  const barsSvg = pts.map((pt, idx) => {
    const xCenter = idx * colW + colW / 2;
    const xBar = xCenter - barW / 2;
    const showLabel = pts.length <= 7 || idx % 4 === 0 || idx === pts.length - 1;

    if (!pt.hasData || pt.value === null) {
      return `
        <g>
          <line x1="${xCenter}" y1="${padTop + chartH - 4}" x2="${xCenter}" y2="${padTop + chartH}" stroke="var(--border-strong)" stroke-width="2"/>
          ${showLabel ? `<text x="${xCenter}" y="${svgH - 7}" text-anchor="middle" fill="var(--text-muted)" font-size="9">${escapeHtml(pt.label)}</text>` : ''}
        </g>
      `;
    }

    const h = Math.max(6, Math.round((Number(pt.value) / maxVal) * chartH));
    const yBar = padTop + (chartH - h);
    return `
      <g>
        <rect x="${xBar.toFixed(1)}" y="${yBar.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${colorHex}" opacity="0.9"/>
        ${pts.length <= 7 ? `<text x="${xCenter.toFixed(1)}" y="${Math.max(11, yBar - 4).toFixed(1)}" text-anchor="middle" fill="var(--text-primary)" font-size="9.5" font-weight="700">${escapeHtml(String(pt.value))}</text>` : ''}
        ${showLabel ? `<text x="${xCenter.toFixed(1)}" y="${svgH - 7}" text-anchor="middle" fill="var(--text-secondary)" font-size="9">${escapeHtml(pt.label)}</text>` : ''}
      </g>
    `;
  }).join('');

  return `
    <div style="width:100%;overflow:hidden;">
      <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%;height:155px;display:block;" role="img" aria-label="رسم بياني للمؤشر الصحي">
        <line x1="0" y1="${padTop + chartH}" x2="${svgW}" y2="${padTop + chartH}" stroke="var(--border-color)" stroke-width="1"/>
        ${barsSvg}
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:0.73rem;color:var(--text-muted);margin-top:4px;">
        <span>الوحدة: ${escapeHtml(unitLabel)}</span>
        <span>القيم الفارغة تمثل أيامًا «لا توجد بيانات» فيها (وليست صفرًا)</span>
      </div>
    </div>
  `;
}

  openModal({
    title: 'ربط Android Health Connect — البيانات المطلوبة',
    bodyHtml,
    footerHtml,
    onMount: () => {
      document.getElementById('hc-rationale-cancel')?.addEventListener('click', async () => {
        closeModal();
        HealthConnectService.setUiStateCode('needs_permissions');
        await refreshUi();
      });

      // الخطوات 5، 6، 7، 8، 9، 10
      document.getElementById('hc-rationale-proceed')?.addEventListener('click', async () => {
        const includeBg = Boolean(document.getElementById('hc-req-bg-perm-chk')?.checked);
        closeModal();
        try {
          // الخطوة 5 و 6: فتح شاشة صلاحيات Health Connect الأصلية والسماح للمستخدم بالموافقة أو الرفض
          await HealthConnectService.requestPermissions({ includeBackground: includeBg });

          // الخطوة 7: بعد العودة إلى التطبيق، التحقق مجددًا من الصلاحيات الممنوحة
          const verify = await HealthConnectService.checkPermissions();

          if (!verify.granted) {
            // الخطوة 9: إذا رفض، عرض رسالة واضحة مع زر لإعادة المحاولة
            HealthConnectService.setUiStateCode('needs_permissions');
            await patchHealthSyncState({
              uiStateCode: 'needs_permissions',
              lastSyncError: 'تم رفض منح صلاحيات القراءة. يمكنك الضغط على «إعادة التحقق من الصلاحيات» للمحاولة مجددًا.'
            });
            showToast('لم يتم منح صلاحيات القراءة في Health Connect. يمكنك إعادة المحاولة في أي وقت.', 'warning', 4500);
            await refreshUi();
            return;
          }

          // الخطوة 8: إذا وافق المستخدم، بدء قراءة البيانات الحقيقية
          HealthConnectService.setUiStateCode('reading_data');
          await refreshUi();

          const summary = await HealthConnectService.readTodaySummary({
            syncFromNative: true,
            date: healthViewState.referenceDate
          });

          if (summary.hasAnyDataToday) {
            showToast('تم الربط بنجاح وقراءة البيانات الصحية الحقيقية ✓', 'success', 4000);
          } else {
            showToast('تم الربط، لا توجد بيانات متاحة لهذا اليوم في Health Connect بعد', 'info', 4500);
          }
        } catch (err) {
          showToast(err.message || 'تعذر إتمام الربط مع Health Connect', 'error', 4500);
        }
        await refreshUi();
      });
    }
  });
}

    <button type="button" class="btn btn-secondary" id="hrec-cancel-btn">إلغاء</button>
    <button type="button" class="btn btn-primary" id="hrec-save-btn">حفظ وتوحيد السجل</button>
  `;

  openModal({
    title: 'تسجيل قياس صحي موثق / استيراد سجل',
    bodyHtml,
    footerHtml,
    onMount: () => {
      const metricSelect = document.getElementById('hrec-metric');
      const updateExtraFields = () => {
        const m = metricSelect.value;
        document.getElementById('hrec-bp-extra').style.display = m === 'blood_pressure' ? 'grid' : 'none';
        document.getElementById('hrec-sleep-extra').style.display = m === 'sleep' ? 'grid' : 'none';
        document.getElementById('hrec-ex-extra').style.display = m === 'exercise' ? 'flex' : 'none';
      };
      metricSelect?.addEventListener('change', updateExtraFields);
      updateExtraFields();

      document.getElementById('hrec-cancel-btn')?.addEventListener('click', closeModal);

      document.getElementById('hrec-json-file')?.addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.records) ? parsed.records : []);
          if (list.length === 0) {
            showToast('الملف لا يحتوي على مصفوفة سجلات صحية صالحة', 'error');
            return;
          }
          const stats = await HealthNormalizer.ingestHealthRecords(list);
          closeModal();
          showToast(`تم استيراد ${stats.insertedCount} سجل وتوحيدها (تم استبعاد ${stats.suppressedDuplicatesCount} مكرر)`, 'success');
          if (typeof onSaved === 'function') await onSaved();
        } catch (err) {
          showToast(`تعذر قراءة ملف السجلات: ${err.message}`, 'error');
        }
      });

      document.getElementById('hrec-save-btn')?.addEventListener('click', () => {
        withSubmitLock('save-health-rec', async () => {
          try {
            const metricType = metricSelect.value;
            const rawVal = document.getElementById('hrec-val').value;
            if (rawVal === '' || Number(rawVal) < 0) {
              throw new Error('أدخل قيمة رقمية صحيحة للقياس.');
            }
            const dStr = document.getElementById('hrec-date').value || nowDate;
            const tStr = document.getElementById('hrec-time').value || nowTime;
            const dt = parseLocalDate(dStr, tStr) || new Date();
            const sourceType = document.getElementById('hrec-source').value;

            const stages = [];
            if (metricType === 'sleep') {
              const deep = Number(document.getElementById('hrec-sleep-deep').value || 0);
              const light = Number(document.getElementById('hrec-sleep-light').value || 0);
              if (deep > 0) stages.push({ stage: 'deep', labelAr: 'نوم عميق', minutes: deep });
              if (light > 0) stages.push({ stage: 'light_rem', labelAr: 'نوم خفيف + REM', minutes: light });
            }

            const recordInput = {
              metricType,
              value: Number(rawVal),
              startTime: dt.toISOString(),
              endTime: dt.toISOString(),
              localDate: dStr,
              sourceType,
              sourcePackage: sourceType === 'google_fit_hc' ? 'com.google.android.apps.fitness' : '',
              deviceModel: document.getElementById('hrec-device').value.trim() || null,
              systolic: metricType === 'blood_pressure' ? Number(document.getElementById('hrec-sys').value || 0) : null,
              diastolic: metricType === 'blood_pressure' ? Number(document.getElementById('hrec-dia').value || 0) : null,
              stages: stages.length > 0 ? stages : null,
              exerciseTitle: metricType === 'exercise' ? (document.getElementById('hrec-ex-type').value.trim() || 'تمرين رياضي') : null
            };

            const res = await HealthNormalizer.ingestHealthRecords([recordInput]);
            closeModal();
            showToast(
              res.suppressedDuplicatesCount > 0
                ? 'تم حفظ السجل واستبعاده من المجموع لوجود مصدر أعلى أولوية في نفس اليوم لمنع التكرار'
                : 'تم حفظ القياس الصحي وتوحيده بنجاح ✓',
              'success'
            );
            if (typeof onSaved === 'function') await onSaved();
          } catch (err) {
            showToast(err.message || 'تعذر حفظ القياس الصحي', 'error');
          }
        });
      });
    }
  });
}

/**
 * نافذة تفاصيل البطاقة الصحية (رسم بياني + فلاتر يوم/أسبوع/شهر + السجل الزمني بالمصدر)
 */
async function openHealthMetricDetailModal(metricType, onRefreshApp) {
  const def = HEALTH_METRIC_DEFS[metricType] || HEALTH_METRIC_DEFS.steps;
  let modalPeriod = healthViewState.period || 'week';

  const renderModalContent = async () => {
    const [allRecords, syncStatus] = await Promise.all([
      getAllRecords(STORE_NAMES.HEALTH_RECORDS),
      YawmiHealthAPI.getSyncStatus()
    ]);

    const activeFamily = syncStatus.primaryDevice?.family || null;
    const summary = HealthNormalizer.summarizePeriod(allRecords, {
      referenceDate: healthViewState.referenceDate,
      period: modalPeriod,
      activeDeviceFamily: activeFamily
    });

    const cardData = summary.metrics[metricType];
    const chartSeries = summary.buildChartSeries(metricType);
    const allForMetric = allRecords
      .filter(r => r.metricType === metricType)
      .sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)));

    const bodyEl = document.getElementById('yawmi-modal-body');
    if (!bodyEl) return;

    bodyEl.innerHTML = `
      <div class="form-grid">
        <div class="segmented-tabs">
          <button type="button" class="seg-tab ${modalPeriod === 'day' ? 'active' : ''}" data-det-period="day">اليوم</button>
          <button type="button" class="seg-tab ${modalPeriod === 'week' ? 'active' : ''}" data-det-period="week">الأسبوع (7 أيام)</button>
          <button type="button" class="seg-tab ${modalPeriod === 'month' ? 'active' : ''}" data-det-period="month">الشهر (30 يومًا)</button>
        </div>

        <div class="card" style="background:var(--bg-surface-muted);display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div>
            <div style="font-size:0.78rem;color:var(--text-muted);">${escapeHtml(def.labelAr)} (${modalPeriod === 'day' ? 'اليوم' : (modalPeriod === 'week' ? 'آخر 7 أيام' : 'آخر 30 يومًا')})</div>
            <div style="font-size:1.35rem;font-weight:800;margin-top:2px;color:${cardData.available ? 'var(--text-primary)' : 'var(--text-muted)'};">
              ${escapeHtml(cardData.displayText)}
            </div>
            ${cardData.sourceNameAr ? `<div style="font-size:0.75rem;color:var(--color-accent);margin-top:2px;">المصدر المعتمد: ${escapeHtml(cardData.sourceNameAr)}</div>` : ''}
          </div>
          <button type="button" class="btn btn-primary btn-sm" id="det-add-reading-btn">+ إضافة قراءة</button>
        </div>

        <div>
          <h4 style="font-size:0.88rem;font-weight:800;margin-bottom:8px;">الرسم البياني الزمني</h4>
          ${renderSvgHealthChart(chartSeries, def.unit, def.color)}
        </div>

        <div>
          <h4 style="font-size:0.88rem;font-weight:800;margin-bottom:8px;">السجل التاريخي للقراءات والمصادر (${allForMetric.length})</h4>
          ${allForMetric.length === 0
            ? `<div style="font-size:0.82rem;color:var(--text-muted);padding:12px;background:var(--bg-surface-muted);border-radius:var(--radius-sm);">لا توجد أي قراءات مسجلة لهذا المؤشر حتى الآن.</div>`
            : `<div class="item-list" style="max-height:220px;overflow-y:auto;">
                ${allForMetric.slice(0, 40).map(r => `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--bg-surface-muted);border-radius:var(--radius-xs);border:1px solid var(--border-color);">
                    <div>
                      <div style="font-weight:800;font-size:0.88rem;">
                        ${r.metricType === 'blood_pressure' && r.systolic ? `${r.systolic}/${r.diastolic}` : escapeHtml(String(r.value))} ${escapeHtml(r.unit)}
                        ${r.exerciseTitle ? ` • ${escapeHtml(r.exerciseTitle)}` : ''}
                      </div>
                      <div style="font-size:0.73rem;color:var(--text-muted);">
                        🕒 ${escapeHtml(r.startTime.slice(0, 16).replace('T', ' '))} • المصدر: <strong>${escapeHtml(r.sourceNameAr)}</strong>
                        ${r.deviceModel ? ` (${escapeHtml(r.deviceModel)})` : ''}
                      </div>
                      ${Array.isArray(r.stages) && r.stages.length > 0 ? `
                        <div style="font-size:0.72rem;color:var(--color-accent);margin-top:2px;">
                          مراحل النوم: ${r.stages.map(s => `${escapeHtml(s.labelAr || s.stage)}: ${escapeHtml(String(s.minutes || ''))} د`).join(' | ')}
                        </div>
                      ` : ''}
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <span class="badge ${r.dedupStatus === 'unique_primary' ? 'badge-success' : 'badge-low'}" title="${escapeHtml(r.dedupReason || '')}">
                        ${r.dedupStatus === 'unique_primary' ? 'معتمد ✓' : 'مستبعد (مكرر)'}
                      </span>
                      <button type="button" class="icon-btn" style="width:26px;height:26px;" data-del-hrec="${escapeHtml(r.id)}" aria-label="حذف القراءة">✕</button>
                    </div>
                  </div>
                `).join('')}
              </div>`
          }
        </div>

        <div style="font-size:0.74rem;color:var(--text-muted);background:var(--bg-surface-muted);padding:8px 10px;border-radius:var(--radius-xs);">
          ⚠️ <strong>تنبيه طبي:</strong> القياسات الاستهلاكية من الأساور الذكية قد تكون غير دقيقة ولا تُغني عن الأجهزة الطبية المعتمدة أو استشارة الطبيب.
        </div>
      </div>
    `;

    bodyEl.querySelectorAll('[data-det-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        modalPeriod = btn.getAttribute('data-det-period');
        renderModalContent();
      });
    });

    document.getElementById('det-add-reading-btn')?.addEventListener('click', () => {
      closeModal();
      openHealthRecordEntryModal(metricType, onRefreshApp);
    });

    bodyEl.querySelectorAll('[data-del-hrec]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-del-hrec');
        await deleteRecord(STORE_NAMES.HEALTH_RECORDS, id);
        showToast('تم حذف القراءة من السجل الصحي', 'info');
        await renderModalContent();
        if (typeof onRefreshApp === 'function') await onRefreshApp();
      });
    });
  };

  openModal({
    title: `${def.icon} تفاصيل ${def.labelAr}`,
    bodyHtml: `<div style="padding:18px;text-align:center;">جارٍ تحميل السجل والرسوم البيانية...</div>`,
    onMount: () => {
      renderModalContent();
    }
  });
}

          <span style="font-weight:800;font-size:0.86rem;">🚶 مستشعر تسارع الهاتف الفعلي (لا يُحسب كسوار)</span>
          <span class="badge ${ped.isRunning ? 'badge-success' : 'badge-low'}" id="wiz-ped-badge">
            ${ped.isRunning ? 'يقرأ اهتزاز المشي الفعلي ✓' : 'متوقف'}
          </span>
        </div>
        <div style="font-size:0.78rem;color:var(--text-secondary);" id="wiz-ped-stats">
          إشارات المستشعر المستلمة: <strong>${ped.motionEventsReceived || 0}</strong> • الخطوات الفعلية: <strong>${ped.steps} خطوة</strong>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          <button type="button" class="btn btn-secondary btn-sm" id="wiz-ped-toggle-btn">
            ${ped.isRunning ? 'إيقاف مستشعر الهاتف' : 'تشغيل مستشعر المشي الفعلي'}
          </button>
          <button type="button" class="btn btn-primary btn-sm" id="wiz-ped-sync-btn">
            حفظ خطوات الهاتف الفعلية
          </button>
        </div>
      </div>
    </div>
  `;

  openModal({
    title: '🔍 تشخيص العتاد وتفعيل الاتصال الحقيقي',
    bodyHtml,
    footerHtml: `<button type="button" class="btn btn-secondary" id="wiz-close-btn">إغلاق</button>`,
    onMount: () => {
      document.getElementById('wiz-close-btn')?.addEventListener('click', closeModal);

      document.getElementById('diag-download-html-btn')?.addEventListener('click', () => {
        const htmlContent = '<' + '!DOCTYPE html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'yawmi_app.html';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2500);
        showToast('تم بدء تنزيل yawmi_app.html لفتحه خارج نافذة المعاينة', 'info');
      });

      document.getElementById('diag-reset-clean-btn')?.addEventListener('click', async () => {
        await YawmiHealthAPI.revokeConsentAndClearHealthData();
        await patchHealthSyncState({ consentGranted: true });
        HealthConnectService.setUiStateCode('unlinked');
        closeModal();
        showToast('تم مسح جميع الأجهزة والبيانات السابقة وإعادة الحالة إلى «غير مرتبط» بصدق ✓', 'info');
        if (typeof onCompleted === 'function') await onCompleted();
      });

      const refreshPedUi = (m) => {
        const statsEl = document.getElementById('wiz-ped-stats');
        const badgeEl = document.getElementById('wiz-ped-badge');
        const toggleBtn = document.getElementById('wiz-ped-toggle-btn');
        if (statsEl) {
          statsEl.innerHTML = `إشارات المستشعر المستلمة: <strong>${m.motionEventsReceived || 0}</strong> • الخطوات الفعلية: <strong>${m.steps} خطوة</strong>`;
        }
        if (badgeEl) {
          badgeEl.className = `badge ${m.isRunning ? 'badge-success' : 'badge-low'}`;
          badgeEl.textContent = m.isRunning ? 'يقرأ اهتزاز المشي الفعلي ✓' : 'متوقف';
        }
        if (toggleBtn) {
          toggleBtn.textContent = m.isRunning ? 'إيقاف مستشعر الهاتف' : 'تشغيل مستشعر المشي الفعلي';
        }
      };

      document.getElementById('wiz-ped-toggle-btn')?.addEventListener('click', () => {
        try {
          if (YawmiHealthAPI.PhoneSensorPedometer.isRunning) {
            YawmiHealthAPI.PhoneSensorPedometer.stop();
            refreshPedUi(YawmiHealthAPI.PhoneSensorPedometer.getMetrics());
            showToast('تم إيقاف مستشعر الهاتف', 'info');
          } else {
            YawmiHealthAPI.PhoneSensorPedometer.start(refreshPedUi);
            refreshPedUi(YawmiHealthAPI.PhoneSensorPedometer.getMetrics());
            showToast('تم تشغيل مستشعر الحركة؛ امشِ بالهاتف لالتقاط الخطوات الحقيقية', 'info');
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('wiz-ped-sync-btn')?.addEventListener('click', async () => {
        try {
          await YawmiHealthAPI.PhoneSensorPedometer.syncToDatabase();
          closeModal();
          showToast('تم حفظ الخطوات الملتقطة فعليًا من مستشعر الهاتف ✓', 'success');
          if (typeof onCompleted === 'function') await onCompleted();
        } catch (err) {
          showToast(err.message, 'warning');
        }
      });
    }
  });
}

/**
 * 🧠 محرك التغذية والرياضة وحاسبة الجسم والاقتراحات الذكية (HealthCoachManager)
 */
const HEALTH_COACH_SETTINGS_KEY = 'health_coach_state_v1';

const HealthCoachManager = {
  getDefaultState() {
    return {
      id: HEALTH_COACH_SETTINGS_KEY,
      profile: {
        gender: 'male',
        age: 30,
        heightCm: 175,
        weightKg: 75,
        activityLevel: 'moderate',
        goalType: 'maintain',
        targetWaterMl: 2500
      },
      mealsLog: [],
      workoutsLog: [],
      waterByDate: {},
      updatedAt: new Date().toISOString()
    };
  },

  async getState(dbName = DB_NAME) {
    try {
      const saved = await getRecordByKey(STORE_NAMES.SETTINGS, HEALTH_COACH_SETTINGS_KEY, dbName);
      const def = this.getDefaultState();
      if (!saved || typeof saved !== 'object') {
        return def;
      }
      return {
        ...def,
        ...saved,
        profile: { ...def.profile, ...(saved.profile || {}) },
        mealsLog: Array.isArray(saved.mealsLog) ? saved.mealsLog : [],
        workoutsLog: Array.isArray(saved.workoutsLog) ? saved.workoutsLog : [],
        waterByDate: saved.waterByDate && typeof saved.waterByDate === 'object' ? saved.waterByDate : {}
      };
    } catch {
      return this.getDefaultState();
    }
  },

  async saveState(stateObj, dbName = DB_NAME) {
    const def = this.getDefaultState();
    const normalized = {
      ...def,
      ...stateObj,
      id: HEALTH_COACH_SETTINGS_KEY,
      profile: { ...def.profile, ...(stateObj.profile || {}) },
      mealsLog: Array.isArray(stateObj.mealsLog) ? stateObj.mealsLog : [],
      workoutsLog: Array.isArray(stateObj.workoutsLog) ? stateObj.workoutsLog : [],
      waterByDate: stateObj.waterByDate && typeof stateObj.waterByDate === 'object' ? stateObj.waterByDate : {},
      updatedAt: new Date().toISOString()
    };
    await putRecord(STORE_NAMES.SETTINGS, normalized, dbName);
    return normalized;
  },

  async updateProfile(patch, dbName = DB_NAME) {
    const state = await this.getState(dbName);
    state.profile = {
      ...state.profile,
      ...patch,
      age: Math.max(12, Math.min(100, Number(patch.age ?? state.profile.age) || 30)),
      heightCm: Math.max(120, Math.min(230, Number(patch.heightCm ?? state.profile.heightCm) || 175)),
      weightKg: Math.max(35, Math.min(250, Number(patch.weightKg ?? state.profile.weightKg) || 75))
    };
    if (!patch.targetWaterMl) {
      state.profile.targetWaterMl = Math.round((state.profile.weightKg * 35) / 100) * 100;
    } else {
      state.profile.targetWaterMl = Math.max(1000, Math.min(6000, Number(patch.targetWaterMl) || 2500));
    }
    return this.saveState(state, dbName);
  },

  calculateBodyMetrics(profileInput = {}) {
    const p = { ...this.getDefaultState().profile, ...profileInput };
    const weightKg = Math.max(35, Number(p.weightKg) || 75);
    const heightCm = Math.max(120, Number(p.heightCm) || 175);
    const age = Math.max(12, Number(p.age) || 30);
    const heightM = heightCm / 100;

    const bmi = Math.round((weightKg / (heightM * heightM)) * 10) / 10;
    let bmiCategoryAr = 'وزن مثالي وصحي ✓';
    let bmiBadgeClass = 'badge-success';
    if (bmi < 18.5) {
      bmiCategoryAr = 'نحافة (أقل من الطبيعي)';
      bmiBadgeClass = 'badge-medium';
    } else if (bmi >= 25 && bmi < 30) {
      bmiCategoryAr = 'زيادة في الوزن';
      bmiBadgeClass = 'badge-high';
    } else if (bmi >= 30) {
      bmiCategoryAr = 'سمنة (ينصح بالتنشيف)';
      bmiBadgeClass = 'badge-urgent';
    }

    const idealWeightMinKg = Math.round(18.5 * heightM * heightM * 10) / 10;
    const idealWeightMaxKg = Math.round(24.9 * heightM * heightM * 10) / 10;

    const baseBmr = 10 * weightKg + 6.25 * heightCm - 5 * age;
    const bmr = Math.round(p.gender === 'female' ? baseBmr - 161 : baseBmr + 5);

    const multMap = {
      sedentary: 1.2,
      light: 1.375,
      moderate: 1.55,
      active: 1.725,
      very_active: 1.9
    };
    const mult = multMap[p.activityLevel] || 1.55;
    const tdee = Math.round(bmr * mult);

    let targetKcal = tdee;
    let goalLabelAr = 'المحافظة على الوزن واللياقة';
    let proteinPerKg = 1.6;
    if (p.goalType === 'lose') {
      targetKcal = Math.max(1200, tdee - 450);
      goalLabelAr = 'تنشيف وإنقاص الوزن (-450 kcal)';
      proteinPerKg = 1.9;
    } else if (p.goalType === 'gain') {
      targetKcal = tdee + 350;
      goalLabelAr = 'بناء العضلات وزيادة الوزن (+350 kcal)';
      proteinPerKg = 2.0;
    }

    const targetProteinG = Math.round(weightKg * proteinPerKg);
    const targetFatG = Math.round((targetKcal * 0.27) / 9);
    const remainingForCarbs = Math.max(400, targetKcal - (targetProteinG * 4 + targetFatG * 9));
    const targetCarbsG = Math.round(remainingForCarbs / 4);
    const recommendedWaterMl = Math.round((weightKg * 35) / 100) * 100;

    return {
      weightKg,
      heightCm,
      age,
      gender: p.gender,
      bmi,
      bmiCategoryAr,
      bmiBadgeClass,
      idealWeightMinKg,
      idealWeightMaxKg,
      bmr,
      tdee,
      targetKcal,
      goalType: p.goalType,
      goalLabelAr,
      targetProteinG,
      targetCarbsG,
      targetFatG,
      recommendedWaterMl,
      targetWaterMl: Number(p.targetWaterMl) || recommendedWaterMl
    };
  },

  calculateWorkoutCalories(sportId, durationMin, intensity = 'moderate', weightKg = 75) {
    const sport = SPORTS_EXERCISES_DATABASE.find(s => s.id === sportId) || SPORTS_EXERCISES_DATABASE[0];
    const met = intensity === 'light'
      ? sport.metLight
      : (intensity === 'vigorous' ? sport.metVigorous : sport.metModerate);
    const mins = Math.max(1, Number(durationMin) || sport.defaultMin || 30);
    const w = Math.max(35, Number(weightKg) || 75);
    const burnedKcal = Math.round(met * w * (mins / 60));
    return {
      sport,
      met,
      durationMin: mins,
      intensity,
      burnedKcal
    };
  },

  async addWater(deltaMl, dateStr = getLocalDateString(), dbName = DB_NAME) {
    const state = await this.getState(dbName);
    const current = Number(state.waterByDate[dateStr] || 0);
    const nextVal = Math.max(0, Math.min(8000, current + Number(deltaMl || 0)));
    state.waterByDate[dateStr] = nextVal;
    await this.saveState(state, dbName);
    return nextVal;
  },

      categoryAr: mealInput.categoryAr || 'تغذية',

      kcal: Math.max(1, Math.round(Number(mealInput.kcal) || 0)),

  getDailySummary(state, dateStr = getLocalDateString(), periodSummary = null) {
    const bodyMetrics = this.calculateBodyMetrics(state.profile);
    const mealsForDate = (state.mealsLog || []).filter(m => m.date === dateStr);
    const workoutsForDate = (state.workoutsLog || []).filter(w => w.date === dateStr);

    let eatenKcal = mealsForDate.reduce((acc, m) => acc + (Number(m.kcal) || 0), 0);
    if (eatenKcal === 0 && periodSummary?.metrics?.calories?.available && Number(periodSummary.metrics.calories.value) > 0) {
      eatenKcal = Math.round(Number(periodSummary.metrics.calories.value));
    }

    const proteinG = Math.round(mealsForDate.reduce((acc, m) => acc + (Number(m.protein) || 0), 0) * 10) / 10;
    const carbsG = Math.round(mealsForDate.reduce((acc, m) => acc + (Number(m.carbs) || 0), 0) * 10) / 10;
    const fatG = Math.round(mealsForDate.reduce((acc, m) => acc + (Number(m.fat) || 0), 0) * 10) / 10;
    const fiberG = Math.round(mealsForDate.reduce((acc, m) => acc + (Number(m.fiber) || 0), 0) * 10) / 10;

    const workoutBurnKcal = workoutsForDate.reduce((acc, w) => acc + (Number(w.burnedKcal) || 0), 0);
    const workoutMinutes = workoutsForDate.reduce((acc, w) => acc + (Number(w.durationMin) || 0), 0);

    const stepsCount = periodSummary?.metrics?.steps?.available ? Number(periodSummary.metrics.steps.value || 0) : 0;
    const stepsBurnKcal = Math.round(stepsCount * 0.04);
    const totalBurnedKcal = workoutBurnKcal + stepsBurnKcal;

    const netKcal = eatenKcal - totalBurnedKcal;
    const remainingKcal = bodyMetrics.targetKcal - netKcal;

    const waterMl = Number(state.waterByDate?.[dateStr] || 0);
    const targetWaterMl = bodyMetrics.targetWaterMl;
    const waterCups = Math.round((waterMl / 250) * 10) / 10;

    const mealsBySlot = {
      breakfast: mealsForDate.filter(m => m.mealSlot === 'breakfast'),
      lunch: mealsForDate.filter(m => m.mealSlot === 'lunch'),
      dinner: mealsForDate.filter(m => m.mealSlot === 'dinner'),
      snack: mealsForDate.filter(m => m.mealSlot === 'snack')
    };

    return {
      dateStr,
      bodyMetrics,
      mealsForDate,
      mealsBySlot,
      workoutsForDate,
      eatenKcal,
      proteinG,
      carbsG,
      fatG,
      fiberG,
      workoutBurnKcal,
      workoutMinutes,
      stepsCount,
      stepsBurnKcal,
      totalBurnedKcal,
      netKcal,
      targetKcal: bodyMetrics.targetKcal,
      remainingKcal,
      waterMl,
      targetWaterMl,
      waterCups
    };
  },

  generateSmartSuggestions(daily, periodSummary = null) {
    const bm = daily.bodyMetrics;
    const remKcal = daily.remainingKcal;
    const proteinDeficit = Math.max(0, bm.targetProteinG - daily.proteinG);
    const waterDeficit = Math.max(0, daily.targetWaterMl - daily.waterMl);

    let candidateFoods = [];
    if (remKcal <= 250 || bm.goalType === 'lose') {
      candidateFoods = [
        FOOD_CALORIE_DATABASE.find(f => f.id === 'grilled_chicken'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'grilled_fish'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'green_salad'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'lentils_stew'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'canned_tuna'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'boiled_eggs'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'chorba_frik'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'apple_fruit')
      ].filter(Boolean);
    } else if (bm.goalType === 'gain') {
      candidateFoods = [
        FOOD_CALORIE_DATABASE.find(f => f.id === 'couscous_meat'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'grilled_chicken'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'oatmeal_milk'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'doubara_biskra'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'grilled_beef_lamb'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'deglet_nour_dates'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'raw_nuts_mix')
      ].filter(Boolean);
    } else {
      candidateFoods = [
        FOOD_CALORIE_DATABASE.find(f => f.id === 'tajine_zitoune'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'chorba_frik'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'grilled_fish'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'chickpeas_boiled'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'oatmeal_milk'),
        FOOD_CALORIE_DATABASE.find(f => f.id === 'banana_fruit')
      ].filter(Boolean);
    }

    const mealSuggestions = candidateFoods.slice(0, 4).map(food => {
      const grams = food.defaultGrams;
      const ratio = grams / 100;
      const kcal = Math.round(food.kcalPer100g * ratio);
      const protein = Math.round(food.protein * ratio * 10) / 10;
      let reasonAr = food.healthTipAr;
      if (proteinDeficit > 20 && protein >= 15) {
        reasonAr = `يعوض نقص البروتين اليومي لديك (+${protein}غ بروتين) مع سعرات متوازنة (${kcal} kcal).`;
      } else if (remKcal < 350 && kcal <= 250) {
        reasonAr = `وجبة خفيفة ومشبعة تناسب ميزانيتك المتبقية من السعرات (${kcal} kcal فقط).`;
      }
      return {
        food,
        grams,
        kcal,
        protein,
        reasonAr
      };
    });

    const surplusKcal = remKcal < 0 ? Math.abs(remKcal) : 0;
    let candidateSportsIds = ['brisk_walk', 'hiit_fat_burn', 'calisthenics_bars', 'stretching_mobility'];
    if (surplusKcal > 200 || bm.goalType === 'lose') {
      candidateSportsIds = ['hiit_fat_burn', 'brisk_walk', 'jump_rope', 'stationary_bike'];
    } else if (bm.goalType === 'gain') {
      candidateSportsIds = ['gym_bodybuilding', 'compound_powerlifting', 'calisthenics_bars', 'pushups_chest'];
    } else if (daily.workoutMinutes >= 45) {
      candidateSportsIds = ['stretching_mobility', 'yoga_flow', 'pilates_back_care', 'normal_walk'];
    }

    const sportSuggestions = candidateSportsIds.map(id => {
      const durationMin = surplusKcal > 250 ? 35 : 30;
      const intensity = bm.goalType === 'lose' ? 'vigorous' : 'moderate';
      const calc = this.calculateWorkoutCalories(id, durationMin, intensity, bm.weightKg);
      let reasonAr = calc.sport.benefitsAr;
      if (surplusKcal > 100) {
        reasonAr = `يحرق حوالي ${calc.burnedKcal} سعرة لمعادلة الفائض الحراري اليومي (${surplusKcal} kcal).`;
      }
      return {
        sport: calc.sport,
        durationMin: calc.durationMin,
        intensity: calc.intensity,
        burnedKcal: calc.burnedKcal,
        reasonAr
      };
    });

    const healthTips = [];

    if (remKcal >= 0) {
      healthTips.push({
        icon: '🔥',
        titleAr: 'ميزان السعرات اليومي في النطاق الصحي',
        badgeAr: `متبقي ${remKcal} kcal`,
        badgeClass: 'badge-success',
        textAr: `استهلكت اليوم ${daily.eatenKcal} سعرة وحرقت ${daily.totalBurnedKcal} سعرة بالنشاط. لا يزال بإمكانك تناول ${remKcal} سعرة ضمن هدفك (${bm.goalLabelAr}).`
      });
    } else {
      healthTips.push({
        icon: '⚠️',
        titleAr: 'تجاوزت هدف السعرات اليومي',
        badgeAr: `فائض +${Math.abs(remKcal)} kcal`,
        badgeClass: 'badge-high',
        textAr: `صافي سعراتك يتجاوز الهدف بـ ${Math.abs(remKcal)} سعرة. جلسة مشي سريع أو تمرين HIIT لمدة 25-30 دقيقة ستعيد ميزانك إلى النطاق المثالي.`
      });
    }

    if (proteinDeficit > 15) {
      healthTips.push({
        icon: '🥩',
        titleAr: 'حافظ على هدف البروتين اليومي',
        badgeAr: `${daily.proteinG} / ${bm.targetProteinG} غ`,
        badgeClass: 'badge-medium',
        textAr: `تحتاج إلى ${Math.round(proteinDeficit)} غرام بروتين إضافية اليوم لحماية الكتلة العضلية وزيادة الشبع (مثل صدر دجاج، تونة، بيض مسلوق، أو عدس/حمص).`
      });
    } else {
      healthTips.push({
        icon: '💪',
        titleAr: 'تغطية ممتازة لاحتياج البروتين',
        badgeAr: `${daily.proteinG} / ${bm.targetProteinG} غ ✓`,
        badgeClass: 'badge-success',
        textAr: 'حصتك من البروتين اليوم مثالية للاستشفاء العضلي والحفاظ على معدل الأيض المرتفع.'
      });
    }

    if (waterDeficit > 300) {
      const remCups = Math.ceil(waterDeficit / 250);
      healthTips.push({
        icon: '💧',
        titleAr: 'تذكير بترطيب الجسم وشرب الماء',
        badgeAr: `متبقي ${remCups} أكواب (${waterDeficit} مل)`,
        badgeClass: 'badge-medium',
        textAr: `شربت ${daily.waterMl} مل من أصل ${daily.targetWaterMl} مل المقترحة لوزنك (${bm.weightKg} كغ). اشرب كوب ماء الآن لرفع التركيز وحرق الدهون.`
      });
    } else {
      healthTips.push({
        icon: '💧',
        titleAr: 'مستوى ترطيب مثالي اليوم',
        badgeAr: `${daily.waterMl} مل ✓`,
        badgeClass: 'badge-success',
        textAr: 'أحسنت! وصلت إلى هدف شرب الماء اليومي مما يدعم وظائف الكلى والعضلات والتركيز.'
      });
    }

    const sleepMins = periodSummary?.metrics?.sleep?.available ? Number(periodSummary.metrics.sleep.value || 0) : 0;
    if (sleepMins > 0 && sleepMins < 390) {
      healthTips.push({
        icon: '🌙',
        titleAr: 'تنبيه الاستشفاء وجودة النوم',
        badgeAr: `${Math.floor(sleepMins / 60)}س ${Math.round(sleepMins % 60)}د`,
        badgeClass: 'badge-high',
        textAr: 'ساعات نومك المسجلة أقل من 6.5 ساعات؛ قلة النوم ترفع هرمون الجوع (الغريلين). يُنصح بتمارين إطالة خفيفة والنوم مبكرًا الليلة.'
      });
    } else {
      healthTips.push({
        icon: '👣',
        titleAr: 'الحركة اليومية وصحة القلب',
        badgeAr: daily.stepsCount > 0 ? `${daily.stepsCount} خطوة` : 'نشاط يومي',
        badgeClass: daily.stepsCount >= 6000 ? 'badge-success' : 'badge-low',
        textAr: daily.stepsCount >= 6000
          ? `نشاطك الحركي ممتاز اليوم (${daily.stepsCount} خطوة أحرقت ~${daily.stepsBurnKcal} سعرة إضافية).`
          : 'المشي 7,000 إلى 10,000 خطوة يوميًا يحرق 280-400 سعرة إضافية دون إجهاد للجهاز العصبي.'
      });
    }

    return {
      mealSuggestions,
      sportSuggestions,
      healthTips
    };
  }
};

/**
 * تحليل بصري ذكي للصورة المرفوعة (الألوان السائدة + اسم الملف) لاقتراح نوع الأكل تلقائيًا
 */
function detectFoodFromImageAndCanvas(canvas, fileName = '') {
  const lowerName = String(fileName || '').toLowerCase();
  for (const item of FOOD_CALORIE_DATABASE) {
    if (item.keywords && item.keywords.some(kw => lowerName.includes(kw))) {
      return { matched: item, reasonAr: 'تم التعرف من بيانات الصورة واسمها' };
    }
  }

  try {
    const ctx = canvas.getContext('2d');
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let rSum = 0, gSum = 0, bSum = 0, count = 0;
    for (let i = 0; i < data.length; i += 16) {
      rSum += data[i];
      gSum += data[i + 1];
      bSum += data[i + 2];
      count++;
    }
    const r = rSum / Math.max(count, 1);
    const g = gSum / Math.max(count, 1);
    const b = bSum / Math.max(count, 1);

    let profile = 'golden_brown';
    if (g > r * 1.08 && g > b * 1.15) {
      profile = 'green';
    } else if (r > g * 1.25 && r > 130) {
      profile = 'red_orange';
    } else if (r > 195 && g > 195 && b > 185) {
      profile = 'light_neutral';
    } else if (r > 170 && g > 145 && b < 120) {
      profile = 'warm_yellow';
    } else if (r < 130 && g < 105 && b < 90) {
      profile = 'brown';
    }

    const candidates = FOOD_CALORIE_DATABASE.filter(x => x.colorProfile === profile);
    const chosen = candidates[0] || FOOD_CALORIE_DATABASE[0];
    return {
      matched: chosen,
      reasonAr: 'تم تحليل الصورة بصريًا واقتراح نوع الأكل الأقرب (يمكنك تعديله من القائمة)'
    };
  } catch {
    return { matched: FOOD_CALORIE_DATABASE[0], reasonAr: 'تم فتح الصورة بنجاح' };
  }
}
