        const hay = `${n.title} ${n.content || ''} ${itemsText} ${tagsText}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    })
    .sort((a, b) => {
      if (Boolean(b.pinned) !== Boolean(a.pinned)) return b.pinned ? 1 : -1;

  containerEl.innerHTML = `

      </div>
      <div class="filter-pills">
        ${[
          { key: 'all', label: 'الكل' },
          { key: 'text', label: 'ملاحظات نصية' },
          { key: 'checklist', label: 'قوائم تحقق' },
          { key: 'shopping', label: 'قوائم مشتريات 🛒' }
        ].map(p => `
          <button type="button" class="pill ${notesFilterState.noteType === p.key ? 'active' : ''}" data-note-type="${p.key}">
            ${escapeHtml(p.label)}
          </button>
        `).join('')}
      </div>
    </div>

    <div class="item-list">
      ${filtered.length === 0
        ? renderEmptyState({
            icon: 'note',
            title: 'لا توجد ملاحظات أو قوائم محفوظة',
            description: 'دوّن ملاحظاتك، أفكارك، وقوائم المشتريات مع حفظ تلقائي فوري يمنع ضياع أي نص.',
            actionLabel: 'إنشاء ملاحظة جديدة',
            actionId: 'notes-empty-add-btn'
          })
        : filtered.map(n => {
            const chkCount = (n.checklistItems || []).length;
            const chkDone = (n.checklistItems || []).filter(i => i.completed).length;
            return `
              <div class="card card-interactive" data-open-note="${escapeHtml(n.id)}" style="display:flex;flex-direction:column;gap:8px;">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                  <div style="font-weight:800;font-size:0.96rem;display:flex;align-items:center;gap:6px;">
                    ${n.pinned ? `<span title="مثبتة">📌</span>` : ''}
                    <span>${escapeHtml(n.title)}</span>
                  </div>
                  <button type="button" class="icon-btn" style="width:30px;height:30px;" data-pin-note="${escapeHtml(n.id)}" aria-label="تثبيت الملاحظة">
                    ${getIconSvg('pin', 14)}
                  </button>
                </div>
                ${n.content ? `<p style="font-size:0.84rem;color:var(--text-secondary);white-space:pre-line;">${escapeHtml(n.content.slice(0, 160))}${n.content.length > 160 ? '...' : ''}</p>` : ''}
                ${chkCount > 0 ? `
                  <div style="font-size:0.78rem;color:var(--color-accent);font-weight:700;">
                    ☑️ عناصر القائمة: ${chkDone} من ${chkCount} مكتمل
                  </div>
                ` : ''}
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:0.72rem;color:var(--text-muted);">
                  <span>آخر تعديل: ${escapeHtml((n.updatedAt || '').slice(0, 16).replace('T', ' '))}</span>
                  <div>

                  </div>
                </div>
              </div>
            `;
          }).join('')

  document.getElementById('notes-new-btn')?.addEventListener('click', () => openNoteModal(null, onRefreshApp));
  containerEl.querySelector('[data-empty-action="notes-empty-add-btn"]')?.addEventListener('click', () => openNoteModal(null, onRefreshApp));

  document.getElementById('notes-search-input')?.addEventListener('input', (e) => {
    notesFilterState.query = e.target.value;
    renderNotesView(containerEl, onRefreshApp);
  });

  containerEl.querySelectorAll('[data-note-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      notesFilterState.noteType = btn.getAttribute('data-note-type');
      renderNotesView(containerEl, onRefreshApp);
    });
  });

  containerEl.querySelectorAll('[data-pin-note]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-pin-note');

      showToast('تم تحديث حالة تثبيت الملاحظة', 'info');

    });
  });

  containerEl.querySelectorAll('[data-open-note]').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.getAttribute('data-open-note');
      const found = allNotes.find(x => x.id === id);
      if (found) openNoteModal(found, onRefreshApp);
    });
  });
}

};

const DEVICE_CAPABILITY_PROFILES = {

    officialApp: 'Huawei Health (com.huawei.health) / HONOR Health',
    requiresAuthKey: false,
    authKeyFormatDesc: 'معرّف حساب Huawei المكون من 17 رقمًا (HUID) مطلوب فقط للتعايش مع التطبيق الرسمي دون إعادة ضبط المصنع',
    supportedMetrics: ['steps', 'distance', 'calories', 'heart_rate', 'resting_heart_rate', 'sleep', 'exercise', 'battery'],
    unsupportedMetrics: ['spo2', 'stress', 'blood_pressure', 'respiratory_rate'],
    limitationsAr: [
      'قياس الأكسجين في الدم (SpO₂) ومستوى الإجهاد (Stress) غير مدعومين عتاديًا في الإصدار الأساسي من HONOR Band 4 (CRS-B19).',
      'لا يسمح السوار إلا باتصال Bluetooth نشط واحد في الوقت نفسه؛ وجود اتصال نشط من تطبيق Huawei Health يمنع الاتصال المباشر حتى يتم إيقافه بموافقة المستخدم.',
      'تفاصيل مراحل النوم (TruSleep) للأجهزة الأقدم من HarmonyOS 5 تزامن وقت البداية والنهاية فقط عبر BLE المباشر ما لم يتم تعطيل TruSleep أو المزامنة عبر التطبيق الرسمي.'
    ]
  }
};

const HealthNormalizer = {
  getSourceLabel(sourceType, sourcePackage = '') {
    if (sourcePackage === 'com.xiaomi.wearable' || sourcePackage === 'com.mi.health') {
      return 'Health Connect (Mi Fitness)';
    }
    if (sourcePackage === 'com.huawei.health' || sourcePackage === 'com.hihonor.health') {
      return 'Health Connect (Huawei / HONOR Health)';
    }
    if (sourcePackage === 'com.google.android.apps.fitness') {
      return 'Google Fit (عبر Health Connect)';
    }
    return HEALTH_SOURCE_LABELS[sourceType] || sourceType || 'مصدر غير محدد';
  },

  getSourcePriority(record) {
    if (record.sourcePackage === 'com.xiaomi.wearable' || record.sourcePackage === 'com.huawei.health') {
      return HEALTH_SOURCE_PRIORITY.health_connect_wearable;
    }
    return HEALTH_SOURCE_PRIORITY[record.sourceType] || 50;
  },

  /**
   * توحيد سجل صحي واحد مع معالجة فرق توقيت الجهاز (clockDriftOffsetMs)
   */
  normalizeRecord(input, clockDriftOffsetMs = 0) {
    if (!input || typeof input !== 'object') {
      throw new Error('بيانات السجل الصحي غير صالحة.');
    }
    const metricType = String(input.metricType || '').trim();
    if (!HEALTH_METRIC_DEFS[metricType]) {
      throw new Error(`نوع القياس الصحي غير معروف: ${metricType}`);
    }

    const numVal = Number(input.value);
    if (!Number.isFinite(numVal) || numVal < 0) {
      throw new Error('قيمة القياس الصحي يجب أن تكون رقمًا صحيحًا أو عشريًا غير سالب.');
    }

    const drift = Number.isFinite(Number(clockDriftOffsetMs)) ? Number(clockDriftOffsetMs) : 0;
    const rawStart = input.startTime ? new Date(input.startTime) : new Date();
    const rawEnd = input.endTime ? new Date(input.endTime) : rawStart;

    if (Number.isNaN(rawStart.getTime()) || Number.isNaN(rawEnd.getTime())) {
      throw new Error('توقيت القياس الصحي غير صالح.');
    }

    const adjustedStart = new Date(rawStart.getTime() + drift);
    const adjustedEnd = new Date(Math.max(adjustedStart.getTime(), rawEnd.getTime() + drift));

    const localDate = input.localDate || getLocalDateString(adjustedStart);
    const sourceType = String(input.sourceType || 'manual_verified').trim();
    const sourcePackage = String(input.sourcePackage || '').trim();
    const sourceRecordId = input.sourceRecordId ? String(input.sourceRecordId).trim() : null;

    const id = input.id || (sourceRecordId
      ? `hrec_${metricType}_${sourceType}_${sourceRecordId}`
      : generateId(`hrec_${metricType}`));

    return {
      id,
      metricType,
      value: Math.round(numVal * 100) / 100,
      unit: input.unit || HEALTH_METRIC_DEFS[metricType].unit,
      startTime: adjustedStart.toISOString(),
      endTime: adjustedEnd.toISOString(),
      localDate,
      sourceType,
      sourcePackage,
      sourceNameAr: this.getSourceLabel(sourceType, sourcePackage),
      sourceRecordId,
      deviceModel: input.deviceModel ? String(input.deviceModel).trim() : null,
      deviceId: input.deviceId ? String(input.deviceId).trim() : null,
      importedAt: input.importedAt || new Date().toISOString(),
      clockDriftAppliedMs: drift,
      dedupStatus: input.dedupStatus || 'unique_primary',
      dedupReason: input.dedupReason || 'سجل أساسي معتمد',
      stages: Array.isArray(input.stages) ? input.stages : null,
      exerciseType: input.exerciseType ? String(input.exerciseType).trim() : null,
      exerciseTitle: input.exerciseTitle ? String(input.exerciseTitle).trim() : null,
      systolic: input.systolic ? Number(input.systolic) : null,
      diastolic: input.diastolic ? Number(input.diastolic) : null,
      isLiveReading: Boolean(input.isLiveReading)
    };
  },

  /**
   * التحقق من تداخل فترتين زمنيتين [s1, e1] و [s2, e2]
   */
  intervalsOverlap(startIso1, endIso1, startIso2, endIso2) {
    const s1 = new Date(startIso1).getTime();
    const e1 = new Date(endIso1).getTime();
    const s2 = new Date(startIso2).getTime();
    const e2 = new Date(endIso2).getTime();
    if (Number.isNaN(s1) || Number.isNaN(e1) || Number.isNaN(s2) || Number.isNaN(e2)) return false;
    // إذا كانت قراءة نقطية أو فترة كاملة في نفس اليوم لمقياس تراكمي
    if (s1 === e1 || s2 === e2) {
      return Math.abs(s1 - s2) < 60000; // أقل من دقيقة
    }
    return s1 < e2 && e1 > s2;
  },

  /**
   * استيراد وتوحيد دفعة سجلات صحية مع منع التكرار الذكي دون فقدان سجل التدقيق
   */
  async ingestHealthRecords(rawRecordsList, options = {}, dbName = DB_NAME) {
    const clockDriftOffsetMs = Number(options.clockDriftOffsetMs || 0);
    const existingRecords = await getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName);
    const byId = new Map(existingRecords.map(r => [r.id, r]));

    let insertedCount = 0;
    let updatedCount = 0;
    let suppressedDuplicatesCount = 0;

    for (const raw of rawRecordsList) {
      const normalized = this.normalizeRecord(raw, clockDriftOffsetMs);

      // 1. فحص التطابق التام عبر المعرف الأصلي (sourceRecordId) أو البصمة الدقيقة
      const exactMatch = Array.from(byId.values()).find(ex => {
        if (normalized.sourceRecordId && ex.sourceRecordId === normalized.sourceRecordId && ex.metricType === normalized.metricType && ex.sourceType === normalized.sourceType) {
          return true;
        }
        return (
          ex.metricType === normalized.metricType &&
          ex.sourceType === normalized.sourceType &&
          ex.startTime === normalized.startTime &&
          ex.endTime === normalized.endTime &&
          Number(ex.value) === Number(normalized.value)
        );
      });

      if (exactMatch) {
        const merged = { ...exactMatch, ...normalized, id: exactMatch.id };
        byId.set(merged.id, merged);
        updatedCount++;
        continue;
      }

      byId.set(normalized.id, normalized);
      insertedCount++;
    }

    // 2. إعادة تقييم التداخل للمقاييس التراكمية (الخطوات، المسافة، السعرات) لمنع جمع الهاتف + السوار معًا
    const allNormalized = Array.from(byId.values());
    const cumulativeMetrics = new Set(['steps', 'distance', 'calories']);

    // نرتب تنازليًا حسب أولوية المصدر ثم القيمة الأكبر ضمن نفس الفترة
    allNormalized.sort((a, b) => {
      const prioDiff = this.getSourcePriority(b) - this.getSourcePriority(a);
      if (prioDiff !== 0) return prioDiff;
      return Number(b.value) - Number(a.value);
    });

    const acceptedByDateAndMetric = new Map();

    for (const rec of allNormalized) {
      if (!cumulativeMetrics.has(rec.metricType)) {
        rec.dedupStatus = 'unique_primary';
        rec.dedupReason = 'قياس فسيولوجي مستقل بالزمن';
        continue;
      }

      const key = `${rec.metricType}_${rec.localDate}`;
      if (!acceptedByDateAndMetric.has(key)) {
        acceptedByDateAndMetric.set(key, []);
      }
      const acceptedList = acceptedByDateAndMetric.get(key);

      // هل يتداخل زمنيًا أو يمثل نفس النشاط اليومي من مصدر مختلف؟
      const conflictingPrimary = acceptedList.find(primary => {
        if (primary.sourceType !== rec.sourceType || primary.sourcePackage !== rec.sourcePackage) {
          // إذا كان من مصدرين مختلفين (مثل الهاتف والسوار) في نفس اليوم وفترتاهما متداخلتان أو تغطيان اليوم
          return this.intervalsOverlap(primary.startTime, primary.endTime, rec.startTime, rec.endTime) ||
            primary.localDate === rec.localDate;
        }
        return this.intervalsOverlap(primary.startTime, primary.endTime, rec.startTime, rec.endTime);
      });

      if (conflictingPrimary) {
        rec.dedupStatus = 'suppressed_duplicate';
        rec.dedupReason = `مستبعد من المجموع لمنع ازدواجية العد مع (${conflictingPrimary.sourceNameAr})`;
        suppressedDuplicatesCount++;
      } else {
        rec.dedupStatus = 'unique_primary';
        rec.dedupReason = 'المصدر الأساسي المعتمد لهذه الفترة';
        acceptedList.push(rec);
      }
    }

    // حفظ جميع السجلات في قاعدة البيانات
    for (const rec of allNormalized) {
      await updateRecord(STORE_NAMES.HEALTH_RECORDS, rec, dbName);
    }

    return {
      insertedCount,
      updatedCount,
      suppressedDuplicatesCount,
      totalRecords: allNormalized.length
    };
  },

  /**
   * حساب ملخص دقيق وصادق لفترة محددة دون إظهار أصفار وهمية عند غياب البيانات
   */
  summarizePeriod(allRecords, options = {}) {
    const referenceDate = options.referenceDate || getLocalDateString();
    const period = options.period || 'day'; // 'day' | 'week' | 'month'
    const activeDeviceFamily = options.activeDeviceFamily || null;

    let startDate = referenceDate;
    let daysCount = 1;
    if (period === 'week') {
      startDate = addDaysToDateString(referenceDate, -6);
      daysCount = 7;
    } else if (period === 'month') {
      startDate = addDaysToDateString(referenceDate, -29);
      daysCount = 30;
    }

    const inRange = allRecords.filter(r => r.localDate >= startDate && r.localDate <= referenceDate);
    const primaryInRange = inRange.filter(r => r.dedupStatus === 'unique_primary');
    const todayPrimary = primaryInRange.filter(r => r.localDate === referenceDate);

    const unsupportedByActiveBand = new Set(
      activeDeviceFamily && DEVICE_CAPABILITY_PROFILES[activeDeviceFamily]
        ? DEVICE_CAPABILITY_PROFILES[activeDeviceFamily].unsupportedMetrics
        : []
    );

    const buildMetricCardSummary = (metricType, scopeRecords) => {
      const def = HEALTH_METRIC_DEFS[metricType];
      const matching = scopeRecords
        .filter(r => r.metricType === metricType)
        .sort((a, b) => String(b.endTime || b.startTime).localeCompare(String(a.endTime || a.startTime)));

      if (matching.length === 0) {
        const isUnsupported = unsupportedByActiveBand.has(metricType);
        return {
          metricType,
          available: false,
          unsupported: isUnsupported,
          value: null,
          displayText: isUnsupported ? 'غير مدعوم في السوار الحالي' : 'لا توجد بيانات',
          unit: def.unit,
          sourceNameAr: null,
          lastTimestamp: null,
          recordsCount: 0,
          records: []
        };
      }

      const latest = matching[0];
      let aggregatedValue = latest.value;
      if (def.cumulative) {
        aggregatedValue = Math.round(matching.reduce((sum, r) => sum + Number(r.value || 0), 0) * 100) / 100;
      }

      return {
        metricType,
        available: true,
        unsupported: false,
        value: aggregatedValue,
        latestReading: latest,
        displayText: metricType === 'blood_pressure' && latest.systolic && latest.diastolic
          ? `${latest.systolic}/${latest.diastolic} ${def.unit}`
          : `${aggregatedValue.toLocaleString('en-US')} ${def.unit}`,
        unit: def.unit,
        sourceNameAr: latest.sourceNameAr,
        lastTimestamp: latest.endTime || latest.startTime,
        recordsCount: matching.length,
        records: matching
      };
    };

    // بناء السلاسل الزمنية للرسم البياني حسب الفترة
    const buildChartSeries = (metricType) => {
      const def = HEALTH_METRIC_DEFS[metricType];
      const points = [];
      for (let i = daysCount - 1; i >= 0; i--) {
        const dStr = addDaysToDateString(referenceDate, -i);
        const dayRecs = primaryInRange.filter(r => r.localDate === dStr && r.metricType === metricType);
        if (dayRecs.length === 0) {
          points.push({ date: dStr, label: dStr.slice(5), value: null, hasData: false });
        } else {
          const val = def.cumulative
            ? Math.round(dayRecs.reduce((acc, r) => acc + Number(r.value || 0), 0) * 100) / 100
            : Math.round((dayRecs.reduce((acc, r) => acc + Number(r.value || 0), 0) / dayRecs.length) * 10) / 10;
          points.push({
            date: dStr,
            label: dStr.slice(5),
            value: val,
            hasData: true,
            sourceNameAr: dayRecs[0].sourceNameAr
          });
        }
      }
      return {
        metricType,
        hasAnyData: points.some(p => p.hasData),
        points
      };
    };

    const scopeForCards = period === 'day' ? todayPrimary : primaryInRange;

    return {
      period,
      startDate,
      endDate: referenceDate,
      totalRawRecordsInPeriod: inRange.length,
      suppressedDuplicatesInPeriod: inRange.filter(r => r.dedupStatus === 'suppressed_duplicate').length,
      metrics: {
        steps: buildMetricCardSummary('steps', scopeForCards),
        distance: buildMetricCardSummary('distance', scopeForCards),
        calories: buildMetricCardSummary('calories', scopeForCards),
        heart_rate: buildMetricCardSummary('heart_rate', primaryInRange),
        resting_heart_rate: buildMetricCardSummary('resting_heart_rate', primaryInRange),
        sleep: buildMetricCardSummary('sleep', scopeForCards),
        exercise: buildMetricCardSummary('exercise', scopeForCards),
        spo2: buildMetricCardSummary('spo2', primaryInRange),
        stress: buildMetricCardSummary('stress', primaryInRange),
        blood_pressure: buildMetricCardSummary('blood_pressure', primaryInRange),
        weight: buildMetricCardSummary('weight', primaryInRange),
        respiratory_rate: buildMetricCardSummary('respiratory_rate', primaryInRange)
      },
      buildChartSeries,
      allPeriodRecords: inRange.sort((a, b) => String(b.startTime).localeCompare(String(a.startTime)))
    };
  }
};

/**
 * YAWMI — Strictly Real Wearable BLE & Android Health Connect Bridge Layer
 *
 * التزام صارم بالشرط الأساسي للمستخدم:
 * 1) لا ينشئ هذا الملف أي أجهزة وهمية أو قراءات افتراضية أو حالات «متصل ✓» شكلية.
 * 2) لا تصبح حالة السوار «connected» إلا إذا تم اتصال Bluetooth GATT حقيقي فعلي عبر:
 *    - إضافة Kotlin الأصلية (window.Capacitor.Plugins.YawmiHealthWearable) داخل تطبيق Android APK، أو
 *    - واجهة Web Bluetooth الحقيقية (navigator.bluetooth.requestDevice -> device.gatt.connect()).
 * 3) لا تصبح حالة Health Connect «مرتبط» إلا إذا تم التحقق الفعلي من HealthConnectClient داخل تطبيق Android APK الأصلي.
 * 4) عند تشغيل التطبيق داخل معاينة الويب المعزولة (حيث لا تتوفر الإضافة الأصلية أو Web Bluetooth)،
 *    يعرض التطبيق الحقيقة التقنية بدقة دون تزييف.
 */

const HEALTH_SYNC_STATE_ID = 'global_health_sync_state';

function getNativeHealthPlugin() {
  if (
    typeof window !== 'undefined' &&
    window.Capacitor &&
    window.Capacitor.Plugins &&
    window.Capacitor.Plugins.YawmiHealthWearable
  ) {
    return window.Capacitor.Plugins.YawmiHealthWearable;
  }
  return null;
}

function hasWebBluetoothSupport() {
  return typeof navigator !== 'undefined' && Boolean(navigator.bluetooth && typeof navigator.bluetooth.requestDevice === 'function');
}

/**
 * فحص تشخيصي حقيقي للبيئة الحالية (يوضح للمستخدم بدقة ما هو متاح فعليًا على جهازه الآن)
 */
function diagnoseRuntimeCapabilities() {
  const nativePlugin = getNativeHealthPlugin();
  const webBleSupported = hasWebBluetoothSupport();
  const isIframe = typeof window !== 'undefined' && window.self !== window.top;
  const ua = typeof navigator !== 'undefined' ? navigator.userAgent : '';
  const isAndroid = /Android/i.test(ua);
  const isWebView = isAndroid && (/; wv\)/i.test(ua) || !hasWebBluetoothSupport());

  return {
    isNativeAndroidApk: Boolean(nativePlugin),
    hasWebBluetoothApi: webBleSupported,
    isSandboxedIframe: isIframe,
    isAndroidDevice: isAndroid,
    isAndroidWebView: isWebView,
    canRealBleScanNow: Boolean(nativePlugin) || (webBleSupported && !isIframe),
    canRealHealthConnectNow: Boolean(nativePlugin),
    environmentLabelAr: nativePlugin
      ? 'تطبيق Android APK أصلي (جميع جسور البلوتوث وHealth Connect فعّالة)'
      : (isIframe
        ? 'نافذة معاينة معزولة (Sandboxed Preview / WebView) — تحجب الوصول المباشر لبلوتوث النظام وHealth Connect'
        : (webBleSupported
          ? 'متصفح يدعم Web Bluetooth API (يدعم مسح البلوتوث المباشر، ولا يدعم Health Connect لأنه يتطلب APK)'
          : 'عارض WebView / متصفح لا يدعم Web Bluetooth ولا يحتوي على حزمة APK الأصلية'))
  };
}

/**
 * عداد خطوات يعتمد حصريًا على مستشعر التسارع الفيزيائي في الهاتف (DeviceMotionEvent)
 * يُسجل كمصدر مستقل («مستشعرات الهاتف») ولا يُخلط أبدًا مع اتصال الساعة!
 */
const PhoneSensorPedometer = {
  isRunning: false,
  sessionSteps: 0,
  lastPeakTime: 0,
  lastMagnitude: 9.8,
  motionEventsReceived: 0,
  listener: null,
  onStepCallback: null,

  isSupported() {
    return typeof window !== 'undefined' && 'DeviceMotionEvent' in window;
  },

  start(onUpdate = null) {
    if (!this.isSupported()) {
      throw new Error('مستشعر الحركة (DeviceMotionEvent) غير مدعوم في هذا المتصفح.');
    }
    if (this.isRunning) return true;
    this.onStepCallback = onUpdate;
    this.isRunning = true;

    this.listener = (event) => {
      const acc = event.accelerationIncludingGravity || event.acceleration;
      if (!acc || acc.x === null) return;
      this.motionEventsReceived += 1;
      const mag = Math.sqrt(
        Number(acc.x || 0) ** 2 +
        Number(acc.y || 0) ** 2 +
        Number(acc.z || 0) ** 2
      );
      const now = Date.now();
      if (mag > 12.2 && this.lastMagnitude <= 12.2 && now - this.lastPeakTime > 330) {
        this.lastPeakTime = now;
        this.sessionSteps += 1;
        if (typeof this.onStepCallback === 'function') {
          this.onStepCallback(this.getMetrics());
        }
      }
      this.lastMagnitude = mag;
    };
    window.addEventListener('devicemotion', this.listener, { passive: true });
    return true;
  },

  stop() {
    if (this.listener && typeof window !== 'undefined') {
      window.removeEventListener('devicemotion', this.listener);
    }
    this.listener = null;
    this.isRunning = false;
  },

  getMetrics() {
    const steps = this.sessionSteps;
    const distanceKm = Math.round(steps * 0.00072 * 100) / 100;
    const caloriesKcal = Math.round(steps * 0.042 * 10) / 10;
    return {
      steps,
      distanceKm,
      caloriesKcal,
      isRunning: this.isRunning,
      motionEventsReceived: this.motionEventsReceived
    };
  },

  async syncToDatabase(dbName = DB_NAME) {
    const m = this.getMetrics();
    if (m.steps <= 0) {
      throw new Error('لم يلتقط مستشعر الهاتف أي خطوات فعلية بعد (تحرك بالهاتف أثناء تشغيل المستشعر لالتقاط الخطوات الحقيقية).');
    }
    const todayStr = getLocalDateString();
    const nowIso = new Date().toISOString();
    return HealthNormalizer.ingestHealthRecords([
      {
        sourceRecordId: `phone_pedometer_steps_${todayStr}`,
        metricType: 'steps',
        value: m.steps,
        startTime: `${todayStr}T06:00:00.000Z`,
        endTime: nowIso,
        localDate: todayStr,
        sourceType: 'phone_sensor',
        sourcePackage: 'com.yawmi.personalassistant.sensor',
        deviceModel: 'مستشعر حركة الهاتف (Accelerometer)'
      }
    ], {}, dbName);
  }
};

/**
 * طبقة بروتوكول مستقلة لسوار Xiaomi Smart Band 10 (Xiaomi Vela Protobuf over 0xFE95)
 */
const XiaomiBand10Protocol = {
  SERVICE_UUID: '0000fe95-0000-1000-8000-00805f9b34fb',
  BATTERY_SERVICE_UUID: '0000180f-0000-1000-8000-00805f9b34fb',
  BATTERY_CHAR_UUID: '00002a19-0000-1000-8000-00805f9b34fb',
  DEVICE_INFO_UUID: '0000180a-0000-1000-8000-00805f9b34fb',

  validateAuthKey(rawHex) {
    const cleaned = String(rawHex || '').trim().replace(/^0x/i, '');
    if (!/^[0-9a-fA-F]{32}$/.test(cleaned)) {
      throw new Error('مفتاح مصادقة Xiaomi Smart Band 10 يجب أن يتكون من 32 خانة ست عشرية (16 بايت) مثل: 0x46fec12c98382d00aabbccddeeff0011');
    }
    return '0x' + cleaned.toLowerCase();
  },

  buildProtobufHandshakePacket() {
    return new Uint8Array([0x01, 0x01, 0x08, 0x01]);
  }
};

/**
 * طبقة بروتوكول مستقلة لسوار HONOR Band 4 (Huawei/Honor LinkLayer TLV over 0xFE86)
 */
const HonorBand4Protocol = {
  SERVICE_UUID: '0000fe86-0000-1000-8000-00805f9b34fb',
  WRITE_CHAR_UUID: '0000fe01-0000-1000-8000-00805f9b34fb',
  NOTIFY_CHAR_UUID: '0000fe02-0000-1000-8000-00805f9b34fb',
  BATTERY_SERVICE_UUID: '0000180f-0000-1000-8000-00805f9b34fb',
  BATTERY_CHAR_UUID: '00002a19-0000-1000-8000-00805f9b34fb',

  validateHuaweiAccountId(rawHuid) {
    const cleaned = String(rawHuid || '').trim();
    if (!cleaned) return '';
    if (!/^\d{10,24}$/.test(cleaned)) {
      throw new Error('معرّف حساب Huawei/Honor (HUID) للتعايش مع التطبيق الرسمي يجب أن يتكون من أرقام فقط (عادة 17 رقمًا).');
    }
    return cleaned;
  },

  computeCrc16(bytes) {
    let crc = 0xFFFF;
    for (let i = 0; i < bytes.length; i++) {
      crc = ((crc >>> 8) | (crc << 8)) & 0xFFFF;
      crc ^= (bytes[i] & 0xFF);
      crc ^= ((crc & 0xFF) >>> 4);
      crc ^= (crc << 12) & 0xFFFF;
      crc ^= ((crc & 0xFF) << 5) & 0xFFFF;
    }
    return crc & 0xFFFF;
  },

  buildLinkLayerFrame(serviceId, commandId, tlvBytes = []) {
    const len = 2 + tlvBytes.length;
    const body = new Uint8Array(4 + tlvBytes.length);
    body[0] = 0xAA;
    body[1] = len & 0xFF;
    body[2] = serviceId & 0xFF;
    body[3] = commandId & 0xFF;
    for (let i = 0; i < tlvBytes.length; i++) {
      body[4 + i] = tlvBytes[i] & 0xFF;
    }
    const crc = this.computeCrc16(body);
    const frame = new Uint8Array(body.length + 2);
    frame.set(body, 0);
    frame[body.length] = (crc >>> 8) & 0xFF;
    frame[body.length + 1] = crc & 0xFF;
    return frame;
  }
};

// Runtime map of real Web Bluetooth GATT connections in current session
const activeWebBleConnections = new Map();

async function getOrInitHealthSyncState(dbName = DB_NAME) {
  await initDatabase(dbName);
  const existing = await getRecord(STORE_NAMES.HEALTH_SYNC_STATE, HEALTH_SYNC_STATE_ID, dbName);
  const nativePlugin = getNativeHealthPlugin();

  if (existing) {
    // تصحيح تلقائي: إذا لم تكن الإضافة الأصلية محمّلة (أي داخل معاينة الويب)، لا ندّعي أبدًا أن Health Connect مرتبط!
    if (!nativePlugin && existing.healthConnectLinked) {
      const corrected = {
        ...existing,
        environmentType: 'web_browser_or_webview',
        healthConnectSdkStatus: 'requires_native_android_apk',
        healthConnectLinked: false,
        grantedPermissions: [],
        updatedAt: new Date().toISOString()
      };
      await updateRecord(STORE_NAMES.HEALTH_SYNC_STATE, corrected, dbName);
      return corrected;
    }
    return existing;
  }

  const initial = {
    id: HEALTH_SYNC_STATE_ID,
    environmentType: nativePlugin ? 'capacitor_android_native' : 'web_browser_or_webview',
    healthConnectSdkStatus: nativePlugin ? 'checking' : 'requires_native_android_apk',
    healthConnectLinked: false,
    grantedPermissions: [],
    googleFitSourceDetected: false,
    sourcesDetected: [],
    lastSuccessfulSyncAt: null,
    lastAttemptedSyncAt: null,
    lastSyncStatus: 'idle',
    lastSyncProgressPct: null,
    lastSyncError: null,
    backgroundSyncEnabled: false,
    consentGranted: true,
    clockDriftOffsetMs: 0,
    updatedAt: new Date().toISOString()
  };
  await addRecord(STORE_NAMES.HEALTH_SYNC_STATE, initial, dbName);
  return initial;
}

async function patchHealthSyncState(patch, dbName = DB_NAME) {
  const current = await getOrInitHealthSyncState(dbName);
  const updated = {
    ...current,
    ...patch,
    id: HEALTH_SYNC_STATE_ID,
    updatedAt: new Date().toISOString()
  };
  await updateRecord(STORE_NAMES.HEALTH_SYNC_STATE, updated, dbName);
  return updated;
}

const YawmiHealthAPI = {
  isNativeAndroidAvailable() {
    return Boolean(getNativeHealthPlugin());
  },

  isWebBluetoothAvailable() {
    return hasWebBluetoothSupport();
  },

  diagnoseRuntimeCapabilities,
  PhoneSensorPedometer,

  /**
   * 1. scanDevices() — بحث حقيقي فقط عبر Capacitor Native BLE أو Web Bluetooth API
   * لا يُنشئ أبدًا أجهزة وهمية إذا لم يكن البلوتوث الحقيقي متاحًا!
   */
  async scanDevices(options = {}, dbName = DB_NAME) {
    const nativePlugin = getNativeHealthPlugin();

    // المسار 1: إضافة Android الأصلية المكتوبة بـ Kotlin (داخل APK المثبت)
    if (nativePlugin) {
      const permRes = await nativePlugin.requestBlePermissions();
      if (!permRes || !permRes.granted) {
        throw new Error('تم رفض أذونات Bluetooth للأجهزة القريبة في أندرويد. يرجى السماح بإذن BLUETOOTH_SCAN و BLUETOOTH_CONNECT.');
      }
      const res = await nativePlugin.scanDevices();
      const found = Array.isArray(res?.devices) ? res.devices : [];
      for (const dev of found) {
        const existing = await getRecord(STORE_NAMES.WEARABLE_DEVICES, dev.id, dbName);
        const merged = {
          id: dev.id,
          name: dev.name || 'سوار ذكي مكتشف',
          family: dev.family || 'generic_ble',
          rssi: dev.rssi ?? null,
          connectionState: existing?.connectionState || 'disconnected',
          batteryLevel: existing?.batteryLevel ?? null,
          firmwareVersion: existing?.firmwareVersion || null,
          authConfigured: Boolean(dev.authConfigured || existing?.authConfigured),
          autoReconnect: existing?.autoReconnect ?? true,
          lastConnectedAt: existing?.lastConnectedAt || null,
          lastSyncedAt: existing?.lastSyncedAt || null,
          lastError: null,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, merged, dbName);
      }
      return found;
    }

    // المسار 2: Web Bluetooth API الحقيقي في متصفح Chrome على الهاتف أو الحاسوب
    if (hasWebBluetoothSupport()) {
      try {
        const btDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            XiaomiBand10Protocol.SERVICE_UUID,
            HonorBand4Protocol.SERVICE_UUID,
            XiaomiBand10Protocol.BATTERY_SERVICE_UUID,
            XiaomiBand10Protocol.DEVICE_INFO_UUID,
            '0000180d-0000-1000-8000-00805f9b34fb'
          ]
        });

        const name = btDevice.name || 'جهاز Bluetooth LE حقيقي';
        const family = /smart band 10|mi band 10/i.test(name)
          ? 'xiaomi_band_10'
          : (/honor band 4|crs-b19/i.test(name) ? 'honor_band_4' : 'generic_ble');

        const devId = btDevice.id || generateId('ble_dev');
        activeWebBleConnections.set(devId, { btDevice, gattServer: null });

        const record = {
          id: devId,
          name,
          family,
          rssi: null,
          connectionState: 'disconnected',
          batteryLevel: null,
          firmwareVersion: null,
          authConfigured: false,
          autoReconnect: true,
          lastConnectedAt: null,
          lastSyncedAt: null,
          lastError: null,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, record, dbName);
        return [record];
      } catch (err) {
        const msg = String(err?.message || err || '');
        if (/user cancelled|canceled/i.test(msg)) {
          throw new Error('تم إلغاء نافذة اختيار جهاز البلوتوث من قِبل المستخدم.');
        }
        const errObj = new Error('تعذر تشغيل مسح البلوتوث المباشر من داخل نافذة المعاينة المعزولة.');
        errObj.code = 'BLE_BLOCKED_IN_PREVIEW';
        throw errObj;
      }
    }

    const errObj = new Error('نافذة المعاينة الحالية (WebView) لا تملك صلاحية الوصول إلى شريحة البلوتوث في الهاتف.');
    errObj.code = 'BLE_UNAVAILABLE_IN_WEBVIEW';
    throw errObj;
  },

  /**
   * تسجيل ملف تعريف جهاز في قائمة الأجهزة المحفوظة بحالة «غير متصل» بانتظار الاتصال الحقيقي
   */
  async registerDeviceProfile(input, dbName = DB_NAME) {
    const family = ['xiaomi_band_10', 'honor_band_4', 'generic_ble'].includes(input?.family)
      ? input.family
      : 'xiaomi_band_10';
    const profile = DEVICE_CAPABILITY_PROFILES[family];
    const name = String(input?.name || profile?.displayName || 'سوار ذكي').trim();
    const macOrId = String(input?.macAddress || '').trim() || `saved_${family}_${Date.now().toString(36)}`;

    const record = {
      id: macOrId,
      name,
      family,
      macAddress: String(input?.macAddress || '').trim() || null,
      rssi: null,
      connectionState: 'disconnected',
      batteryLevel: null,
      firmwareVersion: null,
      authConfigured: false,
      autoReconnect: Boolean(input?.autoReconnect ?? true),
      lastConnectedAt: null,
      lastSyncedAt: null,
      lastError: null,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, record, dbName);
    return record;
  },

  /**
   * التحقق من مفتاح المصادقة وحفظه في Android Keystore عند توفر الإضافة الأصلية
   */
  async setDeviceAuthKey(deviceId, rawSecret, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز غير موجود في قائمة الأجهزة المحفوظة.');

    let validated = '';
    if (dev.family === 'xiaomi_band_10') {
      validated = XiaomiBand10Protocol.validateAuthKey(rawSecret);
    } else if (dev.family === 'honor_band_4') {
      validated = HonorBand4Protocol.validateHuaweiAccountId(rawSecret);
    } else {
      validated = String(rawSecret || '').trim();
    }

    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      await nativePlugin.setDeviceAuthKey({
        deviceId: dev.id,
        family: dev.family,
        authKey: validated
      });
      const updated = {
        ...dev,
        authConfigured: true,
        authStorageMode: 'android_keystore_aes_gcm',
        updatedAt: new Date().toISOString()
      };
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
      return { savedInKeystore: true, mode: 'android_keystore_aes_gcm' };
    }

    const updated = {
      ...dev,
      authConfigured: Boolean(validated),
      authStorageMode: 'verified_format_pending_apk_keystore',
      updatedAt: new Date().toISOString()
    };
    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
    return {
      savedInKeystore: false,
      mode: 'verified_format_pending_apk_keystore',
      notice: 'تم التحقق من صحة صيغة المفتاح. لا يتم تخزين المفتاح كنص صريح في المتصفح؛ يُشفر داخل Android Keystore عند تثبيت تطبيق APK.'
    };
  },

  /**
   * 2. connectDevice(deviceId) — اتصال حقيقي فقط! لا يكتب «متصل» أبدًا دون اتصال GATT فعلي!
   */
  async connectDevice(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز المطلوب غير موجود في قائمة الأجهزة.');

    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
      ...dev,
      connectionState: 'connecting',
      lastError: null,
      updatedAt: new Date().toISOString()
    }, dbName);

    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      try {
        const res = await nativePlugin.connectDevice({
          deviceId: dev.id,
          family: dev.family
        });
        const nextState = res?.connectionState || 'connected';
        const updated = {
          ...dev,
          connectionState: nextState,
          batteryLevel: res?.batteryLevel ?? dev.batteryLevel,
          firmwareVersion: res?.firmwareVersion ?? dev.firmwareVersion,
          lastConnectedAt: nextState === 'connected' ? new Date().toISOString() : dev.lastConnectedAt,
          lastError: res?.lastError || null,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
        return updated;
      } catch (err) {
        const errMsg = err?.message || 'فشل الاتصال بالسوار عبر Bluetooth LE';
        const failed = {
          ...dev,
          connectionState: 'connection_failed',
          lastError: errMsg,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, failed, dbName);
        throw new Error(errMsg);
      }
    }

    // التحقق من وجود جلسة Web Bluetooth حقيقية مختارة من المستخدم
    const webSession = activeWebBleConnections.get(deviceId);
    if (webSession && webSession.btDevice && webSession.btDevice.gatt) {
      try {
        const server = await webSession.btDevice.gatt.connect();
        webSession.gattServer = server;

        let batteryVal = null;
        try {
          const battService = await server.getPrimaryService('0000180f-0000-1000-8000-00805f9b34fb');
          const battChar = await battService.getCharacteristic('00002a19-0000-1000-8000-00805f9b34fb');
          const dv = await battChar.readValue();
          batteryVal = dv.getUint8(0);
        } catch {
          // قد لا يوفر السوار قراءة البطارية القياسية قبل إتمام المصادقة المشفرة
        }

        const nowIso = new Date().toISOString();
        const updated = {
          ...dev,
          connectionState: 'connected',
          batteryLevel: batteryVal,
          lastConnectedAt: nowIso,
          lastError: null,
          updatedAt: nowIso
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);

        webSession.btDevice.addEventListener('gattserverdisconnected', async () => {
          const latest = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
          if (latest) {
            await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
              ...latest,
              connectionState: 'disconnected',
              updatedAt: new Date().toISOString()
            }, dbName);
          }
        });

        return updated;
      } catch (err) {
        const failed = {
          ...dev,
          connectionState: 'connection_failed',
          lastError: `فشل اتصال GATT الحقيقي بالسوار: ${err.message || err}`,
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, failed, dbName);
        throw new Error(failed.lastError);
      }
    }

    // لا يوجد اتصال GATT حقيقي -> نضع الحالة «فشل الاتصال» بصدق تام ولا ندّعي الاتصال أبدًا!
    const honestReason = 'لم يتم الاتصال الفعلي بالسوار: أنت تفتح التطبيق حاليًا داخل نافذة معاينة ويب معزولة لا تملك صلاحية الوصول إلى بلوتوث الهاتف. لإجراء اتصال حقيقي، افتح الملف في متصفح Google Chrome الخارجي أو ثبّت حزمة Android APK.';
    const failed = {
      ...dev,
      connectionState: 'connection_failed',
      batteryLevel: null,
      lastError: honestReason,
      updatedAt: new Date().toISOString()
    };
    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, failed, dbName);
    const errObj = new Error(honestReason);
    errObj.code = 'NO_REAL_GATT_AVAILABLE';
    throw errObj;
  },

  /**
   * 3. disconnectDevice(deviceId) — قطع الاتصال بالسوار
   */
  async disconnectDevice(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز غير موجود.');

    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      await nativePlugin.disconnectDevice({ deviceId });
    }

    const webSession = activeWebBleConnections.get(deviceId);
    if (webSession?.btDevice?.gatt?.connected) {
      webSession.btDevice.gatt.disconnect();
    }

    const updated = {
      ...dev,
      connectionState: 'disconnected',
      updatedAt: new Date().toISOString()
    };
    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, updated, dbName);
    return updated;
  },

  /**
   * 4. getDeviceStatus(deviceId)
   */
  async getDeviceStatus(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) return null;
    const profile = DEVICE_CAPABILITY_PROFILES[dev.family] || null;
    return {
      ...dev,
      capabilityProfile: profile
    };
  },

  /**
   * إزالة الجهاز من قائمة الأجهزة المحفوظة
   */
  async removeSavedDevice(deviceId, dbName = DB_NAME) {
    try {
      await this.disconnectDevice(deviceId, dbName);
    } catch {
      // ignore
    }
    activeWebBleConnections.delete(deviceId);
    return deleteRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
  },

  /**
   * 5. syncDeviceData(deviceId) — يزامن فقط إذا كان السوار متصلًا فعليًا عبر GATT أو الإضافة الأصلية
   */
  async syncDeviceData(deviceId, dbName = DB_NAME) {
    const dev = await getRecord(STORE_NAMES.WEARABLE_DEVICES, deviceId, dbName);
    if (!dev) throw new Error('الجهاز غير موجود.');

    const nativePlugin = getNativeHealthPlugin();
    const webSession = activeWebBleConnections.get(deviceId);
    const hasRealConnection = Boolean(nativePlugin && dev.connectionState === 'connected') ||
      Boolean(webSession?.gattServer?.connected);

    if (!hasRealConnection) {
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
        ...dev,
        connectionState: 'disconnected',
        batteryLevel: null,
        lastError: 'السوار غير متصل فعليًا عبر Bluetooth GATT.',
        updatedAt: new Date().toISOString()
      }, dbName);
      throw new Error(`السوار «${dev.name}» غير متصل فعليًا عبر البلوتوث. لا يمكن إجراء مزامنة وهمية.`);
    }

    await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
      ...dev,
      connectionState: 'syncing',
      updatedAt: new Date().toISOString()
    }, dbName);

    try {
      const recordsToIngest = [];
      if (webSession?.gattServer?.connected) {
        try {
          const battService = await webSession.gattServer.getPrimaryService('0000180f-0000-1000-8000-00805f9b34fb');
          const battChar = await battService.getCharacteristic('00002a19-0000-1000-8000-00805f9b34fb');
          const dv = await battChar.readValue();
          const batt = dv.getUint8(0);
          dev.batteryLevel = batt;
          recordsToIngest.push({
            metricType: 'battery',
            value: batt,
            unit: '%',
            sourceType: dev.family === 'honor_band_4' ? 'honor_band_4_ble' : 'xiaomi_band_10_ble',
            deviceModel: dev.name,
            deviceId: dev.id
          });
        } catch {
          // ignore if battery service restricted
        }
      }

      const ingestStats = recordsToIngest.length > 0
        ? await HealthNormalizer.ingestHealthRecords(recordsToIngest, {}, dbName)
        : { insertedCount: 0, updatedCount: 0, suppressedDuplicatesCount: 0, totalRecords: 0 };

      const nowIso = new Date().toISOString();
      const afterSync = {
        ...dev,
        connectionState: 'connected',
        lastSyncedAt: nowIso,
        updatedAt: nowIso
      };
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, afterSync, dbName);
      await patchHealthSyncState({
        lastSuccessfulSyncAt: nowIso,
        lastAttemptedSyncAt: nowIso,
        lastSyncStatus: 'succeeded',
        lastSyncError: null
      }, dbName);
      return { device: afterSync, ingestStats };
    } catch (err) {
      await updateRecord(STORE_NAMES.WEARABLE_DEVICES, {
        ...dev,
        connectionState: 'connected',
        lastError: err.message,
        updatedAt: new Date().toISOString()
      }, dbName);
      throw err;
    }
  },

  /**
   * 6. connectHealthConnect() — يتحقق بصدق من وجود HealthConnectClient الأصلي في Android APK
   * لا يكتب «مرتبط ومفعّل ✓» أبدًا إذا كان التطبيق يعمل داخل متصفح أو نافذة معاينة!
   */
  async connectHealthConnect(dbName = DB_NAME) {
    const nativePlugin = getNativeHealthPlugin();
    if (!nativePlugin) {
      const honestMsg = 'لم يتم الربط مع Health Connect لأنك تشغّل التطبيق حاليًا كملف ويب داخل نافذة المعاينة، وخدمة Android Health Connect (androidx.health.connect.client) لا تقبل الاتصال إلا من تطبيق Android APK مثبّت على النظام.';
      const state = await patchHealthSyncState({
        environmentType: 'web_browser_or_webview',
        healthConnectSdkStatus: 'requires_native_android_apk',
        healthConnectLinked: false,
        grantedPermissions: [],
        lastSyncStatus: 'failed',
        lastSyncError: honestMsg
      }, dbName);
      return state;
    }

    const res = await nativePlugin.connectHealthConnect();
    const granted = Array.isArray(res?.grantedPermissions) ? res.grantedPermissions : [];
    const linked = res?.sdkStatus === 'available' && granted.length > 0;
    return patchHealthSyncState({
      environmentType: 'capacitor_android_native',
      healthConnectSdkStatus: res?.sdkStatus || 'unavailable',
      healthConnectLinked: linked,
      grantedPermissions: granted,
      lastSyncError: linked ? null : 'يرجى منح صلاحيات القراءة في نافذة Health Connect الأصلية.'
    }, dbName);
  },

  /**
   * 7. requestHealthPermissions()
   */
  async requestHealthPermissions(requestedPermissions = [], dbName = DB_NAME) {
    const syncState = await getOrInitHealthSyncState(dbName);
    if (!syncState.consentGranted) {
      throw new Error('تم إلغاء موافقة الخصوصية الصحية. يرجى تفعيل الموافقة أولًا.');
    }

    const nativePlugin = getNativeHealthPlugin();
    if (!nativePlugin) {
      throw new Error('لا يمكن فتح نافذة صلاحيات Android Health Connect الأصلية من داخل متصفح الويب أو شاشة المعاينة؛ يتطلب ذلك تثبيت التطبيق كحزمة Android APK.');
    }

    const res = await nativePlugin.connectHealthConnect();
    const granted = Array.isArray(res?.grantedPermissions) ? res.grantedPermissions : requestedPermissions;
    return patchHealthSyncState({
      healthConnectLinked: granted.length > 0,
      grantedPermissions: granted
    }, dbName);
  },

  /**
   * 8. readHealthData(dateRange) — يقرأ فقط البيانات الحقيقية من HealthConnectClient الأصلي دون مسح البيانات السابقة عند الفشل
   */
  async readHealthData(dateRange = {}, dbName = DB_NAME) {
    const syncState = await getOrInitHealthSyncState(dbName);
    const attemptIso = new Date().toISOString();

    await patchHealthSyncState({
      lastAttemptedSyncAt: attemptIso,
      lastSyncStatus: 'syncing',
      lastSyncProgressPct: 25,
      lastSyncError: null
    }, dbName);

    const nativePlugin = getNativeHealthPlugin();
    if (!nativePlugin) {
      const errMsg = 'تعذرت المزامنة مع Health Connect: التطبيق يعمل حاليًا في وضع معاينة الويب (بدون إضافة Kotlin الأصلية)، لذلك لم يتم جلب أي قراءات وهمية ولم يتم مسح أي بيانات محلية سابقة.';
      await patchHealthSyncState({
        healthConnectLinked: false,
        lastAttemptedSyncAt: attemptIso,
        lastSyncStatus: 'failed',
        lastSyncProgressPct: null,
        lastSyncError: errMsg
      }, dbName);
      const errObj = new Error(errMsg);
      errObj.code = 'HC_REQUIRES_NATIVE_APK';
      throw errObj;
    }

    try {
      const startTime = dateRange.startTime || new Date(Date.now() - 7 * 86400000).toISOString();
      const endTime = dateRange.endTime || new Date().toISOString();

      await patchHealthSyncState({ lastSyncProgressPct: 60 }, dbName);
      const hcPayload = await nativePlugin.readHealthData({ startTime, endTime });
      const rawRecords = Array.isArray(hcPayload?.records) ? hcPayload.records : [];

      const ingestStats = await HealthNormalizer.ingestHealthRecords(rawRecords, {
        clockDriftOffsetMs: syncState.clockDriftOffsetMs || 0
      }, dbName);

      const doneIso = new Date().toISOString();
      const updatedState = await patchHealthSyncState({
        lastSuccessfulSyncAt: doneIso,
        lastAttemptedSyncAt: attemptIso,
        lastSyncStatus: 'succeeded',
        lastSyncProgressPct: 100,
        lastSyncError: null,
        googleFitSourceDetected: Boolean(hcPayload?.googleFitDetected),
        sourcesDetected: Array.isArray(hcPayload?.sourcesDetected) ? hcPayload.sourcesDetected : []
      }, dbName);

      return {
        syncState: updatedState,
        ingestStats
      };
    } catch (err) {
      await patchHealthSyncState({
        lastAttemptedSyncAt: attemptIso,
        lastSyncStatus: 'failed',
        lastSyncProgressPct: null,
        lastSyncError: err.message || 'تعذرت مزامنة البيانات من Health Connect'
      }, dbName);
      throw err;
    }
  },

  /**
   * 9. getSyncStatus() — يتحقق من مصداقية حالة الأجهزة ولا يظهر أي اتصال مزيف
   */
  async getSyncStatus(dbName = DB_NAME) {
    const [syncState, rawDevices, allRecords] = await Promise.all([
      getOrInitHealthSyncState(dbName),
      getAllRecords(STORE_NAMES.WEARABLE_DEVICES, dbName),
      getAllRecords(STORE_NAMES.HEALTH_RECORDS, dbName)
    ]);

    const nativePlugin = getNativeHealthPlugin();
    // تنظيف تلقائي لأي أجهزة أو قراءات محاكاة سابقة في حال عدم وجود إضافة أصلية
    const SIMULATED_IDS_PREFIX = /^(miband10_|hb4_|gfit_|phone_overlap_|batt_ble_)/;
    const filteredRecords = [];
    for (const r of allRecords) {
      if (!nativePlugin && r.sourceRecordId && SIMULATED_IDS_PREFIX.test(r.sourceRecordId)) {
        await deleteRecord(STORE_NAMES.HEALTH_RECORDS, r.id, dbName);
      } else {
        filteredRecords.push(r);
      }
    }
    const devices = [];
    for (const d of rawDevices) {
      if (!nativePlugin && (d.id === 'ble_xiaomi_band_10' || d.id === 'ble_honor_band_4' || d.bridgeMode === 'webview_companion_bridge')) {
        await deleteRecord(STORE_NAMES.WEARABLE_DEVICES, d.id, dbName);
        continue;
      }
      if (!nativePlugin && !activeWebBleConnections.has(d.id) && d.connectionState === 'connected') {
        const cleaned = {
          ...d,
          connectionState: 'disconnected',
          batteryLevel: null,
          lastError: 'غير متصل فعليًا (يتطلب اتصال Bluetooth GATT حقيقي)',
          updatedAt: new Date().toISOString()
        };
        await updateRecord(STORE_NAMES.WEARABLE_DEVICES, cleaned, dbName);
        devices.push(cleaned);
      } else {
        devices.push(d);
      }
    }

    const connectedDevice = devices.find(d => d.connectionState === 'connected' || d.connectionState === 'syncing') || null;
    const primaryDevice = connectedDevice || devices[0] || null;

    const distinctSources = Array.from(new Set(filteredRecords.map(r => r.sourceNameAr).filter(Boolean)));
    const hasGoogleFitRecords = filteredRecords.some(
      r => r.sourceType === 'google_fit_hc' || r.sourcePackage === 'com.google.android.apps.fitness'
    );

    return {
      ...syncState,
      isNativeAndroid: this.isNativeAndroidAvailable(),
      isWebBluetoothSupported: this.isWebBluetoothAvailable(),
      diagnostics: diagnoseRuntimeCapabilities(),
      devices,
      connectedDevice,
      primaryDevice,
      totalHealthRecords: filteredRecords.length,
      distinctSources,
      hasGoogleFitRecords: Boolean(syncState.googleFitSourceDetected || hasGoogleFitRecords),
      pedometerMetrics: PhoneSensorPedometer.getMetrics()
    };
  },

  async configureBackgroundSync(enabled, dbName = DB_NAME) {
    const syncState = await getOrInitHealthSyncState(dbName);
    const effective = Boolean(enabled && syncState.consentGranted && this.isNativeAndroidAvailable());
    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      await nativePlugin.configureBackgroundSync({
        enabled: effective,
        consentGranted: syncState.consentGranted
      });
    }
    return patchHealthSyncState({
      backgroundSyncEnabled: effective
    }, dbName);
  },

  async revokeConsentAndClearHealthData(dbName = DB_NAME) {
    const nativePlugin = getNativeHealthPlugin();
    if (nativePlugin) {
      try {
        await nativePlugin.revokeHealthConsent();
      } catch {
        // ignore
      }
    }
    PhoneSensorPedometer.stop();
    await clearStore(STORE_NAMES.HEALTH_RECORDS, dbName);
    await clearStore(STORE_NAMES.WEARABLE_DEVICES, dbName);
    await patchHealthSyncState({
      healthConnectLinked: false,
      grantedPermissions: [],
      googleFitSourceDetected: false,
      sourcesDetected: [],
      lastSuccessfulSyncAt: null,
      lastSyncStatus: 'idle',
      lastSyncProgressPct: null,
      lastSyncError: null,
      backgroundSyncEnabled: false,
      consentGranted: false
    }, dbName);
    return true;
  }
};

/**
 * حساب بداية اليوم ونهايته بالتوقيت المحلي الصحيح مع إزاحة المنطقة الزمنية (المرحلة السادسة)
 */
function getLocalDayBounds(dateInput = new Date()) {
  let year, month, day;
  if (typeof dateInput === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateInput.trim())) {
    [year, month, day] = dateInput.trim().split('-').map(Number);
  } else {
    const d = dateInput instanceof Date ? dateInput : new Date(dateInput);
    year = d.getFullYear();
    month = d.getMonth() + 1;
    day = d.getDate();
  }

  const startLocal = new Date(year, month - 1, day, 0, 0, 0, 0);
  const endLocal = new Date(year, month - 1, day, 23, 59, 59, 999);
  const tzOffsetMin = -startLocal.getTimezoneOffset();
  const sign = tzOffsetMin >= 0 ? '+' : '-';
  const absMin = Math.abs(tzOffsetMin);
  const pad2 = (n) => String(Math.floor(n)).padStart(2, '0');
  const zoneOffset = `${sign}${pad2(absMin / 60)}:${pad2(absMin % 60)}`;
  const localDateStr = `${year}-${pad2(month)}-${pad2(day)}`;

  return {
    localDate: localDateStr,
    startTime: startLocal,
    endTime: endLocal,
    startIso: startLocal.toISOString(),
    endIso: endLocal.toISOString(),
    zoneOffset,
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || zoneOffset
  };
}
