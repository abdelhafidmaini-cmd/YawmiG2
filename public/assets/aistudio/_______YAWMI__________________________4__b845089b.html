/* === css/variables.css — Royal Midnight Navy, Electric Cyan & Warm Gold Palette (Matching App Logo) === */
:root {
  /* Brand Colors */
  --color-primary: #2563EB;
  --color-primary-dark: #1D4ED8;
  --color-primary-light: #3B82F6;
  --color-primary-soft: rgba(37, 99, 235, 0.12);
  --color-accent: #0EA5E9;
  --color-gold: #F59E0B;
  --color-gold-soft: rgba(245, 158, 11, 0.16);

  /* Light Mode Surfaces — Clean Slate & Crisp Pearl */
  --bg-app: #F1F5F9;
  --bg-surface: #FFFFFF;
  --bg-surface-elevated: #FFFFFF;
  --bg-surface-muted: #F8FAFC;
  --bg-hero: linear-gradient(135deg, #0F172A 0%, #1E293B 55%, #1E3A8A 100%);
  --bg-hero-solid: #0F172A;
  --bg-hero-card: rgba(255, 255, 255, 0.10);
  --border-hero-card: rgba(255, 255, 255, 0.16);

  /* Text Colors */
  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #64748B;
  --text-on-primary: #FFFFFF;
  --text-on-hero: #F8FAFC;
  --text-on-hero-muted: #CBD5E1;

  /* Borders & Dividers */
  --border-color: #E2E8F0;
  --border-strong: #CBD5E1;

  /* Semantic Status Colors */
  --color-success: #10B981;
  --color-success-bg: rgba(16, 185, 129, 0.12);
  --color-warning: #F59E0B;
  --color-warning-bg: rgba(245, 158, 11, 0.14);
  --color-danger: #EF4444;
  --color-danger-bg: rgba(239, 68, 68, 0.12);
  --color-info: #3B82F6;
  --color-info-bg: rgba(59, 130, 246, 0.12);

  /* Priority Colors */
  --prio-low: #64748B;
  --prio-medium: #3B82F6;
  --prio-high: #F59E0B;
  --prio-urgent: #EF4444;

  /* Spacing & Radius */
  --radius-xs: 10px;
  --radius-sm: 14px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 30px;
  --radius-full: 9999px;

  /* Shadows */
  --shadow-xs: 0 2px 8px rgba(15, 23, 42, 0.04);
  --shadow-sm: 0 6px 18px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 12px 32px rgba(15, 23, 42, 0.10);
  --shadow-lg: 0 24px 48px rgba(15, 23, 42, 0.22);
  --shadow-glow: 0 8px 24px rgba(37, 99, 235, 0.28);

  /* Safe Areas */
  --safe-top: env(safe-area-inset-top, 10px);
  --safe-bottom: env(safe-area-inset-bottom, 10px);
  --nav-height: 72px;

  /* Typography */
  --font-sans: 'Cairo', 'Tajawal', 'Noto Sans Arabic', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 240ms cubic-bezier(0.16, 1, 0.3, 1);
}

/* === css/dark.css — Deep Midnight Navy & Neon Accents === */
[data-theme="dark"] {
  --color-primary: #3B82F6;
  --color-primary-dark: #2563EB;
  --color-primary-light: #60A5FA;
  --color-primary-soft: rgba(59, 130, 246, 0.16);
  --color-accent: #38BDF8;
  --color-gold: #FBBF24;
  --color-gold-soft: rgba(251, 191, 36, 0.16);

  --bg-app: #070B14;
  --bg-surface: #0F172A;
  --bg-surface-elevated: #162038;
  --bg-surface-muted: #1E293B;
  --bg-hero: linear-gradient(135deg, #0F172A 0%, #172554 52%, #1E1B4B 100%);
  --bg-hero-solid: #0F172A;
  --bg-hero-card: rgba(255, 255, 255, 0.07);
  --border-hero-card: rgba(56, 189, 248, 0.18);

  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-muted: #64748B;
  --text-on-primary: #FFFFFF;
  --text-on-hero: #F8FAFC;
  --text-on-hero-muted: #93C5FD;

  --border-color: rgba(148, 163, 184, 0.12);
  --border-strong: rgba(148, 163, 184, 0.22);

  --color-success: #34D399;
  --color-success-bg: rgba(52, 211, 153, 0.15);
  --color-warning: #FBBF24;
  --color-warning-bg: rgba(251, 191, 36, 0.15);
  --color-danger: #F87171;
  --color-danger-bg: rgba(248, 113, 113, 0.15);
  --color-info: #60A5FA;
  --color-info-bg: rgba(96, 165, 250, 0.15);

  --shadow-xs: 0 2px 10px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.42);
  --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.55);
  --shadow-glow: 0 8px 26px rgba(56, 189, 248, 0.22);
}

/* === css/reset.css === */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.55;
  color: var(--text-primary);
  background-color: var(--bg-app);
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--bg-app);
  background-image:
    radial-gradient(circle at 12% 8%, rgba(56, 189, 248, 0.08), transparent 36%),
    radial-gradient(circle at 88% 18%, rgba(251, 191, 36, 0.06), transparent 34%),
    radial-gradient(circle at 50% 90%, rgba(59, 130, 246, 0.07), transparent 40%);
  background-attachment: fixed;
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background-color var(--transition-normal), color var(--transition-normal);
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  background: none;
  border: none;
  outline: none;
}

button {
  cursor: pointer;
  user-select: none;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

ul, ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

/* === css/layout.css === */
.app-shell {
  max-width: 600px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: var(--safe-top);
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 28px);
  position: relative;
}

.app-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px 10px;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(15, 23, 42, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
}

[data-theme="light"] .app-topbar {
  background: rgba(255, 255, 255, 0.85);
}

.brand-bar {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: radial-gradient(circle at center, #111C38, #070B14);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--color-gold);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), 0 0 0 2px rgba(251, 191, 36, 0.35);
  overflow: hidden;
  padding: 0;
  flex-shrink: 0;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.brand-logo:hover {
  transform: scale(1.04);
  box-shadow: 0 6px 18px rgba(56, 189, 248, 0.35), 0 0 0 2px var(--color-gold);
}

.brand-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  border-radius: 50%;
}

.brand-title {
  font-size: 1.15rem;
  font-weight: 900;
  letter-spacing: -0.01em;
  line-height: 1.2;
  background: linear-gradient(135deg, var(--text-primary) 20%, var(--color-accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.brand-subtitle {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--text-secondary);
  display: block;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.main-view {
  flex: 1;
  padding: 14px 16px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  animation: fadeInView 220ms cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes fadeInView {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Floating Glassmorphic Bottom Navigation Bar */
.bottom-nav-wrap {
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  z-index: 50;
  padding: 0 12px calc(var(--safe-bottom) + 8px);
  pointer-events: none;
}

.bottom-nav {
  pointer-events: auto;
  max-width: 560px;
  margin: 0 auto;
  height: var(--nav-height);
  background: rgba(15, 23, 42, 0.90);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(148, 163, 184, 0.18);
  border-radius: 24px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  padding: 6px 8px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
}

[data-theme="light"] .bottom-nav {
  background: rgba(255, 255, 255, 0.92);
  border-color: rgba(203, 213, 225, 0.85);
  box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
}

.health-fab-btn {
  width: 46px;
  height: 46px;
  border-radius: 16px;
  background: linear-gradient(135deg, #3B82F6 0%, #0EA5E9 100%);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(14, 165, 233, 0.38);
  border: 1px solid rgba(255, 255, 255, 0.24);
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
  flex-shrink: 0;
}

.health-fab-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(14, 165, 233, 0.50);
}

.health-fab-btn:active {
  transform: scale(0.94);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 58px;
  border-radius: 16px;
  color: var(--text-secondary);
  font-size: 0.74rem;
  font-weight: 700;
  position: relative;
  transition: all var(--transition-fast);
}

.nav-item:hover {
  color: var(--text-primary);
  background: rgba(148, 163, 184, 0.08);
}

.nav-item.active {
  color: #FFFFFF;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.28), rgba(14, 165, 233, 0.18));
  border: 1px solid rgba(56, 189, 248, 0.32);
  box-shadow: 0 4px 14px rgba(14, 165, 233, 0.18);
}

[data-theme="light"] .nav-item.active {
  color: var(--color-primary-dark);
  background: rgba(37, 99, 235, 0.12);
  border-color: rgba(37, 99, 235, 0.25);
}

.nav-item.active svg {
  color: var(--color-accent);
  transform: translateY(-1px);
}

[data-theme="light"] .nav-item.active svg {
  color: var(--color-primary);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  transition: transform var(--transition-fast);
}

/* === css/components.css === */
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-xs);
  transition: all var(--transition-fast);
}

.icon-btn:hover, .icon-btn:focus-visible {
  color: var(--color-accent);
  border-color: var(--color-accent);
  background: var(--bg-surface-muted);
  transform: translateY(-1px);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 800;
  font-size: 0.88rem;
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
  color: #FFFFFF;
  box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
  border: 1px solid rgba(255, 255, 255, 0.16);
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 22px rgba(37, 99, 235, 0.38);
  filter: brightness(1.06);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: var(--bg-surface-muted);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
}

.btn-secondary:hover {
  border-color: var(--color-accent);
  background: var(--bg-surface-elevated);
}

.btn-danger {
  background: var(--color-danger-bg);
  color: var(--color-danger);
  border: 1px solid rgba(239, 68, 68, 0.3);
}

.btn-danger:hover {
  background: rgba(239, 68, 68, 0.2);
}

.btn-sm {
  padding: 7px 13px;
  font-size: 0.8rem;
  border-radius: var(--radius-xs);
}

.btn-block {
  width: 100%;
}

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-xs);
  transition: border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
}

.card-interactive {
  cursor: pointer;
}

.card-interactive:hover {
  border-color: rgba(56, 189, 248, 0.45);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-link {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--color-accent);
  padding: 5px 10px;
  border-radius: var(--radius-xs);
  background: var(--color-primary-soft);
  transition: all var(--transition-fast);
}

.section-link:hover {
  background: var(--color-primary);
  color: #FFFFFF;
}

/* Segmented Tabs */
.segmented-tabs {
  display: flex;
  background: var(--bg-surface-muted);
  padding: 5px;
  border-radius: 16px;
  border: 1px solid var(--border-color);
  gap: 5px;
  overflow-x: auto;
}

.seg-tab {
  flex: 1;
  min-width: max-content;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 0.84rem;
  font-weight: 800;
  color: var(--text-secondary);
  text-align: center;
  transition: all var(--transition-fast);
}

.seg-tab:hover {
  color: var(--text-primary);
}

.seg-tab.active {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
  color: #FFFFFF;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

/* Filter Pills */
.filter-pills {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.filter-pills::-webkit-scrollbar {
  display: none;
}

.pill {
  padding: 7px 14px;
  border-radius: var(--radius-full);
  font-size: 0.78rem;
  font-weight: 800;
  background: var(--bg-surface-muted);
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  white-space: nowrap;
  transition: all var(--transition-fast);
}

.pill:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
}

.pill.active {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
  color: #FFFFFF;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

.badge-urgent { background: var(--color-danger-bg); color: var(--color-danger); border: 1px solid rgba(248, 113, 113, 0.25); }
.badge-high { background: var(--color-warning-bg); color: var(--color-warning); border: 1px solid rgba(251, 191, 36, 0.25); }
.badge-medium { background: var(--color-info-bg); color: var(--color-info); border: 1px solid rgba(96, 165, 250, 0.25); }
.badge-low { background: var(--bg-surface-muted); color: var(--text-secondary); border: 1px solid var(--border-color); }
.badge-success { background: var(--color-success-bg); color: var(--color-success); border: 1px solid rgba(52, 211, 153, 0.25); }
.badge.gold { background: var(--color-gold-soft); color: var(--color-gold); border: 1px solid rgba(251, 191, 36, 0.35); }

/* Empty State */
.empty-state {
  text-align: center;
  padding: 32px 18px;
  background: var(--bg-surface);
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  color: var(--text-secondary);
}

.empty-state-icon {
  width: 54px;
  height: 54px;
  border-radius: 18px;
  background: var(--color-primary-soft);
  color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
  box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.2);
}

.empty-state-title {
  font-size: 1rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.empty-state-desc {
  font-size: 0.83rem;
  color: var(--text-muted);
  margin-bottom: 16px;
  max-width: 340px;
  margin-inline: auto;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  top: calc(var(--safe-top) + 14px);
  inset-inline: 16px;
  max-width: 500px;
  margin: 0 auto;
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  border-radius: 16px;
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-md);
  font-size: 0.85rem;
  font-weight: 700;
  animation: slideDownToast 220ms cubic-bezier(0.16, 1, 0.3, 1);
}

.toast-success { border-inline-start: 4px solid var(--color-success); }
.toast-error { border-inline-start: 4px solid var(--color-danger); }
.toast-warning { border-inline-start: 4px solid var(--color-warning); }
.toast-info { border-inline-start: 4px solid var(--color-info); }

@keyframes slideDownToast {
  from { opacity: 0; transform: translateY(-12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* === css/dashboard.css === */
.hero-dashboard {
  background: var(--bg-hero);
  color: var(--text-on-hero);
  border-radius: var(--radius-xl);
  padding: 22px 20px 20px;
  box-shadow: 0 18px 40px rgba(7, 11, 20, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(56, 189, 248, 0.22);
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  overflow: hidden;
}

.hero-dashboard::before {
  content: '';
  position: absolute;
  top: -60px;
  left: -60px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(56, 189, 248, 0.22), transparent 70%);
  pointer-events: none;
}

.hero-dashboard::after {
  content: '';
  position: absolute;
  bottom: -50px;
  right: -50px;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(251, 191, 36, 0.16), transparent 70%);
  pointer-events: none;
}

.hero-top-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  position: relative;
  z-index: 1;
}

.hero-date-text {
  font-size: 0.82rem;
  color: var(--text-on-hero-muted);
  font-weight: 700;
  margin-bottom: 4px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.hero-greeting {
  font-size: 1.5rem;
  font-weight: 900;
  color: #FFFFFF;
  line-height: 1.25;
}

.hero-customize-btn {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.10);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255, 255, 255, 0.18);
  transition: all var(--transition-fast);
}

.hero-customize-btn:hover {
  background: rgba(255, 255, 255, 0.20);
  transform: rotate(12deg);
}

.hero-progress-box {
  background: rgba(15, 23, 42, 0.52);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-hero-card);
  border-radius: var(--radius-md);
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.hero-progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hero-progress-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.94rem;
  font-weight: 800;
  color: #FFFFFF;
}

.hero-progress-pct {
  font-size: 1.45rem;
  font-weight: 900;
  color: var(--color-gold);
  direction: ltr;
}

.hero-progress-track {
  width: 100%;
  height: 9px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-full);
  overflow: hidden;
}

.hero-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #38BDF8 0%, #FBBF24 100%);
  border-radius: var(--radius-full);
  transition: width 360ms cubic-bezier(0.16, 1, 0.3, 1);
}

.hero-progress-sub {
  font-size: 0.79rem;
  color: var(--text-on-hero-muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 600;
}

.hero-metrics-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  position: relative;
  z-index: 1;
}

.hero-metric-card {
  background: rgba(15, 23, 42, 0.48);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-hero-card);
  border-radius: var(--radius-md);
  padding: 13px 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.hero-metric-card:hover {
  background: rgba(56, 189, 248, 0.16);
  border-color: rgba(56, 189, 248, 0.45);
  transform: translateY(-2px);
}

.hero-metric-icon {
  color: var(--color-accent);
  display: flex;
  justify-content: flex-start;
}

.hero-metric-val {
  font-size: 1.25rem;
  font-weight: 900;
  color: #FFFFFF;
  line-height: 1.2;
}

.hero-metric-label {
  font-size: 0.73rem;
  color: var(--text-on-hero-muted);
  font-weight: 700;
}

/* Quick Launch Action Strip on Dashboard */
.quick-launch-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.quick-launch-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 0.76rem;
  font-weight: 800;
  color: var(--text-primary);
  box-shadow: var(--shadow-xs);
  transition: all var(--transition-fast);
}

.quick-launch-btn:hover {
  border-color: var(--color-accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.quick-launch-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
}

/* Task & Item Rows */
.item-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.task-row-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--shadow-xs);
  transition: all var(--transition-fast);
}

.task-row-card:hover {
  border-color: rgba(56, 189, 248, 0.4);
  transform: translateY(-1px);
}

.task-row-card.completed {
  opacity: 0.62;
  background: var(--bg-surface-muted);
}

.task-row-card.completed .task-row-title {
  text-decoration: line-through;
  color: var(--text-muted);
}

.task-check-btn {
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 2px solid var(--border-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: transparent;
  transition: all var(--transition-fast);
}

.task-check-btn:hover {
  border-color: var(--color-accent);
}

.task-check-btn.checked {
  background: linear-gradient(135deg, var(--color-success), #059669);
  border-color: transparent;
  color: #FFFFFF;
  box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
}

.task-row-body {
  flex: 1;
  min-width: 0;
  cursor: pointer;
}

.task-row-title {
  font-size: 0.96rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 3px;
  word-break: break-word;
}

.task-row-meta {
  font-size: 0.77rem;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-urgent { background: var(--prio-urgent); box-shadow: 0 0 10px rgba(239, 68, 68, 0.65); }
.dot-high { background: var(--prio-high); box-shadow: 0 0 8px rgba(245, 158, 11, 0.45); }
.dot-medium { background: var(--prio-medium); }
.dot-low { background: var(--prio-low); }

/* Settings / More Grouped Rows */
.settings-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.settings-group-title {
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--color-accent);
  padding-inline: 4px;
}

.settings-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-xs);
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 16px;
  width: 100%;
  text-align: start;
  border-bottom: 1px solid var(--border-color);
  transition: background var(--transition-fast);
}

.settings-row:last-child {
  border-bottom: none;
}

.settings-row:hover {
  background: var(--bg-surface-muted);
}

.settings-row-start {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.settings-row-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--color-primary-soft);
  color: var(--color-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(56, 189, 248, 0.2);
}

[data-theme="light"] .settings-row-icon {
  color: var(--color-primary);
}

.settings-row-label {
  font-size: 0.94rem;
  font-weight: 800;
  color: var(--text-primary);
}

.settings-row-sub {
  font-size: 0.76rem;
  color: var(--text-secondary);
  display: block;
  margin-top: 2px;
}

/* === css/forms.css === */
.form-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.form-row-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 0.8rem;
  font-weight: 800;
  color: var(--text-secondary);
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-muted);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-size: 0.9rem;
  font-weight: 600;
  transition: border-color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--color-accent);
  background: var(--bg-surface);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
}

.form-textarea {
  min-height: 86px;
  resize: vertical;
}

.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-surface-muted);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 9px 13px;
  transition: border-color var(--transition-fast);
}

.search-bar:focus-within {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
}

.search-bar input {
  flex: 1;
  background: transparent;
  font-size: 0.9rem;
  color: var(--text-primary);
}

.weekday-picker {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.day-chip {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: var(--bg-surface-muted);
  font-size: 0.76rem;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
}

.day-chip.selected {
  background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
  color: #FFFFFF;
  border-color: transparent;
  box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
}

/* === css/modals.css === */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(4, 9, 20, 0.72);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
  animation: fadeBackdrop 180ms ease-out;
}

@media (min-width: 540px) {
  .modal-backdrop {
    align-items: center;
    padding: 18px;
  }
}

.modal-sheet {
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  max-height: 90dvh;
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: slideUpModal 220ms cubic-bezier(0.16, 1, 0.3, 1);
}

@media (min-width: 540px) {
  .modal-sheet {
    border-radius: var(--radius-lg);
  }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 13px;
  border-bottom: 1px solid var(--border-color);
  background: var(--bg-surface-muted);
}

.modal-title {
  font-size: 1.05rem;
  font-weight: 900;
  color: var(--text-primary);
}

.modal-body {
  padding: 18px 20px;
  overflow-y: auto;
  flex: 1;
}

.modal-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;

/**
 * YAWMI — IndexedDB Schema Migrations & Upgrade Handler
 */
function applyMigrations(db, oldVersion, newVersion, transaction = null) {
  for (const [storeName, storeDef] of Object.entries(SCHEMA_STORES)) {
    let store;
    if (!db.objectStoreNames.contains(storeName)) {
      store = db.createObjectStore(storeName, { keyPath: storeDef.keyPath });
    } else if (transaction) {
      store = transaction.objectStore(storeName);
    }
    if (store && Array.isArray(storeDef.indexes)) {
      for (const idx of storeDef.indexes) {
        if (!store.indexNames.contains(idx.name)) {
          store.createIndex(idx.name, idx.keyPath, { unique: Boolean(idx.unique) });
        }
      }
    }
  }
  return { from: oldVersion, to: newVersion, storesConfigured: Object.keys(SCHEMA_STORES).length };
}

/**
 * YAWMI — Core IndexedDB Data Layer with Connection Reuse, Promises, and Safe Transactions
 * Includes automatic spec-compliant in-memory engine fallback when running in Node.js CLI tests.

const connections = new Map();
const memoryDatabases = new Map();

function hasNativeIndexedDB() {
  return typeof indexedDB !== 'undefined' && indexedDB !== null;
}

function getMemoryDB(dbName, version) {
  let mem = memoryDatabases.get(dbName);
  if (!mem) {
    mem = {
      name: dbName,
      version: version || DB_VERSION,
      stores: {},
      indexes: {}
    };
    for (const [sName, sDef] of Object.entries(SCHEMA_STORES)) {
      mem.stores[sName] = new Map();
      mem.indexes[sName] = sDef.indexes || [];
    }
    memoryDatabases.set(dbName, mem);
  } else if (version && version > mem.version) {
    mem.version = version;
    for (const [sName, sDef] of Object.entries(SCHEMA_STORES)) {
      if (!mem.stores[sName]) mem.stores[sName] = new Map();
      mem.indexes[sName] = sDef.indexes || [];
    }
  }
  return mem;
}

function validateStoreAndRecord(storeName, record) {
  if (!SCHEMA_STORES[storeName]) {
    throw new Error(`مخزن البيانات غير موجود: ${storeName}`);
  }
  if (!record || typeof record !== 'object') {
    throw new Error('بيانات السجل غير صالحة: يجب أن يكون كائنًا.');
  }
  if (!record.id || typeof record.id !== 'string' || !record.id.trim()) {
    throw new Error('كل سجل يجب أن يحتوي على معرّف فريد (id) صالح.');
  }
}

function checkUniqueConstraintsMemory(mem, storeName, record, isUpdate = false) {
  const storeMap = mem.stores[storeName];
  if (!isUpdate && storeMap.has(record.id)) {
    throw new Error(`تعارض في المعرّف: السجل (${record.id}) موجود مسبقًا في ${storeName}.`);
  }
  const idxDefs = mem.indexes[storeName] || [];
  for (const idx of idxDefs) {
    if (idx.unique) {
      for (const [existingId, existingRec] of storeMap.entries()) {
        if (existingId === record.id) continue;
        if (Array.isArray(idx.keyPath)) {
          const match = idx.keyPath.every(k => existingRec[k] !== undefined && existingRec[k] === record[k]);
          if (match) {
            throw new Error(`سجل مكرر لنفس الفهرس الفريد (${idx.name}) في ${storeName}.`);
          }
        } else if (existingRec[idx.keyPath] !== undefined && existingRec[idx.keyPath] === record[idx.keyPath]) {
          throw new Error(`سجل مكرر لنفس الفهرس الفريد (${idx.name}) في ${storeName}.`);
        }
      }
    }
  }

async function initDatabase(customDbName = DB_NAME, customVersion = DB_VERSION) {
  const cacheKey = `${customDbName}@${customVersion}`;
  if (connections.has(cacheKey)) {
    return connections.get(cacheKey);
  }

  if (!hasNativeIndexedDB()) {
    const mem = getMemoryDB(customDbName, customVersion);
    if (mem.stores.categories.size === 0 && customDbName === DB_NAME) {
      for (const cat of DEFAULT_CATEGORIES) {
        mem.stores.categories.set(cat.id, structuredClone(cat));
      }
    }
    const conn = { isMemory: true, name: customDbName, version: mem.version, mem };
    connections.set(cacheKey, conn);
    return conn;
  }

  const dbPromise = new Promise((resolve, reject) => {
    try {
      const request = indexedDB.open(customDbName, customVersion);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        const tx = event.target.transaction;
        applyMigrations(db, event.oldVersion, event.newVersion || customVersion, tx);
      };

      request.onsuccess = (event) => {
        const db = event.target.result;
        db.onversionchange = () => {
          db.close();
          connections.delete(cacheKey);
        };
        resolve(db);
      };

      request.onerror = () => {
        reject(new Error(`تعذر فتح قاعدة البيانات المحلية: ${request.error?.message || 'Unknown error'}`));
      };

      request.onblocked = () => {
        reject(new Error('قاعدة البيانات محجوبة بواسطة علامة تبويب أخرى مفتوحة.'));
      };
    } catch (err) {
      reject(err);
    }
  });

  const db = await dbPromise;
  connections.set(cacheKey, db);

  if (customDbName === DB_NAME) {
    const existingCats = await getAllRecords('categories', customDbName);
    if (existingCats.length === 0) {
      for (const cat of DEFAULT_CATEGORIES) {
        try {
          await addRecord('categories', cat, customDbName);
        } catch {
          // Ignore if already seeded
        }
      }
    }
  }

}
async function getDatabaseMetadata(customDbName = DB_NAME) {
  const db = await initDatabase(customDbName);
  if (db.isMemory) {
    return {
      name: db.name,
      version: db.version,
      storeNames: Object.keys(SCHEMA_STORES),
      indexes: Object.fromEntries(
        Object.entries(SCHEMA_STORES).map(([k, v]) => [k, v.indexes.map(i => i.name)])
      )
    };
  }
  const storeNames = Array.from(db.objectStoreNames);
  const tx = db.transaction(storeNames, 'readonly');
  const indexes = {};
  for (const s of storeNames) {
    indexes[s] = Array.from(tx.objectStore(s).indexNames);
  }
  return {
    name: db.name,
    version: db.version,
    storeNames,
    indexes
  };
}
async function addRecord(storeName, record, customDbName = DB_NAME) {
  validateStoreAndRecord(storeName, record);
  const db = await initDatabase(customDbName);
  const clone = structuredClone(record);

  if (db.isMemory) {
    checkUniqueConstraintsMemory(db.mem, storeName, clone, false);
    db.mem.stores[storeName].set(clone.id, clone);
    return structuredClone(clone);
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.add(clone);

    tx.oncomplete = () => resolve(structuredClone(clone));
    tx.onerror = () => {
      const errName = tx.error?.name || req.error?.name || '';
      if (errName === 'QuotaExceededError') {
        reject(new Error('امتلأت مساحة التخزين المحلية على الجهاز. يرجى تصدير نسخة احتياطية وتفريغ مساحة.'));
      } else if (errName === 'ConstraintError') {
        reject(new Error('السجل موجود مسبقًا أو يتعارض مع قيد فريد في قاعدة البيانات.'));
      } else {
        reject(new Error(`تعذر حفظ السجل في ${storeName}: ${tx.error?.message || 'خطأ غير معروف'}`));
      }
    };
  });
}
async function updateRecord(storeName, record, customDbName = DB_NAME) {
  validateStoreAndRecord(storeName, record);
  const db = await initDatabase(customDbName);
  const clone = structuredClone(record);

  if (db.isMemory) {
    checkUniqueConstraintsMemory(db.mem, storeName, clone, true);
    db.mem.stores[storeName].set(clone.id, clone);
    return structuredClone(clone);
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    const store = tx.objectStore(storeName);
    store.put(clone);

    tx.oncomplete = () => resolve(structuredClone(clone));
    tx.onerror = () => {
      reject(new Error(`تعذر تحديث السجل في ${storeName}: ${tx.error?.message || 'خطأ غير معروف'}`));
    };
  });
}
async function deleteRecord(storeName, id, customDbName = DB_NAME) {
  if (!SCHEMA_STORES[storeName]) throw new Error(`مخزن غير معروف: ${storeName}`);
  if (!id) throw new Error('معرّف السجل مطلوب للحذف.');
  const db = await initDatabase(customDbName);

  if (db.isMemory) {
    const existed = db.mem.stores[storeName].delete(id);
    return existed;
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    const store = tx.objectStore(storeName);
    store.delete(id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(new Error(`تعذر حذف السجل من ${storeName}`));
  });
}
async function getRecord(storeName, id, customDbName = DB_NAME) {
  if (!SCHEMA_STORES[storeName]) throw new Error(`مخزن غير معروف: ${storeName}`);
  const db = await initDatabase(customDbName);

  if (db.isMemory) {
    const item = db.mem.stores[storeName].get(id);
    return item ? structuredClone(item) : null;
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(new Error(`تعذر قراءة السجل من ${storeName}`));
  });
}
async function getAllRecords(storeName, customDbName = DB_NAME) {
  if (!SCHEMA_STORES[storeName]) throw new Error(`مخزن غير معروف: ${storeName}`);
  const db = await initDatabase(customDbName);

  if (db.isMemory) {
    return Array.from(db.mem.stores[storeName].values()).map(v => structuredClone(v));
  }

  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(new Error(`تعذر جلب السجلات من ${storeName}`));
  });
}
async function queryRecords(storeName, predicateOrFilter = {}, customDbName = DB_NAME) {
  const all = await getAllRecords(storeName, customDbName);
  if (typeof predicateOrFilter === 'function') {
    return all.filter(predicateOrFilter);
  }
  return all.filter(item => {
    for (const [k, v] of Object.entries(predicateOrFilter)) {
      if (v === undefined || v === null || v === '' || v === 'all') continue;
      if (item[k] !== v) return false;
    }
    return true;
  });
}
async function searchRecords(storeName, searchText, fields = ['title', 'description', 'name', 'content', 'notes'], customDbName = DB_NAME) {
  const all = await getAllRecords(storeName, customDbName);
  const q = String(searchText || '').trim().toLowerCase();
  if (!q) return all;
  return all.filter(item => {
    for (const f of fields) {
      const val = item[f];
      if (typeof val === 'string' && val.toLowerCase().includes(q)) return true;
      if (Array.isArray(val) && val.some(entry => String(entry?.text || entry).toLowerCase().includes(q))) return true;
    }
    return false;
  });
}
async function clearStore(storeName, customDbName = DB_NAME) {
  const db = await initDatabase(customDbName);
  if (db.isMemory) {
    db.mem.stores[storeName].clear();
    return true;
  }
  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readwrite');
    tx.objectStore(storeName).clear();
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(new Error(`تعذر مسح مخزن ${storeName}`));
  });
}
async function clearAllUserData(customDbName = DB_NAME) {
  for (const sName of Object.keys(SCHEMA_STORES)) {
    await clearStore(sName, customDbName);
  }
  for (const cat of DEFAULT_CATEGORIES) {
    await addRecord('categories', cat, customDbName);
  }
  return true;
}

/**
 * YAWMI — Domain Repositories (Tasks, Events, Finance, Budgets, Habits, Notes, Reminders, Settings)
 */



const PRIORITY_WEIGHT = {
  urgent: 4,
  high: 3,
  medium: 2,
  low: 1
};

/* ==========================================
 * 1. TASKS REPOSITORY
 * ========================================== */
const TasksRepo = {
  async createTask(input, dbName = DB_NAME) {
    const title = String(input?.title || '').trim();
    if (!title) {
      throw new Error('عنوان المهمة إلزامي ولا يمكن أن يكون فارغًا.');
    }
    const validPriorities = ['low', 'medium', 'high', 'urgent'];
    const priority = validPriorities.includes(input.priority) ? input.priority : 'medium';
    const validStatuses = ['open', 'completed', 'postponed'];
    const status = validStatuses.includes(input.status) ? input.status : 'open';
    const nowIso = new Date().toISOString();

    let estimatedMinutes = null;
    if (input.estimatedMinutes !== undefined && input.estimatedMinutes !== null && input.estimatedMinutes !== '') {
      const parsedMin = Number(input.estimatedMinutes);
      if (!Number.isFinite(parsedMin) || parsedMin <= 0) {
        throw new Error('المدة المتوقعة يجب أن تكون رقمًا موجبًا بالدقائق.');
      }
      estimatedMinutes = Math.round(parsedMin);
    }

    const task = {
      id: input.id || generateId('task'),
      title,
      description: String(input.description || '').trim(),
      priority,
      dueDate: input.dueDate ? String(input.dueDate).trim() : '',
      dueTime: input.dueTime ? String(input.dueTime).trim() : '',
      estimatedMinutes,
      category: String(input.category || 'عام').trim(),
      status,
      notes: Array.isArray(input.notes) ? input.notes : [],
      reminderMinutesBefore: input.reminderMinutesBefore !== undefined && input.reminderMinutesBefore !== ''
        ? Number(input.reminderMinutesBefore)
        : null,
      createdAt: input.createdAt || nowIso,
      updatedAt: nowIso,
      completedAt: status === 'completed' ? (input.completedAt || nowIso) : null
    };

    return addRecord(STORE_NAMES.TASKS, task, dbName);
  },

  async updateTask(id, patch, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.TASKS, id, dbName);
    if (!existing) {
      throw new Error('المهمة المطلوبة غير موجودة.');
    }
    const nextTitle = patch.title !== undefined ? String(patch.title).trim() : existing.title;
    if (!nextTitle) {
      throw new Error('عنوان المهمة إلزامي ولا يمكن أن يكون فارغًا.');
    }
    const nowIso = new Date().toISOString();
    const nextStatus = patch.status || existing.status;

    let completedAt = existing.completedAt;
    if (nextStatus === 'completed' && existing.status !== 'completed') {
      completedAt = nowIso;
    } else if (nextStatus !== 'completed') {
      completedAt = null;
    }

    let estimatedMinutes = existing.estimatedMinutes;
    if (patch.estimatedMinutes !== undefined) {
      if (patch.estimatedMinutes === null || patch.estimatedMinutes === '') {
        estimatedMinutes = null;
      } else {
        const m = Number(patch.estimatedMinutes);
        if (!Number.isFinite(m) || m <= 0) {
          throw new Error('المدة المتوقعة يجب أن تكون رقمًا موجبًا بالدقائق.');
        }
        estimatedMinutes = Math.round(m);
      }
    }

    const updated = {
      ...existing,
      ...patch,
      id: existing.id,
      title: nextTitle,
      estimatedMinutes,
      status: nextStatus,
      updatedAt: nowIso,
      completedAt
    };

    return updateRecord(STORE_NAMES.TASKS, updated, dbName);
  },

  async toggleTaskCompletion(id, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.TASKS, id, dbName);
    if (!existing) throw new Error('المهمة غير موجودة.');
    const nextStatus = existing.status === 'completed' ? 'open' : 'completed';
    return this.updateTask(id, { status: nextStatus }, dbName);
  },

  async addNoteToTask(taskId, noteText, dbName = DB_NAME) {
    const text = String(noteText || '').trim();
    if (!text) throw new Error('نص الملاحظة لا يمكن أن يكون فارغًا.');
    const existing = await getRecord(STORE_NAMES.TASKS, taskId, dbName);
    if (!existing) throw new Error('المهمة غير موجودة.');
    const notes = Array.isArray(existing.notes) ? [...existing.notes] : [];
    notes.push({
      id: generateId('tnote'),
      text,
      createdAt: new Date().toISOString()
    });
    return this.updateTask(taskId, { notes }, dbName);
  },

  async deleteTask(id, dbName = DB_NAME) {
    const reminders = await queryRecords(STORE_NAMES.REMINDERS, r => r.targetType === 'task' && r.targetId === id, dbName);
    for (const rem of reminders) {
      await deleteRecord(STORE_NAMES.REMINDERS, rem.id, dbName);
    }
    return deleteRecord(STORE_NAMES.TASKS, id, dbName);
  },

  filterAndSortTasks(tasks, filters = {}, referenceDateStr = getLocalDateString()) {
    const {
      query = '',
      status = 'all',
      priority = 'all',
      category = 'all',
      timeScope = 'all', // 'all' | 'today' | 'tomorrow' | 'week' | 'overdue' | 'nodate'
      sortBy = 'priority' // 'priority' | 'dueDate' | 'createdAt'
    } = filters;

    const q = String(query || '').trim().toLowerCase();
    const tomorrowStr = addDaysToDateString(referenceDateStr, 1);
    const weekEndStr = addDaysToDateString(referenceDateStr, 7);

    const filtered = tasks.filter(task => {
      if (status !== 'all' && task.status !== status) return false;
      if (priority !== 'all' && task.priority !== priority) return false;
      if (category !== 'all' && task.category !== category) return false;

      if (timeScope === 'today') {
        if (task.dueDate !== referenceDateStr) return false;
      } else if (timeScope === 'tomorrow') {
        if (task.dueDate !== tomorrowStr) return false;
      } else if (timeScope === 'week') {
        if (!task.dueDate || task.dueDate < referenceDateStr || task.dueDate > weekEndStr) return false;
      } else if (timeScope === 'overdue') {
        if (!task.dueDate || task.dueDate >= referenceDateStr || task.status === 'completed') return false;
      } else if (timeScope === 'nodate') {
        if (task.dueDate) return false;
      }

      if (q) {
        const inTitle = task.title?.toLowerCase().includes(q);
        const inDesc = task.description?.toLowerCase().includes(q);
        const inCat = task.category?.toLowerCase().includes(q);
        const inNotes = Array.isArray(task.notes) && task.notes.some(n => n.text?.toLowerCase().includes(q));
        if (!inTitle && !inDesc && !inCat && !inNotes) return false;
      }
      return true;
    });

    return filtered.sort((a, b) => {
      if (sortBy === 'priority') {
        const diff = (PRIORITY_WEIGHT[b.priority] || 0) - (PRIORITY_WEIGHT[a.priority] || 0);
        if (diff !== 0) return diff;
      }
      if (sortBy === 'dueDate' || sortBy === 'priority') {
        const da = a.dueDate || '9999-12-31';
        const db = b.dueDate || '9999-12-31';
        if (da !== db) return da.localeCompare(db);
      }
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
  }
};

/* ==========================================
 * 2. EVENTS & CALENDAR REPOSITORY
 * ========================================== */
const EventsRepo = {
  parseEventRange(ev) {
    const sDate = ev.startDate;
    const eDate = ev.endDate || ev.startDate;
    const sTime = ev.allDay ? '00:00' : (ev.startTime || '09:00');
    const eTime = ev.allDay ? '23:59' : (ev.endTime || '10:00');
    const start = parseLocalDate(sDate, sTime);
    const end = parseLocalDate(eDate, eTime);
    return { start, end };
  },

  detectOverlaps(candidate, allEvents) {
    const { start: cStart, end: cEnd } = this.parseEventRange(candidate);
    if (!cStart || !cEnd) return [];
    return allEvents.filter(other => {
      if (other.id === candidate.id) return false;
      const { start: oStart, end: oEnd } = this.parseEventRange(other);
      if (!oStart || !oEnd) return false;
      return cStart < oEnd && cEnd > oStart;
    });
  },

  async createEvent(input, dbName = DB_NAME) {
    const title = String(input?.title || '').trim();
    if (!title) throw new Error('عنوان الموعد إلزامي.');
    const startDate = String(input?.startDate || '').trim();
    if (!startDate) throw new Error('تاريخ بداية الموعد إلزامي.');
    const endDate = String(input?.endDate || startDate).trim();
    const allDay = Boolean(input?.allDay);
    const startTime = allDay ? '00:00' : String(input?.startTime || '09:00').trim();
    const endTime = allDay ? '23:59' : String(input?.endTime || '10:00').trim();

    const startObj = parseLocalDate(startDate, startTime);
    const endObj = parseLocalDate(endDate, endTime);
    if (endObj < startObj) {
      throw new Error('وقت نهاية الموعد لا يمكن أن يكون قبل وقت البداية.');
    }

    const nowIso = new Date().toISOString();
    const eventRecord = {
      id: input.id || generateId('ev'),
      title,
      description: String(input.description || '').trim(),
      startDate,
      startTime,
      endDate,
      endTime,
      allDay,
      location: String(input.location || '').trim(),
      notes: String(input.notes || '').trim(),
      reminderMinutes: input.reminderMinutes !== undefined && input.reminderMinutes !== ''
        ? Number(input.reminderMinutes)
        : 30,
      reminderStatus: input.reminderStatus || 'scheduled',
      notificationId: input.notificationId || null,
      createdAt: input.createdAt || nowIso,
      updatedAt: nowIso
    };

    return addRecord(STORE_NAMES.EVENTS, eventRecord, dbName);
  },

  async updateEvent(id, patch, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.EVENTS, id, dbName);
    if (!existing) throw new Error('الموعد غير موجود.');
    const merged = {
      ...existing,
      ...patch,
      id: existing.id,
      updatedAt: new Date().toISOString()
    };
    if (!String(merged.title || '').trim()) {
      throw new Error('عنوان الموعد إلزامي.');
    }
    const { start, end } = this.parseEventRange(merged);
    if (end < start) {
      throw new Error('وقت نهاية الموعد لا يمكن أن يكون قبل وقت البداية.');
    }
    return updateRecord(STORE_NAMES.EVENTS, merged, dbName);
  },

  async deleteEvent(id, dbName = DB_NAME) {
    const reminders = await queryRecords(STORE_NAMES.REMINDERS, r => r.targetType === 'event' && r.targetId === id, dbName);
    for (const rem of reminders) {
      await deleteRecord(STORE_NAMES.REMINDERS, rem.id, dbName);
    }
    return deleteRecord(STORE_NAMES.EVENTS, id, dbName);
  }
};

/* ==========================================
 * 3. FINANCE & BUDGETS REPOSITORY (DZD Exact Minor Units)
 * ========================================== */
const FinanceRepo = {
  async createTransaction(input, dbName = DB_NAME) {
    const type = input?.type === 'income' ? 'income' : (input?.type === 'expense' ? 'expense' : null);
    if (!type) {
      throw new Error('نوع العملية المالية يجب أن يكون دخلًا (income) أو مصروفًا (expense).');
    }

    const amountMinor = input.amountMinor !== undefined
      ? Math.round(Number(input.amountMinor))
      : toMinorUnits(input.amount);

    if (!Number.isFinite(amountMinor) || amountMinor <= 0) {
      throw new Error('المبلغ يجب أن يكون رقمًا موجبًا أكبر من الصفر.');
    }

    const date = String(input.date || getLocalDateString()).trim();
    const time = String(input.time || getLocalTimeString()).trim();
    const categoryId = String(input.categoryId || (type === 'income' ? 'cat_salary' : 'cat_other')).trim();
    const nowIso = new Date().toISOString();

    const tx = {
      id: input.id || generateId('tx'),
      type,
      amountMinor,
      amount: fromMinorUnits(amountMinor),
      categoryId,
      date,
      month: date.slice(0, 7),
      time,
      description: String(input.description || '').trim(),
      paymentMethod: String(input.paymentMethod || 'cash').trim(),
      notes: String(input.notes || '').trim(),
      createdAt: input.createdAt || nowIso,
      updatedAt: nowIso
    };

    return addRecord(STORE_NAMES.TRANSACTIONS, tx, dbName);
  },

  async updateTransaction(id, patch, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.TRANSACTIONS, id, dbName);
    if (!existing) throw new Error('العملية المالية غير موجودة.');

    let amountMinor = existing.amountMinor;
    if (patch.amountMinor !== undefined) {
      amountMinor = Math.round(Number(patch.amountMinor));
    } else if (patch.amount !== undefined) {
      amountMinor = toMinorUnits(patch.amount);
    }

    if (!Number.isFinite(amountMinor) || amountMinor <= 0) {
      throw new Error('المبلغ يجب أن يكون رقمًا موجبًا أكبر من الصفر.');
    }

    const date = patch.date ? String(patch.date).trim() : existing.date;
    const updated = {
      ...existing,
      ...patch,
      id: existing.id,
      amountMinor,
      amount: fromMinorUnits(amountMinor),
      date,
      month: date.slice(0, 7),
      updatedAt: new Date().toISOString()
    };

    return updateRecord(STORE_NAMES.TRANSACTIONS, updated, dbName);
  },

  async deleteTransaction(id, dbName = DB_NAME) {
    return deleteRecord(STORE_NAMES.TRANSACTIONS, id, dbName);
  },

  calculateSummary(transactions, filters = {}) {
    const {
      startDate = null,
      endDate = null,
      month = null,
      categoryId = 'all',
      type = 'all',
      query = ''
    } = filters;

    const q = String(query || '').trim().toLowerCase();
    const seenIds = new Set();
    let incomeMinor = 0;
    let expenseMinor = 0;
    const byCategoryMinor = {};
    const matchedTransactions = [];

    for (const tx of transactions) {
      if (!tx || !tx.id || seenIds.has(tx.id)) continue;
      seenIds.add(tx.id);

      if (month && tx.date?.slice(0, 7) !== month) continue;
      if (startDate && tx.date < startDate) continue;
      if (endDate && tx.date > endDate) continue;
      if (categoryId !== 'all' && tx.categoryId !== categoryId) continue;
      if (type !== 'all' && tx.type !== type) continue;

      if (q) {
        const descMatch = tx.description?.toLowerCase().includes(q);
        const noteMatch = tx.notes?.toLowerCase().includes(q);
        const catMatch = tx.categoryId?.toLowerCase().includes(q);
        if (!descMatch && !noteMatch && !catMatch) continue;
      }

      const minor = Number.isFinite(tx.amountMinor) ? Math.round(tx.amountMinor) : toMinorUnits(tx.amount);
      if (!Number.isFinite(minor) || minor <= 0) continue;

      matchedTransactions.push(tx);
      if (tx.type === 'income') {
        incomeMinor += minor;
      } else if (tx.type === 'expense') {
        expenseMinor += minor;
        byCategoryMinor[tx.categoryId] = (byCategoryMinor[tx.categoryId] || 0) + minor;
      }
    }

    const netMinor = incomeMinor - expenseMinor;
    const topCategories = Object.entries(byCategoryMinor)
      .map(([catId, totalMinor]) => ({
        categoryId: catId,
        totalMinor,
        total: fromMinorUnits(totalMinor),
        percentage: expenseMinor > 0 ? Math.round((totalMinor / expenseMinor) * 1000) / 10 : 0
      }))
      .sort((a, b) => b.totalMinor - a.totalMinor);

    return {
      incomeMinor,
      expenseMinor,
      netMinor,
      income: fromMinorUnits(incomeMinor),
      expense: fromMinorUnits(expenseMinor),
      net: fromMinorUnits(netMinor),
      count: matchedTransactions.length,
      topCategories,
      transactions: matchedTransactions.sort((a, b) => {
        const dComp = String(b.date || '').localeCompare(String(a.date || ''));
        if (dComp !== 0) return dComp;
        return String(b.time || '').localeCompare(String(a.time || ''));
      })
    };
  },

  async setBudget(input, dbName = DB_NAME) {
    const month = String(input.month || getLocalDateString().slice(0, 7)).trim();
    const categoryId = String(input.categoryId || 'ALL').trim();
    const limitMinor = input.limitMinor !== undefined
      ? Math.round(Number(input.limitMinor))
      : toMinorUnits(input.limitAmount);

    if (!Number.isFinite(limitMinor) || limitMinor <= 0) {
      throw new Error('حد الميزانية يجب أن يكون مبلغًا موجبًا أكبر من الصفر.');
    }

    const id = input.id || `budget_${month}_${categoryId}`;
    const existing = await getRecord(STORE_NAMES.BUDGETS, id, dbName);
    const record = {
      id,
      month,
      categoryId,
      limitMinor,
      limitAmount: fromMinorUnits(limitMinor),
      updatedAt: new Date().toISOString(),
      createdAt: existing?.createdAt || new Date().toISOString()
    };

    if (existing) {
      return updateRecord(STORE_NAMES.BUDGETS, record, dbName);
    }
    return addRecord(STORE_NAMES.BUDGETS, record, dbName);
  },

  async evaluateBudgets(monthKey, dbName = DB_NAME) {
    const [budgets, transactions] = await Promise.all([
      queryRecords(STORE_NAMES.BUDGETS, b => b.month === monthKey, dbName),
      queryRecords(STORE_NAMES.TRANSACTIONS, tx => tx.date?.slice(0, 7) === monthKey && tx.type === 'expense', dbName)
    ]);

    const summary = this.calculateSummary(transactions, { month: monthKey, type: 'expense' });
    const catMap = {};
    for (const c of summary.topCategories) {
      catMap[c.categoryId] = c.totalMinor;
    }

    return budgets.map(b => {
      const spentMinor = b.categoryId === 'ALL' ? summary.expenseMinor : (catMap[b.categoryId] || 0);
      const remainingMinor = b.limitMinor - spentMinor;
      const usagePercent = b.limitMinor > 0 ? Math.round((spentMinor / b.limitMinor) * 1000) / 10 : 0;
      return {
        ...b,
        spentMinor,
        remainingMinor,
        spent: fromMinorUnits(spentMinor),
        remaining: fromMinorUnits(remainingMinor),
        usagePercent,
        isNearLimit: usagePercent >= 80 && usagePercent <= 100,
        isExceeded: spentMinor > b.limitMinor
      };
    });
  }
};

const HabitsRepo = {
  async createHabit(input, dbName = DB_NAME) {

      ? input.repeatDays.map(Number)
      : [0, 1, 2, 3, 4, 5, 6];
    const targetValue = Number(input.targetValue) > 0 ? Number(input.targetValue) : 1;
    const nowIso = new Date().toISOString();

    const habit = {
      id: input.id || generateId('hab'),
      name,
      description: String(input.description || '').trim(),
      icon: String(input.icon || '🎯').trim(),
      targetType: input.targetType === 'weekly' ? 'weekly' : 'daily',
      targetValue,
      repeatDays,
      reminderTime: input.reminderTime ? String(input.reminderTime).trim() : '',
      startDate: String(input.startDate || getLocalDateString()).trim(),
      status: input.status === 'archived' ? 'archived' : 'active',
      createdAt: input.createdAt || nowIso,
      updatedAt: nowIso
    };

    return addRecord(STORE_NAMES.HABITS, habit, dbName);
  },

  async updateHabit(id, patch, dbName = DB_NAME) {
    const existing = await getRecord(STORE_NAMES.HABITS, id, dbName);
    if (!existing) throw new Error('العادة غير موجودة.');
    const updated = {
      ...existing,
      ...patch,
      id: existing.id,
      updatedAt: new Date().toISOString()
    };
    if (!String(updated.name || '').trim()) {
      throw new Error('اسم العادة إلزامي.');
    }
    return updateRecord(STORE_NAMES.HABITS, updated, dbName);
  },

  async logHabit(habitId, localDate = getLocalDateString(), value = 1, note = '', dbName = DB_NAME) {
    if (!habitId) throw new Error('معرّف العادة مطلوب.');
    const existingLogs = await queryRecords(
      STORE_NAMES.HABIT_LOGS,
      l => l.habitId === habitId && l.localDate === localDate,
      dbName
    );
    if (existingLogs.length > 0) {
      throw new Error('تم تسجيل إنجاز هذه العادة لهذا التاريخ مسبقًا.');
    }
    const logRecord = {
      id: `${habitId}_${localDate}`,
      habitId,
      localDate,
      value: Number(value) > 0 ? Number(value) : 1,
      note: String(note || '').trim(),
      createdAt: new Date().toISOString()
    };
    return addRecord(STORE_NAMES.HABIT_LOGS, logRecord, dbName);
  },

  async unlogHabit(habitId, localDate = getLocalDateString(), dbName = DB_NAME) {
    const existingLogs = await queryRecords(
      STORE_NAMES.HABIT_LOGS,
      l => l.habitId === habitId && l.localDate === localDate,
      dbName
    );
    for (const l of existingLogs) {
      await deleteRecord(STORE_NAMES.HABIT_LOGS, l.id, dbName);
    }
    return true;
  },

  async toggleHabitForDate(habitId, localDate = getLocalDateString(), dbName = DB_NAME) {
    const existingLogs = await queryRecords(
      STORE_NAMES.HABIT_LOGS,
      l => l.habitId === habitId && l.localDate === localDate,
      dbName
    );
    if (existingLogs.length > 0) {
      await this.unlogHabit(habitId, localDate, dbName);
      return { completed: false };
    }
    const habit = await getRecord(STORE_NAMES.HABITS, habitId, dbName);
    const val = habit?.targetValue || 1;
    await this.logHabit(habitId, localDate, val, '', dbName);
    return { completed: true };
  },

  calculateHabitStats(habit, habitLogs, referenceDateStr = getLocalDateString()) {
    const logsForHabit = habitLogs.filter(l => l.habitId === habit.id);
    const completedDates = new Set(
      logsForHabit
        .filter(l => Number(l.value || 1) >= Number(habit.targetValue || 1))
        .map(l => l.localDate)
    );

    const repeatDays = Array.isArray(habit.repeatDays) && habit.repeatDays.length > 0
      ? new Set(habit.repeatDays.map(Number))
      : new Set([0, 1, 2, 3, 4, 5, 6]);

    const isScheduledDay = (dateStr) => {
      const dt = parseLocalDate(dateStr);
      return dt ? repeatDays.has(dt.getDay()) : true;
    };

    // 1. Current Streak (skipping non-scheduled days)
    let currentStreak = 0;
    let cursor = referenceDateStr;
    for (let i = 0; i < 366; i++) {
      if (cursor < habit.startDate) break;
      if (isScheduledDay(cursor)) {
        if (completedDates.has(cursor)) {
          currentStreak++;
        } else {
          // If today is not completed yet, check if yesterday keeps the streak alive
          if (cursor === referenceDateStr) {
            cursor = addDaysToDateString(cursor, -1);
            continue;
          }
          break;
        }
      }
      cursor = addDaysToDateString(cursor, -1);
    }

    // 2. Adherence Rate since startDate (up to referenceDateStr)
    let scheduledCount = 0;
    let completedScheduledCount = 0;
    let dayPtr = habit.startDate <= referenceDateStr ? habit.startDate : referenceDateStr;
    let guard = 0;
    while (dayPtr <= referenceDateStr && guard < 366) {
      if (isScheduledDay(dayPtr)) {
        scheduledCount++;
        if (completedDates.has(dayPtr)) {
          completedScheduledCount++;
        }
      }
      dayPtr = addDaysToDateString(dayPtr, 1);
      guard++;
    }

    const adherencePercent = scheduledCount > 0
      ? Math.min(100, Math.round((completedScheduledCount / scheduledCount) * 100))
      : (completedDates.size > 0 ? 100 : 0);

    // 3. Last 7 days array for visual week tracker
    const weekDays = [];
    for (let offset = -6; offset <= 0; offset++) {
      const dStr = addDaysToDateString(referenceDateStr, offset);
      weekDays.push({
        date: dStr,
        scheduled: isScheduledDay(dStr),
        completed: completedDates.has(dStr)
      });
    }

    return {
      currentStreak,
      adherencePercent,
      scheduledCount,
      completedScheduledCount,
      totalLogs: logsForHabit.length,
      completedToday: completedDates.has(referenceDateStr),
      weekDays
    };
  }
};

/**
 * YAWMI — Local Backup Export & Validated Atomic Import Engine
 */
const BACKUP_FORMAT_VERSION = 1;
const SUPPORTED_BACKUP_VERSIONS = [1];
async function exportBackupData(nonSensitiveSettings = {}, dbName = DB_NAME) {
  await initDatabase(dbName);
  const storesData = {};
  const counts = {};

  for (const storeName of Object.keys(SCHEMA_STORES)) {
    const records = await getAllRecords(storeName, dbName);
    storesData[storeName] = records;
    counts[storeName] = records.length;
  }

  const exportDate = new Date().toISOString();
  const fileName = `yawmi_backup_${getLocalDateString()}.json`;

  const payload = {
    app: 'YAWMI',
    backupFormatVersion: BACKUP_FORMAT_VERSION,
    dbSchemaVersion: DB_VERSION,
    exportedAt: exportDate,
    preferences: {
      theme: nonSensitiveSettings.theme || 'dark',
      language: nonSensitiveSettings.language || 'ar',
      currency: nonSensitiveSettings.currency || 'DZD'
    },
    counts,
    stores: storesData
  };

  return {
    fileName,
    payload,
    jsonString: JSON.stringify(payload, null, 2)
  };
}
function validateBackupPayload(rawJsonOrObj) {
  let parsed;
  if (typeof rawJsonOrObj === 'string') {
    try {
      parsed = JSON.parse(rawJsonOrObj);
    } catch {
      return { valid: false, error: 'ملف النسخة الاحتياطية ليس بتنسيق JSON صالح.' };
    }
  } else if (rawJsonOrObj && typeof rawJsonOrObj === 'object') {
    parsed = rawJsonOrObj;
  } else {
    return { valid: false, error: 'محتوى ملف النسخة الاحتياطية فارغ أو غير صالح.' };
  }

  if (parsed.app !== 'YAWMI') {
    return { valid: false, error: 'هذا الملف لا ينتمي لتطبيق يومي (YAWMI).' };
  }

  if (!SUPPORTED_BACKUP_VERSIONS.includes(Number(parsed.backupFormatVersion))) {
    return {
      valid: false,
      error: `إصدار تنسيق النسخة الاحتياطية (${parsed.backupFormatVersion}) غير مدعوم في هذا الإصدار.`
    };
  }

  if (!parsed.stores || typeof parsed.stores !== 'object') {
    return { valid: false, error: 'بنية المخازن (stores) مفقودة في ملف النسخة الاحتياطية.' };
  }

  const summary = {};
  const seenIdsPerStore = {};

  for (const storeName of Object.keys(SCHEMA_STORES)) {
    const list = parsed.stores[storeName];
    if (list === undefined) {
      summary[storeName] = 0;
      continue;
    }
    if (!Array.isArray(list)) {
      return { valid: false, error: `بيانات المخزن (${storeName}) يجب أن تكون مصفوفة.` };
    }
    seenIdsPerStore[storeName] = new Set();
    for (const item of list) {
      if (!item || typeof item !== 'object' || typeof item.id !== 'string' || !item.id.trim()) {
        return { valid: false, error: `يوجد سجل بدون معرّف صالح (id) داخل مخزن (${storeName}).` };
      }
      if (seenIdsPerStore[storeName].has(item.id)) {
        return { valid: false, error: `يوجد تعارض معرّفات مكررة (${item.id}) داخل مخزن (${storeName}).` };
      }
      seenIdsPerStore[storeName].add(item.id);

      // Required field checks per store
      if (storeName === 'tasks' && !String(item.title || '').trim()) {
        return { valid: false, error: `توجد مهمة بدون عنوان في النسخة الاحتياطية (${item.id}).` };
      }
      if (storeName === 'transactions' && (!Number.isFinite(Number(item.amountMinor)) || Number(item.amountMinor) <= 0)) {
        return { valid: false, error: `توجد عملية مالية بمبلغ غير صالح (${item.id}).` };
      }
    }
    summary[storeName] = list.length;
  }

  return {
    valid: true,
    data: parsed,
    summary,
    exportedAt: parsed.exportedAt || null
  };
}
async function importBackupData(rawJsonOrObj, options = { mode: 'replace' }, dbName = DB_NAME) {
  const validation = validateBackupPayload(rawJsonOrObj);
  if (!validation.valid) {
    throw new Error(validation.error);
  }

  const { data, summary } = validation;
  const mode = options?.mode === 'merge' ? 'merge' : 'replace';

  // Snapshot current data before modifying so we can roll back if any unexpected error occurs
  const snapshot = {};
  for (const storeName of Object.keys(SCHEMA_STORES)) {
    snapshot[storeName] = await getAllRecords(storeName, dbName);
  }

  try {
    for (const storeName of Object.keys(SCHEMA_STORES)) {
      const incoming = data.stores[storeName] || [];
      if (mode === 'replace') {
        await clearStore(storeName, dbName);
        for (const rec of incoming) {
          await addRecord(storeName, rec, dbName);
        }
      } else {
        for (const rec of incoming) {
          await updateRecord(storeName, rec, dbName);
        }
      }
    }
    return {
      success: true,
      mode,
      summary,
      preferences: data.preferences || null
    };
  } catch (err) {
    // Restore from snapshot to guarantee zero data loss
    for (const [storeName, oldRecords] of Object.entries(snapshot)) {
      await clearStore(storeName, dbName);
      for (const rec of oldRecords) {
        await updateRecord(storeName, rec, dbName);
      }
    }
    throw new Error(`فشل الاستيراد وتمت استعادة البيانات الأصلية بأمان: ${err.message}`);
  }
}

/**
 * YAWMI — Toast Notification Component (Accessible, Non-blocking, Auto-dismiss)
 */
function showToast(message, type = 'success', durationMs = 3200) {
  if (typeof document === 'undefined') return;
  let container = document.getElementById('yawmi-toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'yawmi-toast-container';
    container.className = 'toast-container';
    container.setAttribute('aria-live', 'polite');
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast toast-${escapeHtml(type)}`;

  const textSpan = document.createElement('span');
  textSpan.textContent = String(message || '');

  const closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'icon-btn';
  closeBtn.style.width = '26px';
  closeBtn.style.height = '26px';
  closeBtn.setAttribute('aria-label', 'إغلاق');
  closeBtn.textContent = '✕';
  closeBtn.addEventListener('click', () => toast.remove());

  toast.appendChild(textSpan);
  toast.appendChild(closeBtn);
  container.appendChild(toast);

  if (durationMs > 0) {
    setTimeout(() => {
      if (toast.parentNode) toast.remove();
    }, durationMs);
  }
}

/**

        if (busy) return;

          closeModal();
        } finally {
          busy = false;
        }
      });

  });
}

    scope === 'all' || scope === 'tasks' ? getAllRecords(STORE_NAMES.TASKS, dbName) : [],
    scope === 'all' || scope === 'events' ? getAllRecords(STORE_NAMES.EVENTS, dbName) : [],
    scope === 'all' || scope === 'transactions' ? getAllRecords(STORE_NAMES.TRANSACTIONS, dbName) : [],
    scope === 'all' || scope === 'notes' ? getAllRecords(STORE_NAMES.NOTES, dbName) : [],
    getAllRecords(STORE_NAMES.CATEGORIES, dbName)

  const results = [];

  for (const t of tasks) {
    if (status !== 'all' && t.status !== status) continue;
    if (category !== 'all' && t.category !== category) continue;
    if (dateFrom && (!t.dueDate || t.dueDate < dateFrom)) continue;
    if (dateTo && (!t.dueDate || t.dueDate > dateTo)) continue;
    if (q) {
      const hay = `${t.title} ${t.description || ''} ${t.category || ''}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'task',
      id: t.id,
      title: t.title,
      subtitle: `مهمة • ${t.dueDate || 'دون تاريخ'} • ${t.status === 'completed' ? 'مكتملة' : 'مفتوحة'}`,
      date: t.dueDate || t.createdAt?.slice(0, 10) || '',
      raw: t
    });
  }

  for (const ev of events) {
    if (dateFrom && ev.startDate < dateFrom) continue;
    if (dateTo && ev.startDate > dateTo) continue;
    if (q) {
      const hay = `${ev.title} ${ev.description || ''} ${ev.location || ''} ${ev.notes || ''}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'event',
      id: ev.id,
      title: ev.title,
      subtitle: `موعد • ${ev.startDate} ${ev.allDay ? '(طوال اليوم)' : ev.startTime}`,
      date: ev.startDate,
      raw: ev

    if (dateFrom && tx.date < dateFrom) continue;
    if (dateTo && tx.date > dateTo) continue;
    const catLabel = catNameMap[tx.categoryId] || tx.categoryId;
    if (q) {
      const hay = `${tx.description || ''} ${tx.notes || ''} ${catLabel}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'transaction',
      id: tx.id,
      title: `${tx.type === 'income' ? '+' : '-'}${formatMoney(tx.amountMinor)} — ${catLabel}`,
      subtitle: `عملية مالية • ${tx.date} ${tx.description ? '• ' + tx.description : ''}`,
      date: tx.date,
      raw: tx
    });
  }

  for (const n of notes) {
    if (category !== 'all' && n.category !== category) continue;
    const nDate = (n.updatedAt || n.createdAt || '').slice(0, 10);
    if (dateFrom && nDate < dateFrom) continue;
    if (dateTo && nDate > dateTo) continue;
    if (q) {
      const checklistText = (n.checklistItems || []).map(i => i.text).join(' ');
      const tagsText = (n.tags || []).join(' ');
      const hay = `${n.title} ${n.content || ''} ${checklistText} ${tagsText}`.toLowerCase();
      if (!hay.includes(q)) continue;
    }
    results.push({
      type: 'note',
      id: n.id,
      title: n.title,
      subtitle: `ملاحظة • ${(n.tags || []).join(', ') || n.category || 'عام'}`,
      date: nDate,
      raw: n
    });
  }

  return {
    totalCount: results.length,
    results
  };
}

function generateNumericNotificationId(strId) {

  for (let i = 0; i < strId.length; i++) {

  }

        return res.display || 'prompt'; // 'granted' | 'denied' | 'prompt'

        return 'denied';

  async scheduleReminder({ targetType, targetId, title, body, triggerDateObj }, dbName = DB_NAME) {

    }

    // Prevent duplicate reminders for the same target item by cancelling existing first
    await this.cancelRemindersForTarget(targetType, targetId, dbName);

    const reminderId = `rem_${targetType}_${targetId}`;
    const notificationId = generateNumericNotificationId(reminderId);
    const triggerIso = triggerDateObj instanceof Date ? triggerDateObj.toISOString() : new Date(triggerDateObj).toISOString();

    const perm = await this.checkPermissionStatus();
    let status = 'scheduled';

    const capPlugin = getCapacitorLocalNotifications();
    if (capPlugin && perm === 'granted') {
      try {
        await capPlugin.cancel({ notifications: [{ id: notificationId }] });
        await capPlugin.schedule({
          notifications: [
            {
              id: notificationId,
              title: String(title || 'تذكير يومي | YAWMI'),
              body: String(body || ''),
              schedule: {
                at: new Date(triggerIso),
                allowWhileIdle: true
              },
              extra: { targetType, targetId, reminderId }
            }
          ]

        status = 'scheduled_native';
      } catch {

      }
    } else if (perm === 'denied') {

      updatedAt: new Date().toISOString()

/**
 * YAWMI — Rule-Based Local Smart Assistant & Optional Consent-Gated Online AI Connector
 * Transparent deterministic rule engine — never fabricates durations or appointments.
 */




const PRIORITY_BASE = {
  urgent: 100,
  high: 70,
  medium: 40,
  low: 15
};
const LocalAssistant = {
  /**
   * Ranks open tasks using configurable weights and actual user fields.
   * Never invents estimatedMinutes or dueDate if not provided by user.
   */
  rankTasks(tasks, weights = {}, context = {}) {
    const referenceDateStr = context.referenceDateStr || getLocalDateString();
    const availableMinutesBeforeNextEvent = context.availableMinutesBeforeNextEvent ?? null;

    const wPriority = Number(weights.priority ?? 35) / 35;
    const wProximity = Number(weights.dueProximity ?? 25) / 25;
    const wOverdue = Number(weights.overdueBonus ?? 40) / 40;
    const wShortDuration = Number(weights.shortDurationBonus ?? 15) / 15;

    const openTasks = tasks.filter(t => t && t.status !== 'completed');

    return openTasks.map(task => {
      let score = 0;
      const reasons = [];

      // 1. Priority Factor
      const pScore = (PRIORITY_BASE[task.priority] || 40) * wPriority;
      score += pScore;
      if (task.priority === 'urgent') reasons.push('أولوية عاجلة');
      else if (task.priority === 'high') reasons.push('أولوية عالية');

      // 2. Overdue & Due Proximity Factor (strictly from real dueDate)
      let isOverdue = false;
      let isDueToday = false;
      if (task.dueDate) {
        if (task.dueDate < referenceDateStr) {
          isOverdue = true;
          score += 95 * wOverdue;
          reasons.push(`متأخرة منذ ${task.dueDate}`);
        } else if (task.dueDate === referenceDateStr) {
          isDueToday = true;
          score += 55 * wProximity;
          reasons.push('مستحقة اليوم');
        } else {
          score += 15 * wProximity;
        }
      }

      // 3. Fit before next appointment (ONLY if user explicitly entered estimatedMinutes)
      let fitsBeforeNextEvent = false;
      if (
        Number.isFinite(task.estimatedMinutes) &&
        task.estimatedMinutes > 0 &&
        availableMinutesBeforeNextEvent !== null &&
        availableMinutesBeforeNextEvent > 0
      ) {
        if (task.estimatedMinutes <= availableMinutesBeforeNextEvent) {
          fitsBeforeNextEvent = true;
          score += 35 * wShortDuration;
          reasons.push(`تستغرق ${task.estimatedMinutes} دقيقة وتناسب الوقت المتاح قبل موعدك القادم (${availableMinutesBeforeNextEvent} دقيقة)`);
        }
      }

      return {
        task,
        score: Math.round(score * 10) / 10,
        isOverdue,
        isDueToday,
        fitsBeforeNextEvent,
        reasons

  async analyzeWorkspace(options = {}, dbName = DB_NAME) {

      getAllRecords(STORE_NAMES.EVENTS, dbName),

      getAllRecords(STORE_NAMES.HABITS, dbName),

    // 1. Check upcoming events today and calculate available window before next event
    const todayEvents = events
      .filter(e => e.startDate === todayStr && !e.allDay)
      .sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));

    let nextEvent = null;

    const nowDt = parseLocalDate(todayStr, nowTimeStr);

    for (const ev of todayEvents) {
      const evStart = parseLocalDate(ev.startDate, ev.startTime);
      if (evStart && nowDt && evStart > nowDt) {
